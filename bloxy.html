  (function loop(now){ raf=requestAnimationFrame(loop);
    const sky=c.createLinearGradient(0,0,0,H); sky.addColorStop(0,c1); sky.addColorStop(1,c2); c.fillStyle=sky; c.fillRect(0,0,W,H);

function rowsToLevel(n,rows){ const w=80,h=12, map={".":0,"#":1,"L":2,"o":3,"C":4,"F":5,"T":6,"I":7}; const t=[]; rows.forEach(r=>[...r].forEach(ch=>t.push(map[ch]??0))); for(let x=0;x<6;x++){ t[(h-1)*w+x]=1; for(let y=0;y<h-1;y++) if(t[y*w+x]===2) t[y*w+x]=0; } if(!t.includes(5)){ t[(h-1)*w+w-2]=1; t[(h-2)*w+w-2]=5; } return {id:Date.now().toString(36),n,w,h,t}; }
function procLevel(prompt){ const lava=/lave|feu|volcan/i.test(prompt), ice=/glace|hiver|neige/i.test(prompt), rows=[...Array(12)].map(()=>Array(80).fill(".")); let y=11; for(let x=0;x<6;x++) rows[11][x]="#"; let x=6;
  while(x<74){ const gap=ri(1,3), len=ri(2,4); x+=gap; y=Math.max(4,Math.min(11,y+ri(-2,1))); for(let i=0;i<len&&x+i<78;i++){ rows[y][x+i]=ice&&Math.random()<.4?"I":Math.random()<.08?"T":"#"; if(lava&&y<11) rows[11][x+i-gap]="L"; } if(Math.random()<.6) rows[Math.max(0,y-2)][x+1]="o"; if(x%25<4) rows[y-1][x]="C"; x+=len; }
  rows[y][76]="#"; rows[y][77]="#"; rows[y-1][77]="F"; return rowsToLevel((prompt.slice(0,20)||"Niveau IA"),rows.map(r=>r.join(""))); }

const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const monthKey=d=>`${d.getFullYear()}-${d.getMonth()}`;
function awRows(cat){ const seedF=n=>{ let h=[...n].reduce((x,c)=>x*31+c.charCodeAt(0)>>>0,5); return (h%9973)/9973; };

  if(cat==="cre") return [...new Set(OTHER.map(o=>o[3]))].map(n=>({n,v:Math.round(5e3+seedF(n)*4e7)})).concat([{n:S.disp,v:S.fol,me:1}]).sort((a,b)=>b.v-a.v);
  return [...new Set(OTHER.map(o=>o[3]))].map(n=>({n,v:Math.round(1e3+seedF(n+"s")*5e4)})).concat([{n:S.disp,v:S.ia.subs+S.lvls.length*50,me:1}]).sort((a,b)=>b.v-a.v); }

  let ac=null; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); const t0=ac.currentTime; for(let i=0;i<40;i++){ const t=t0+i*.25, o=ac.createOscillator(), gn=ac.createGain(); o.frequency.value=i%4===0?55:i%2?220:110; o.type=i%4===0?"sine":"square"; gn.gain.setValueAtTime(i%4===0?.5:.05,t); gn.gain.exponentialRampToValueAtTime(.001,t+.2); o.connect(gn).connect(ac.destination); o.start(t); o.stop(t+.22); } }catch(e){}
  let i=0; const fin=()=>{ clearInterval(iv); try{ ac&&ac.close(); }catch(e){} ov.remove(); if(g.trD!==new Date().toDateString()){ g.trD=new Date().toDateString(); const add=Math.round(g.pl*.2+80); g.pl+=add; save(); toast(`🎬 Ton trailer tourne : +${nf(add)} joueurs sur « ${g.n} » !`); } };

function cube(w,h,d,col,front,extra){ const f=(tr,ww,hh,bg,inner)=>`<div style="position:absolute;left:50%;top:50%;width:${ww}px;height:${hh}px;margin:${-hh/2}px 0 0 ${-ww/2}px;background:${bg};transform:${tr};border-radius:3px;overflow:hidden;backface-visibility:hidden">${inner||""}</div>`, dk=shade(col,.78), lt=shade(col,1.08);

const _og=openGame; openGame=function(id){ _og(id); const g=G(id), btn=$("gp"); if(!g||!btn) return;
  btn.insertAdjacentHTML("afterend",`<div id="gon" class="hint" style="text-align:center;margin-top:6px">🌐 …</div>${g.mine?`<button class="btn w" id="gtr" style="margin-top:8px">🎬 Voir le trailer (+ joueurs une fois par jour)</button>`:""}`);
  if($("gtr")) $("gtr").onclick=()=>{ close(); trailer(g); };
  if(!ONLINE){ $("gon").textContent="🌐 Multijoueur disponible sur le site en ligne"; return; }
  bxApi("count",{rooms:[("r_"+g.id).replace(/[^a-zA-Z0-9_-]/g,"").slice(0,24)]}).then(j=>{ const n=Object.values(j.counts||{})[0]||0; if($("gon")) $("gon").textContent=n?`🌐 ${n} vrai${n>1?"s":""} joueur${n>1?"s":""} dedans en ce moment !`:"🌐 Aucun vrai joueur pour l'instant : invite tes potes !"; }).catch(()=>{ if($("gon")) $("gon").textContent="🌐 Multijoueur indisponible"; }); };
const _ob2=openBell; openBell=function(tab,who){ if(tab!=="mod"){ _ob2(tab,who); const ch=document.querySelector("#sheet .chips"); if(ch&&!ch.querySelector("[data-bmod]")){ ch.insertAdjacentHTML("beforeend",`<button data-bmod="1">🛡️ Modération (${S.reports.length})</button>`); ch.querySelector("[data-bmod]").onclick=()=>openBell("mod"); } return; }
  modal(`<div class="chips"><button data-bt="req">👋 Amis</button><button data-bt="trade">🔁 Échanges</button><button data-bt="msg">💬 Messages</button><button class="on">🛡️ Modération (${S.reports.length})</button></div>
    <div class="card" style="margin-top:12px;display:flex;align-items:center;gap:10px"><span style="font-size:26px">🛡️</span><div class="grow"><b>Réputation de modérateur : ${S.modRep}/100</b><div class="hint" style="font-size:12px">Bonne décision = +5 et 50 Bloxbux · erreur = −10</div></div></div>
    ${S.reports.length?S.reports.map((r,i)=>`<div class="card" style="margin-top:10px"><b>🚩 ${esc(r.r)}</b><div class="hint">${esc(r.by)} signale <b style="color:var(--tx)">${esc(r.who)}</b></div><div style="margin:8px 0;display:grid;gap:4px">${r.ev.map(x=>`<div style="background:var(--bg2);padding:6px 10px;border-radius:9px;font-size:13px">💬 « ${esc(x)} »</div>`).join("")}</div><div style="display:flex;gap:8px"><button class="btn r w" data-mb="${i}">🔨 Bannir</button><button class="btn w" data-mi="${i}">✅ Innocent</button></div></div>`).join(""):`<p class="hint" style="margin-top:10px">Aucun signalement pour l'instant.</p>`}
    <button class="btn w" id="bcl" style="margin-top:12px">Fermer</button>`,()=>{
    document.querySelectorAll("[data-bt]").forEach(b=>b.onclick=()=>openBell(b.dataset.bt));
    const decide=(i,ban)=>{ const r=S.reports.splice(i,1)[0], ok=r.g===ban; if(ok){ S.modRep=Math.min(100,S.modRep+5); S.bux+=50; toast(ban?`🔨 ${r.who} banni : c'était bien un tricheur ✅`:`✅ Bonne décision : ${r.who} était innocent`); } else { S.modRep=Math.max(0,S.modRep-10); toast(ban?`😬 ${r.who} était innocent… −10 réputation`:`😬 ${r.who} était coupable… −10 réputation`); } if(S.modRep>=80&&!S.badges.includes("🛡️ Super modo")) S.badges.push("🛡️ Super modo"); save(); head(); openBell("mod"); };
    document.querySelectorAll("[data-mb]").forEach(b=>b.onclick=()=>decide(+b.dataset.mb,true)); document.querySelectorAll("[data-mi]").forEach(b=>b.onclick=()=>decide(+b.dataset.mi,false));
    $("bcl").onclick=()=>{ close(); render(); }; }); };
const _bell2=bell; bell=function(){ _bell2(); const b=$("tbell"); if(!b) return; const extra=S.reports.length; if(!extra) return; const sp=b.querySelector("span"), n=(sp?parseInt(sp.textContent)||0:0)+extra; b.innerHTML=`🔔<span style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:10.5px;font-weight:900;border-radius:999px;padding:1px 5px">${n>99?"99+":n}</span>`; };
const _rd2=render; render=function(){ if(page==="ia"){ head(); nav(); renderIA(); return; } _rd2(); const m=$("main");
  if(page==="home"){ const anchor=$("evb")||m.querySelector(".hero"); if(anchor){ anchor.insertAdjacentHTML("afterend",liveEvBanner()+`<button class="card" id="hia" style="width:100%;margin-top:12px;display:flex;align-items:center;gap:12px;text-align:left;background:linear-gradient(135deg,#0c4a6e,#5b21b6);border:0"><span style="font-size:32px">🤖</span><div class="grow"><b style="font-size:16px">BLOXY IA</b><div style="font-size:12.5px;opacity:.9">${S.ia.subs?`${nf(S.ia.subs)} abonnés · l'IA crée des sites`:"Crée des sites avec l'IA et gagne des abonnés"}</div></div><span style="font-size:20px">›</span></button>`); }
    if($("lvev")) $("lvev").onclick=joinLive; if($("hia")) $("hia").onclick=()=>go("ia"); if(S.ms.awNew&&S.aw.last) setTimeout(awardsShow,400); }
  if(page==="disc"){ m.insertAdjacentHTML("beforeend",awardsHTML()); if($("awl")) $("awl").onclick=awardsShow; }
  if(page==="shop"){ const c=m.querySelector(".card"); if(c){ c.insertAdjacentHTML("afterend",`<button class="btn w" id="sbo" style="margin-top:12px;background:linear-gradient(135deg,#065f46,#16a34a);border:0">📈 Bourse des Limités (prix en direct)</button>`); $("sbo").onclick=openBourse; } }
  if(page==="avatar"){ const c=m.querySelector(".card"); if(c){ c.insertAdjacentHTML("afterend",`<button class="btn p w" id="a3d" style="margin-top:10px">🧊 Voir mon avatar en 3D + emotes</button>`); $("a3d").onclick=open3D; } }
  if(page==="prof"){ const s=m.querySelector(".stats"); if(s) s.insertAdjacentHTML("afterend",`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn w" id="pia">🤖 BLOXY IA</button><button class="btn w" id="p3d">🧊 Avatar 3D</button></div>`); if($("pia")) $("pia").onclick=()=>go("ia"); if($("p3d")) $("p3d").onclick=open3D; } };

$("tbell").onclick=()=>openBell();
save(); render(); bell();
})();
</script>
</body>
</html>
