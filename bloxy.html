      <div class="stats" style="margin-top:14px"><div><b>${nf(S.fr.length)}</b><span>Amis</span></div><div><b>${nf(S.fol)}</b><span>Abonnés</span></div><div><b>${nf(S.fing)}</b><span>Abonnements</span></div></div>
      <div class="card" style="margin-top:12px"><b>À propos</b><p style="margin:6px 0 0">${esc(S.bio)}</p></div>
      <div class="card" style="margin-top:12px;display:flex;gap:14px;align-items:center"><div style="width:120px;height:150px;flex:none">${avatarSVG(S)}</div><div class="grow"><div class="hint">Valeur de l'inventaire</div><div class="big" style="display:flex;align-items:center;gap:6px">${COIN}${nf(val)}</div><div class="hint" style="margin-top:6px">${inv.length} objets · ${inv.filter(i=>i.r==="lim"||i.r==="adm").length} rares</div></div></div>
      <h2>💎 Vitrine</h2><div class="grid">${show.map(it=>`<div class="icard"><div class="pv">${itemPreview(it)}</div><div class="nm">${esc(it.n)}</div><span class="rar" style="background:${RAR[it.r][1]}22;color:${RAR[it.r][1]}">${RAR[it.r][0]}</span></div>`).join("")}</div>
      <h2>🎮 Créations</h2><div class="row">${S.games.map(gcard).join("")}</div>
      <h2>🏅 Badges</h2><div class="chips" style="flex-wrap:wrap">${S.badges.map(x=>`<button>${esc(x)}</button>`).join("")}</div>`; bindG(); } }
function modal(html,after){ $("sheet").innerHTML=html; $("modal").classList.add("on"); after&&after(); }
function close(){ $("modal").classList.remove("on"); }
$("modal").onclick=e=>{ if(e.target.id==="modal") close(); };
function openItem(id){ const it=IT(id), o=S.inv.includes(id), R=RAR[it.r], left=it.stock?it.stock-(S.sold[id]||0):null;
  modal(`<div style="display:flex;gap:14px"><div class="icard" style="width:140px;flex:none;padding:6px"><div class="pv">${itemPreview(it)}</div></div><div class="grow"><b style="font-size:19px">${esc(it.n)}</b><div style="margin:6px 0"><span class="rar" style="background:${R[1]}22;color:${R[1]}">${R[0]}</span></div><div class="hint">${CATS.find(c=>c[0]===it.t)[2]} · par BLOXY</div><div class="big" style="display:flex;align-items:center;gap:6px;margin-top:8px">${it.p?COIN+nf(it.p):"Gratuit"}</div>${left!==null?`<div class="hint" style="color:#fca5a5">Il en reste ${Math.max(0,left)} / ${it.stock}</div>`:""}</div></div>
    <div style="display:flex;gap:8px;margin-top:16px">${o?`<button class="btn p w" id="iw">🧍 Porter</button>`:`<button class="btn g w" id="ib" ${left===0?"disabled":""}>${left===0?"Épuisé":"Acheter"}</button>`}<button class="btn" id="ic">Fermer</button></div>`,()=>{
    $("ic").onclick=close;
    if($("iw")) $("iw").onclick=()=>{ S.eq[it.t]=id; save(); close(); toast("🧍 Équipé !"); go("avatar"); };
    if($("ib")) $("ib").onclick=()=>{ if(S.bux<it.p) return toast("Pas assez de Bloxbux 💸"); S.bux-=it.p; S.inv.push(id); if(it.stock) S.sold[id]=(S.sold[id]||0)+1; if(it.r==="lim"&&!S.badges.includes("💎 Collectionneur")) S.badges.push("💎 Collectionneur"); log(`🛍️ Acheté ${it.n}`); save(); close(); toast(`✅ ${it.n} est à toi !`); render(); }; }); }
function openGame(id){ const g=G(id); const by=g.mine?`${esc(S.user)}${cert()}`:esc(g.by);
  modal(`<div class="thumb" style="aspect-ratio:16/9">${thumbSVG(g)}</div><b style="display:block;font-size:21px;margin-top:12px">${esc(g.n)}</b><div class="hint">par ${by} · ${GENRES.find(x=>x[0]===g.g)[1]} ${GENRES.find(x=>x[0]===g.g)[2]}</div>
    <button class="btn g w" id="gp" style="margin-top:14px;font-size:20px;padding:14px">▶ JOUER</button>
    <div class="stats" style="margin-top:14px"><div><b>${nf(g.pl)}</b><span>En ligne</span></div><div><b>${nf(g.vis)}</b><span>Visites</span></div><div><b>${nf(g.fav)}</b><span>Favoris</span></div><div><b>${g.like} %</b><span>J'aime</span></div></div>
    <div class="card" style="margin-top:12px"><b>Description</b><p class="hint" style="margin:6px 0 0">${g.mine?"Un jeu créé par "+esc(S.user)+". Grimpe, saute et ramasse un max de pièces pour gagner des Bloxbux !":"Saute de plateforme en plateforme, évite le vide et ramasse les pièces. Chaque pièce te rapporte des Bloxbux."}</p></div>
    <button class="btn w" id="gc" style="margin-top:10px">Fermer</button>`,()=>{ $("gc").onclick=close; $("gp").onclick=()=>{ close(); playGame(g); }; }); }

/* ================= MINI-JEU (obby) ================= */
function playGame(g){ S.recent=[g.id,...S.recent.filter(x=>x!==g.id)].slice(0,8); g.vis++; save();
  const pl=$("play"); pl.classList.add("on"); const [c1,c2,c3]=THEMES[g.g]||THEMES.obby;
  pl.innerHTML=`<div class="load" id="ld"><div style="text-align:center"><div style="width:150px;margin:0 auto;border-radius:16px;overflow:hidden">${thumbSVG(g)}</div><b style="display:block;margin-top:12px;font-size:18px">${esc(g.n)}</b><div class="hint" id="ldt">Chargement…</div></div></div><canvas id="cv"></canvas><div style="position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none"><b id="hud" style="background:#0008;padding:6px 12px;border-radius:10px"></b><div style="display:flex;gap:6px;pointer-events:auto"><button class="btn" id="qa">🛠️</button><button class="btn" id="qx">✖ Quitter</button></div></div><div id="qp" style="position:absolute;top:62px;right:12px;width:230px;display:none;background:#151821f2;border:1px solid #7f1d1d;border-radius:16px;padding:12px;z-index:3"></div>`;
  const cv=$("cv"), c=cv.getContext("2d"), dpr=Math.min(2,devicePixelRatio||1), W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+"px"; cv.style.height=H+"px"; c.scale(dpr,dpr);
  const plats=[], coins=[]; let x=0; for(let i=0;i<140;i++){ const w=i<2?260:ri(90,200), gap=i<2?0:ri(50,130), y=H*.66+((i%4)-1.5)*H*.06; plats.push({x:x+gap,w,y,c:i%2?c3:"#e5e7eb"}); if(i>1&&Math.random()<.75) coins.push({x:x+gap+w/2,y:y-55,t:0}); x+=gap+w; }
  const P={x:80,y:H*.4,vy:0,j:0}; let cam=0, got=0, t0=0, last=0, raf, over=false, cp=80, falls=0, paused=false, bonusT=0; const M={fly:0,spd:0,god:0,mag:0};
  const img=new Image(); img.src="data:image/svg+xml;utf8,"+encodeURIComponent(avatarSVG(S));
  const jump=()=>{ if(over||!t0||paused) return; if(M.fly){ P.vy=-H*.75; return; } if(P.j<2){ P.vy=-H*1.2; P.j++; } };
  cv.onpointerdown=e=>{ e.preventDefault(); jump(); }; const kd=e=>{ if(e.key===" "||e.key==="ArrowUp"){ e.preventDefault(); jump(); } }; addEventListener("keydown",kd);
  const end=()=>{ if(over) return; over=true; cancelAnimationFrame(raf); removeEventListener("keydown",kd); const gain=got*5; S.bux+=gain; if(gain) log(`🎮 ${g.n} : +${gain} Bloxbux`); save(); head();
    modal(`<div style="text-align:center"><div style="font-size:46px">🏁</div><b style="font-size:21px">Partie terminée !</b><p class="hint">${got} pièces ramassées · ${falls} chute(s)</p><div class="big" style="display:flex;justify-content:center;align-items:center;gap:6px">+${COIN}${nf(gain)}</div><button class="btn p w" id="ok" style="margin-top:16px">Continuer</button></div>`,()=>{ $("ok").onclick=()=>{ close(); pl.classList.remove("on"); pl.innerHTML=""; render(); }; }); };
  $("qx").onclick=end;
  const qp=$("qp"), panel=()=>{ qp.innerHTML=`<b>🛠️ Admin en jeu</b><div style="display:grid;gap:6px;margin-top:8px">${[["fly","🕊️ Voler"],["spd","⚡ Vitesse x2"],["god","🛡️ Invincible"],["mag","🧲 Aimant à pièces"]].map(([k,l])=>`<button class="btn ${M[k]?"p":""}" data-qm="${k}" style="justify-content:flex-start">${M[k]?"✅":"⬜"} ${l}</button>`).join("")}<button class="btn" id="qc">🪙 +50 pièces</button><button class="btn" id="qt">⏱️ +30 secondes</button><button class="btn g" id="qr">▶ Reprendre</button></div>`;
    qp.querySelectorAll("[data-qm]").forEach(b=>b.onclick=()=>{ M[b.dataset.qm]^=1; panel(); });
    $("qc").onclick=()=>{ got+=50; toast("🪙 +50 pièces"); }; $("qt").onclick=()=>{ bonusT+=30; toast("⏱️ +30 secondes"); };
    $("qr").onclick=()=>{ qp.style.display="none"; paused=false; last=performance.now(); }; };
  $("qa").onclick=()=>{ if(!t0||over) return; if(qp.style.display==="block") return $("qr").click(); if(S.pin&&!admin.ok){ const v=prompt("Code du panel admin :"); if(v===null) return; if(v.trim()!==S.pin) return toast("❌ Mauvais code"); admin.ok=1; } paused=true; qp.style.display="block"; panel(); };
  setTimeout(()=>{ $("ldt").textContent="Connexion au serveur…"; },600); setTimeout(()=>{ $("ld").remove(); t0=performance.now(); last=t0; },1400);
  (function loop(now){ raf=requestAnimationFrame(loop);
    const sky=c.createLinearGradient(0,0,0,H); sky.addColorStop(0,c1); sky.addColorStop(1,c2); c.fillStyle=sky; c.fillRect(0,0,W,H);
    if(t0&&paused){ t0+=now-last; last=now; }
    if(t0&&!paused){ const dt=Math.min(.033,(now-last)/1000); last=now; const T=(now-t0)/1000, left=Math.max(0,40+bonusT-T); if(!left) return end();
      P.x+=W*.38*dt*(1+T/50)*(M.spd?2:1); P.vy+=H*(M.fly?1.4:3)*dt; if(M.fly) P.vy=Math.min(P.vy,H*.5); const py=P.y; P.y+=P.vy*dt; if(M.fly&&P.y<70){ P.y=70; P.vy=0; } if(M.god&&P.y>H*.82){ P.y=H*.82; P.vy=-H*1.1; }
      for(const p of plats) if(P.x+12>p.x&&P.x-12<p.x+p.w&&py<=p.y&&P.y>=p.y&&P.vy>0){ P.y=p.y; P.vy=0; P.j=0; cp=Math.max(cp,p.x+20); }
      if(P.y>H+60){ falls++; P.x=cp; P.y=H*.3; P.vy=0; }
      for(const k of coins){ if(k.t) continue; if(M.mag&&Math.abs(k.x-P.x)<220){ k.x+=(P.x-k.x)*.18; k.y+=(P.y-30-k.y)*.18; } if(Math.abs(k.x-P.x)<26&&Math.abs(k.y-(P.y-30))<34){ k.t=1; got++; } }
      cam+=(P.x-W*.3-cam)*.2; $("hud").innerHTML=`🪙 ${got} · ⏱️ ${Math.ceil(left)} s`; }
    c.save(); c.translate(-cam*.3,0); c.fillStyle="#ffffff22"; for(let i=0;i<30;i++){ c.beginPath(); c.arc(i*170+40,H*.18+(i%3)*30,26+(i%4)*8,0,7); c.fill(); } c.restore();
    c.save(); c.translate(-cam,0);
    for(const p of plats){ if(p.x+p.w<cam-20||p.x>cam+W+20) continue; c.fillStyle="#0004"; c.fillRect(p.x+4,p.y+6,p.w,16); c.fillStyle=p.c; c.fillRect(p.x,p.y,p.w,16); c.fillStyle="#0002"; c.fillRect(p.x,p.y+11,p.w,5); }
    for(const k of coins){ if(k.t||k.x<cam-20||k.x>cam+W+20) continue; const s=Math.abs(Math.sin(now/220+k.x)); c.fillStyle="#fbbf24"; c.beginPath(); c.ellipse(k.x,k.y,10*s+2,11,0,0,7); c.fill(); c.strokeStyle="#b45309"; c.lineWidth=2; c.stroke(); }
    if(img.complete) c.drawImage(img,P.x-26,P.y-66,52,66); c.restore(); })(performance.now()); }

/* ================= PANEL ADMIN ================= */
function admin(){ if(!S.pin) return modal(`<b style="font-size:19px">🛠️ Panel admin</b><p class="hint">Choisis un code secret : il sera demandé pour ouvrir le panel (sur cet appareil).</p><input id="p1" type="password" inputmode="numeric" placeholder="Ton code (4 chiffres ou plus)"><button class="btn p w" id="p2" style="margin-top:10px">Valider</button>`,()=>{ $("p2").onclick=()=>{ const v=$("p1").value.trim(); if(v.length<4) return toast("Au moins 4 caractères"); S.pin=v; save(); adminPanel(); }; });
  if(admin.ok) return adminPanel();
  modal(`<b style="font-size:19px">🛠️ Panel admin</b><p class="hint">Entre ton code secret.</p><input id="p1" type="password" inputmode="numeric"><button class="btn p w" id="p2" style="margin-top:10px">Ouvrir</button>`,()=>{ $("p2").onclick=()=>{ if($("p1").value.trim()!==S.pin) return toast("❌ Mauvais code"); admin.ok=1; adminPanel(); }; }); }
function adminPanel(){ const sel=t=>`<option value="${t}">`;
  modal(`<div class="card adm"><b style="font-size:19px">🛠️ Panel admin</b><div class="hint" style="color:#fecaca">Tu contrôles tout sur ta plateforme.</div></div>
    <div class="lbl">💰 Te give des Bloxbux</div><div class="chips" style="flex-wrap:wrap">${[1000,10000,100000,1e6,1e7,1e9].map(v=>`<button data-gb="${v}">+${nf(v)}</button>`).join("")}</div>
    <div style="display:flex;gap:8px;margin-top:8px"><input id="gbx" inputmode="numeric" placeholder="Montant perso"><button class="btn p" id="gbg">Give</button></div>
    <div class="lbl">🎁 Te give un skin / objet</div><div style="display:flex;gap:8px"><select id="gis">${ITEMS.map(i=>`<option value="${i.id}">${S.inv.includes(i.id)?"✔ ":""}${esc(i.n)} · ${RAR[i.r][0]}</option>`).join("")}</select><button class="btn p" id="gig">Give</button></div>
    <button class="btn w" id="gall" style="margin-top:8px">🌈 Tout débloquer (tous les skins)</button>
    <div class="lbl">✔ Certification</div><button class="btn w ${S.cert?"r":"p"}" id="gce">${S.cert?"Retirer le badge certifié":"Activer le badge certifié ✔"}</button>
    <div class="lbl">👤 Profil</div><input id="gdn" value="${esc(S.disp)}" placeholder="Nom affiché" maxlength="20"><input id="gun" value="${esc(S.user)}" placeholder="Pseudo" maxlength="20" style="margin-top:6px"><input id="gbi" value="${esc(S.bio)}" placeholder="Bio" maxlength="120" style="margin-top:6px">
    <div style="display:flex;gap:8px;margin-top:6px"><input id="gfo" inputmode="numeric" value="${S.fol}" placeholder="Abonnés"><input id="gfi" inputmode="numeric" value="${S.fing}" placeholder="Abonnements"></div>
    <input id="gbd" placeholder="Ajouter un badge (ex : 🏆 Top créateur)" style="margin-top:6px">
    <button class="btn p w" id="gsv" style="margin-top:8px">💾 Enregistrer le profil</button>
    <div class="lbl">🎮 Tes jeux</div>${S.games.map((g,i)=>`<div class="card" style="padding:10px;margin-bottom:6px"><b>${g.e} ${esc(g.n)}</b><div style="display:flex;gap:6px;margin-top:6px"><input data-gpl="${i}" inputmode="numeric" value="${g.pl}" title="Joueurs en ligne"><input data-gvi="${i}" inputmode="numeric" value="${g.vis}" title="Visites"></div><div class="hint" style="font-size:11px">Joueurs en ligne · Visites</div></div>`).join("")}
    <div style="display:flex;gap:8px"><input id="gnn" placeholder="Nom du nouveau jeu" maxlength="24"><select id="gng" style="width:42%">${GENRES.map(([k,i,l])=>`<option value="${k}">${i} ${l}</option>`).join("")}</select></div><button class="btn w" id="gnc" style="margin-top:6px">➕ Créer le jeu</button>
    <button class="btn p w" id="gjs" style="margin-top:8px">💾 Enregistrer les jeux</button>
    <div class="lbl">⚠️ Danger</div><button class="btn r w" id="grs">🗑️ Tout remettre à zéro</button>
    <button class="btn w" id="gcl" style="margin-top:10px">Fermer</button>`,()=>{
    const give=v=>{ v=Math.max(0,Math.min(1e12,Math.floor(v)||0)); if(!v) return; S.bux+=v; log(`🛠️ +${nf(v)} Bloxbux`); save(); head(); toast(`💰 +${nf(v)} Bloxbux`); };
    document.querySelectorAll("[data-gb]").forEach(b=>b.onclick=()=>give(+b.dataset.gb));
    $("gbg").onclick=()=>give(+$("gbx").value.replace(/\s/g,""));
    $("gig").onclick=()=>{ const id=$("gis").value, it=IT(id); if(S.inv.includes(id)) return toast("Tu l'as déjà"); S.inv.push(id); if(it.r==="adm"&&!S.badges.includes("👑 Admin")) S.badges.push("👑 Admin"); save(); toast(`🎁 ${it.n} ajouté à ton inventaire`); adminPanel(); };
    $("gall").onclick=()=>{ ITEMS.forEach(i=>{ if(!S.inv.includes(i.id)) S.inv.push(i.id); }); if(!S.badges.includes("👑 Admin")) S.badges.push("👑 Admin"); save(); toast("🌈 Tous les skins débloqués !"); adminPanel(); };
    $("gce").onclick=()=>{ S.cert=S.cert?0:1; save(); render(); adminPanel(); toast(S.cert?"✔ Compte certifié !":"Badge retiré"); };
    $("gsv").onclick=()=>{ S.disp=$("gdn").value.trim()||S.disp; S.user=$("gun").value.trim().replace(/\s/g,"")||S.user; S.bio=$("gbi").value.trim(); S.fol=Math.max(0,Math.floor(+$("gfo").value.replace(/\s/g,"")||0)); S.fing=Math.max(0,Math.floor(+$("gfi").value.replace(/\s/g,"")||0)); const bd=$("gbd").value.trim(); if(bd) S.badges.push(bd.slice(0,30)); save(); render(); toast("💾 Profil enregistré"); adminPanel(); };
    $("gjs").onclick=()=>{ document.querySelectorAll("[data-gpl]").forEach(x=>S.games[+x.dataset.gpl].pl=Math.max(0,Math.floor(+x.value.replace(/\s/g,"")||0))); document.querySelectorAll("[data-gvi]").forEach(x=>S.games[+x.dataset.gvi].vis=Math.max(0,Math.floor(+x.value.replace(/\s/g,"")||0))); save(); render(); toast("💾 Jeux enregistrés"); };
    $("gnc").onclick=()=>{ const n=$("gnn").value.trim(); if(!n) return toast("Donne un nom au jeu"); const g=$("gng").value; S.games.push({id:"m"+Date.now().toString(36),n:n.slice(0,24),g,e:GENRES.find(x=>x[0]===g)[1],vis:0,pl:0,fav:0,like:ri(80,97),mine:1}); save(); render(); toast("🎮 Jeu créé !"); adminPanel(); };
    $("grs").onclick=()=>{ if(!confirm("Tout effacer et recommencer ?")) return; S=fresh(); admin.ok=0; save(); close(); render(); };
    $("gcl").onclick=close; }); }
$("tadm").onclick=admin;
$("tbux").onclick=()=>modal(`<div style="text-align:center"><div style="width:60px;margin:0 auto">${COIN.replace('class="coin"','style="width:60px;height:60px"')}</div><div class="big" style="margin-top:8px">${nf(S.bux)} Bloxbux</div><p class="hint">${S.bux.toLocaleString("fr-FR")} exactement</p></div><div class="lbl">Derniers mouvements</div>${S.hist.length?S.hist.map(h=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">${esc(h)}</div>`).join(""):'<p class="hint">Rien pour l\'instant. Joue à un jeu pour gagner des Bloxbux !</p>'}<button class="btn w" id="bc" style="margin-top:12px">Fermer</button>`,()=>{ $("bc").onclick=close; });
/* les joueurs en ligne bougent un peu */
addEventListener("storage",e=>{ if(e.key!==KEY) return; try{ const n=JSON.parse(e.newValue||"null"); if(n&&n.v){ S=n; render(); } }catch(_){} });
addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return; try{ const n=JSON.parse(localStorage.getItem(KEY)||"null"); if(n&&n.v){ S=n; render(); } }catch(_){} });
setInterval(()=>{ allGames().forEach(g=>{ g.pl=Math.max(0,Math.round(g.pl*rnd(.985,1.015))); }); },8000);
render();
})();
</script>
</body>
