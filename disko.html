<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DISKO — crée ton serveur</title>
<style>
:root{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--txt:#f2f3f5;--mut:#b5bac1;--dim:#80848e;--bl:#5865f2;--g:#23a55a;--r:#f23f43;--y:#f0b232;--pk:#f47fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg3);color:var(--txt);font-family:"gg sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{display:flex;height:100%;max-width:1100px;margin:0 auto}
.rail{width:66px;background:var(--bg3);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;overflow-y:auto;flex:none}
.sv{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg);transition:.15s;position:relative;flex:none}
.sv.on{border-radius:16px;background:var(--bl)}.sv.add{color:var(--g);font-size:26px}.sv.adm{background:#3b2a59}
.sv.on::before{content:"";position:absolute;left:-10px;width:4px;height:36px;background:#fff;border-radius:0 4px 4px 0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid #1f2023;background:var(--bg2);flex:none}
.top b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--bg3);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--mut);white-space:nowrap}
.tabs{display:flex;background:var(--bg2);border-top:1px solid #1f2023;flex:none;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 0;font-size:10.5px;color:var(--dim);position:relative}
.tabs button div{font-size:19px}.tabs button.on{color:#fff}
.tabs .bd{position:absolute;top:3px;right:calc(50% - 22px);background:var(--r);border-radius:999px;font-size:10px;padding:0 5px;color:#fff;font-weight:800}
.view{flex:1;overflow-y:auto;min-height:0}
.chans{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--bg2);border-bottom:1px solid #1f2023;flex:none}
.ch{white-space:nowrap;padding:6px 10px;border-radius:8px;color:var(--mut);font-size:14px;background:var(--bg)}
.ch.on{background:#404249;color:#fff}
.chat{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;min-height:0}
.msg{display:flex;gap:12px;padding:5px 14px;animation:fi .2s}
.msg:hover{background:#2e3035}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
.msg .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.msg .nm{font-weight:700;font-size:15px}.msg .rt{font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:2px}
.msg .tm{color:var(--dim);font-size:11px;margin-left:6px}.msg .tx{font-size:15px;line-height:1.35;word-break:break-word}
.msg.sys{color:var(--dim);font-size:14px;gap:8px}.msg.sys .ar{color:var(--g)}
.msg.spam .tx{color:#fca5a5}
.inp{display:flex;gap:8px;padding:10px;background:var(--bg);flex:none}
.inp input{flex:1;background:#383a40;border:0;border-radius:8px;padding:12px;color:#fff;font:inherit;font-size:16px;outline:none}
.inp button{background:var(--bl);border-radius:8px;padding:0 14px;font-weight:800}
.pad{padding:14px}
.card{background:var(--bg2);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.btn{background:var(--bl);border-radius:8px;padding:9px 13px;font-weight:700;font-size:14px}
.btn.g{background:var(--g)}.btn.r{background:var(--r)}.btn.s{background:#4e5058}.btn.y{background:var(--y);color:#000}.btn.pk{background:linear-gradient(135deg,#8b5cf6,#f47fff)}
.btn.full{width:100%}.btn:disabled{opacity:.4}
.it{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--bg2);margin-bottom:8px}
.it .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--bg);flex:none}
.it .inf{flex:1;min-width:0}.it .inf b{display:block;font-size:14px}.it .inf small{color:var(--mut);font-size:12.5px}
.tg{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;margin:3px}
.tg.on{background:#1c3d2a;color:#7ee2a4}
.bar{height:10px;background:var(--bg3);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f47fff,#8b5cf6);border-radius:6px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:14px}
.pop{background:var(--bg);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:88vh;overflow:auto}
.pop .big{font-size:48px;text-align:center}
.pop h2{text-align:center;margin:6px 0 10px;font-size:19px}
.opts{display:grid;gap:8px;margin-top:10px}.opts button{background:var(--bg2);padding:12px;border-radius:10px;text-align:left;font-size:14px}
.opts button:hover{background:#404249}
input[type=text],select{width:100%;background:var(--bg3);border:0;border-radius:8px;padding:11px;color:#fff;font:inherit;font-size:16px;margin-top:4px}
label{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;display:block;margin-top:10px}
.emo{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.emo button{font-size:22px;background:var(--bg3);border-radius:8px;padding:6px}
.emo button.on{outline:2px solid var(--bl)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:90;background:#111214;border:1px solid var(--bl);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;max-width:92vw;animation:fi .2s}
.adm h3{margin:14px 0 6px;font-size:13px;color:var(--pk);text-transform:uppercase}.adm .tg{cursor:pointer}
.raid{background:#3a1215;border:1px solid var(--r);border-radius:12px;padding:12px;margin:10px 14px;animation:fi .2s}
.lvl{display:flex;gap:6px;margin:10px 0}.lvl div{flex:1;text-align:center;padding:8px 4px;border-radius:10px;background:var(--bg3);font-size:12px}.lvl div.on{background:linear-gradient(135deg,#8b5cf6,#f47fff);color:#fff;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
"use strict";
const KEY="disko1";
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1).replace(".0","")+"Md";if(a>=1e6)return(n/1e6).toFixed(1).replace(".0","")+"M";if(a>=1e4)return(n/1e3).toFixed(1).replace(".0","")+"k";return n.toLocaleString("fr-FR")};
const eur=n=>fmt(n)+" €";
const NAMES=["sam","lina","yanis","ines","noah","jade","rayan","emma","adam","lou","nael","maya","ilyes","sara","enzo","zoe","kenzo","nour","mehdi","lea","tom","axel","nina","hugo","ryad","sofia","liam","ayoub","chloe","bilal"];
const SUF=["","_",".","x","yt","tv","gg","off","zz","ttv"];
const uname=()=>pick(NAMES)+pick(SUF)+(Math.random()<.6?ri(1,999):"");
const AVS=["🐱","🐶","🦊","🐼","🐸","🐵","🦁","🐯","👾","🤖","👻","💀","😎","🥷","🐺","🦄","🐙","🍕","⚽","🎮"];
const AVC=["#5865f2","#eb459e","#57f287","#fee75c","#ed4245","#3ba55c","#faa61a","#9b59b6","#1abc9c","#e67e22"];
const CHAT=["salut tout le monde","yo","qui est co ?","GG","quelqu'un pour jouer ?","mdrr","😂😂","le serveur est trop bien","ça dit quoi","bonne nuit","wsh","on fait une partie ?","@everyone non jrigole","c'est quoi le prochain event ?","je m'ennuie","vous avez vu le dernier live ?","🔥🔥🔥","qui veut duo ?","bienvenue au nouveau !","le meilleur serveur","j'ai boost 💜","quelqu'un a un tuto ?","go vocal ?","owner il est où ?","on est combien ?"];
const SPAM=["FREE TURBO ICI 👉 disko-gift.xyz","@everyone @everyone @everyone","AAAAAAAAAAAAAAAAAA","rejoignez mon serveur discord.gg/xxx","💰💰 GAGNE 1000€ CLIQUE 💰💰","spam spam spam spam spam"];
const ICONS=["🎮","🔥","👑","💀","⚡","🌙","🐉","🎵","⚽","🍕","🌌","💎","🦁","🥷","👻","🎯"];
const LEVELS=[[0,"Niveau 0",[]],[2,"Niveau 1",["😀 +50 emojis","🖼️ Icône animée","🎙️ Audio 128 kbps"]],[7,"Niveau 2",["🖼️ Bannière de serveur","🎙️ Audio 256 kbps","📁 Fichiers 50 Mo","🎨 Icônes de rôles"]],[14,"Niveau 3",["🔗 Lien personnalisé","🎙️ Audio 384 kbps","📁 Fichiers 100 Mo","🌟 Visibilité max"]]];
const BOTS=[{k:"modo",n:"ModoBot",ic:"🛡️",c:500,d:"Bannit tout seul une partie des spammeurs"},{k:"ticket",n:"TicketBot",ic:"🎫",c:900,d:"Répond tout seul à certains tickets d'aide"},{k:"music",n:"MusicBot",ic:"🎵",c:300,d:"+satisfaction dans les vocaux"},{k:"welcome",n:"BienvenueBot",ic:"👋",c:200,d:"Souhaite la bienvenue : les nouveaux restent plus"},{k:"level",n:"NiveauBot",ic:"📈",c:1500,d:"Système de niveaux : les membres sont plus actifs"},{k:"giveaway",n:"GiveawayBot",ic:"🎁",c:3000,d:"Débloque les giveaways géants"}];
const PERMS=[["admin","👑 Administrateur"],["ban","🔨 Bannir"],["kick","👢 Expulser"],["mute","🔇 Rendre muet"],["tickets","🎫 Gérer les tickets"],["msg","🗑️ Gérer les messages"],["mention","📣 Mentionner @everyone"]];
/* ---------- État ---------- */
function newServer(name,icon){return{name,icon,col:pick(AVC),members:1,online:1,sat:70,boosts:0,boosters:[],
 channels:[{n:"règles",t:"txt",cat:"INFOS"},{n:"annonces",t:"txt",cat:"INFOS"},{n:"général",t:"txt",cat:"DISCUSSION"},{n:"memes",t:"txt",cat:"DISCUSSION"},{n:"tickets",t:"txt",cat:"SUPPORT"},{n:"Vocal 1",t:"voc",cat:"VOCAUX"},{n:"Gaming",t:"voc",cat:"VOCAUX"}],
 roles:[{n:"Owner",col:"#f23f43",p:["admin","ban","kick","mute","tickets","msg","mention"]},{n:"Admin",col:"#f0b232",p:["ban","kick","mute","tickets","msg","mention"]},{n:"Modo",col:"#23a55a",p:["kick","mute","tickets","msg"]},{n:"Staff Ticket",col:"#00a8fc",p:["tickets"]},{n:"Booster",col:"#f47fff",p:[]},{n:"Membre",col:"#b5bac1",p:[]}],
 staff:[],tickets:[],chat:{},bots:[],auto:{spam:false,links:false,insult:false,raid:false},slow:0,verif:0,partners:0,raid:null,log:[],bans:0,ticketsDone:0,created:Date.now()}}
const NEW=()=>({v:1,user:"",av:"😎",money:150,turbo:false,turboB:0,servers:[],cur:0,adm:{},t:Date.now()});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||NEW()}catch(e){S=NEW()}S=Object.assign(NEW(),S);
const save=()=>{S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const A=()=>S.adm||(S.adm={});
const SV=()=>S.servers[S.cur];
const lvl=s=>{let L=0;for(let i=0;i<LEVELS.length;i++)if(s.boosts>=LEVELS[i][0])L=i;return L};
const hasBot=(s,k)=>s.bots.includes(k);
const roleCol=(s,n)=>(s.roles.find(r=>r.n===n)||{col:"#b5bac1"}).col;
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const slog=(s,t)=>{s.log.unshift(now()+" · "+t);s.log=s.log.slice(0,60)};
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2300)}
function popup(h,close=true){closePop();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML=`<div class="pop">${h}</div>`;if(close)o.onclick=e=>{if(e.target===o)closePop()};document.body.appendChild(o)}
function closePop(){const o=$("#ov");if(o)o.remove()}
const okB=(t="OK",id="")=>`<button class="btn full" style="margin-top:12px" ${id?`id="${id}"`:`onclick="this.closest('.ov').remove()"`}>${t}</button>`;
function pay(n){if(A().infMoney)return true;if(S.money<n){toast("💸 Pas assez d'argent");return false}S.money-=n;return true}
/* ---------- Chat ---------- */
function randomRole(s){const r=Math.random();if(s.boosters.length&&r<.08)return"Booster";return"Membre"}
function push(s,ch,m){(s.chat[ch]=s.chat[ch]||[]).push(m);if(s.chat[ch].length>60)s.chat[ch].shift();if(S.servers[S.cur]===s&&TAB==="chat"&&CH===ch)appendMsg(m)}
function memberMsg(s,ch="général",text){const n=uname();push(s,ch,{n,av:pick(AVS),c:pick(AVC),role:randomRole(s),t:text||pick(CHAT),tm:now()})}
function sysMsg(s,ch,text){push(s,ch,{sys:1,t:text,tm:now()})}
function msgHTML(m){const s=SV();if(m.sys)return `<div class="msg sys"><span class="ar">➜</span><span>${m.t}</span></div>`;
 const rc=roleCol(s,m.role);return `<div class="msg ${m.spam?"spam":""}"><div class="av" style="background:${m.c}">${m.av}</div><div style="min-width:0"><span class="nm" style="color:${rc}">${esc(m.n)}</span>${m.role&&m.role!=="Membre"?`<span class="rt" style="background:${rc};color:#000">${esc(m.role)}</span>`:""}${m.turbo?` <span title="Turbo">💎</span>`:""}<span class="tm">aujourd'hui à ${m.tm}</span><div class="tx">${esc(m.t)}</div></div></div>`}
function appendMsg(m){const c=$("#chat");if(!c)return;const near=c.scrollHeight-c.scrollTop-c.clientHeight<120;c.insertAdjacentHTML("beforeend",msgHTML(m));while(c.children.length>70)c.firstChild.remove();if(near)c.scrollTop=c.scrollHeight}
/* ---------- Simulation ---------- */
const TICKETS=[
 s=>{const m=ri(Math.max(20,s.members*.2),Math.max(60,s.members*1.5));const n=pick(["Team Nova","Les Gamers FR","Anime Zone","Foot Club","Chill & Co","Roblox FR","Edit Squad"]);return{ty:"🤝 Partenariat",tx:`Salut ! Je suis l'owner de « ${n} » (${fmt(m)} membres). Partenariat ?`,o:[["✅ Accepter le partenariat",()=>{const g=Math.round(m*rnd(.05,.15));s.members+=g;s.partners++;slog(s,`🤝 Partenariat avec ${n} (+${fmt(g)} membres)`);sysMsg(s,"annonces",`🤝 Nouveau partenaire : <b>${esc(n)}</b> !`);return`🤝 +${fmt(g)} membres`}],["❌ Refuser",()=>"Refusé"]]}},
 s=>{const p=Math.round(30+s.members*rnd(.05,.15));const b=pick(["Bulle Soda","GameNova","ZapPhone","Sneak'R","Pizza Rapido"]);return{ty:"💸 Sponsor",tx:`Bonjour, la marque ${b} vous propose ${eur(p)} pour une annonce sur le serveur.`,o:[["✅ Accepter (−un peu de satisfaction)",()=>{S.money+=p;s.sat=clamp(s.sat-3,0,100);slog(s,`💸 Sponsor ${b} : +${eur(p)}`);return`💸 +${eur(p)}`}],["❌ Refuser (les membres aiment)",()=>{s.sat=clamp(s.sat+2,0,100);return"👍 +satisfaction"}]]}},
 s=>{const n=uname();return{ty:"🛡️ Candidature modo",tx:`Salut, je suis ${n}, actif tous les jours. Je peux devenir modo ? Je connais bien les règles.`,o:[["✅ Recruter comme Modo",()=>{s.staff.push({n,role:"Modo",av:pick(AVS),c:pick(AVC)});slog(s,`🛡️ ${n} devient Modo`);sysMsg(s,"annonces",`🛡️ Bienvenue à <b>${esc(n)}</b> dans l'équipe modo !`);return`🛡️ ${esc(n)} est modo`}],["🎫 Recruter comme Staff Ticket",()=>{s.staff.push({n,role:"Staff Ticket",av:pick(AVS),c:pick(AVC)});slog(s,`🎫 ${n} devient Staff Ticket`);return`🎫 ${esc(n)} gère les tickets`}],["❌ Refuser",()=>"Refusé"]]}},
 s=>{const n=uname();return{ty:"🚨 Signalement",tx:`${n} insulte tout le monde dans #général, faites quelque chose !`,o:[["🔨 Bannir",()=>{s.bans++;s.sat=clamp(s.sat+4,0,100);slog(s,`🔨 ${n} banni`);sysMsg(s,"général",`🔨 <b>${esc(n)}</b> a été banni.`);return"🔨 Banni"}],["⚠️ Avertir",()=>{s.sat=clamp(s.sat+2,0,100);return"⚠️ Averti"}],["🙄 Ignorer",()=>{s.sat=clamp(s.sat-6,0,100);return"😠 Les membres sont déçus"}]]}},
 s=>({ty:"❓ Aide",tx:pick(["Comment on a le rôle Booster ?","Je peux pas parler dans #annonces ?","C'est quand le prochain event ?","Comment je change mon pseudo ?","Le lien d'invitation marche plus"]),o:[["💬 Répondre gentiment",()=>{s.sat=clamp(s.sat+3,0,100);return"👍 Merci !"}],["🙄 Fermer sans répondre",()=>{s.sat=clamp(s.sat-4,0,100);return"😠 Membre déçu"}]]}),
 s=>{const c=Math.round(100+s.members*.05);return{ty:"🎥 Collab streamer",tx:`Je suis streamer, je fais un live sur ton serveur si tu fais un giveaway (${eur(c)}).`,o:[["✅ Payer le giveaway",()=>{if(!pay(c))return"💸 Pas assez";const g=Math.round(30+s.members*rnd(.1,.3)*(hasBot(s,"giveaway")?1.6:1));s.members+=g;s.sat=clamp(s.sat+6,0,100);slog(s,`🎥 Collab streamer : +${fmt(g)} membres`);return`🎥 +${fmt(g)} membres`}],["❌ Refuser",()=>"Refusé"]]}}
];
function newTicket(s){const t=pick(TICKETS)(s);t.id=Date.now()+Math.random();t.from=uname();t.av=pick(AVS);t.c=pick(AVC);t.at=Date.now();s.tickets.push(t);if(s.tickets.length>15)s.tickets.shift();sysMsg(s,"tickets",`🎫 Ticket ouvert par <b>${esc(t.from)}</b> : ${t.ty}`)}
const TF={};
function startRaid(s){if(s.raid)return;const n=ri(8,25)+Math.round(s.members*.01);s.raid={n,left:n,t:Date.now()};slog(s,`🚨 RAID : ${n} comptes spam`);for(let i=0;i<4;i++)push(s,"général",{n:"raider"+ri(100,999),av:"🤖",c:"#ed4245",role:"Membre",t:pick(SPAM),tm:now(),spam:1});if(S.servers[S.cur]===s)renderView()}
let tickN=0;
function tick(){if(!S.user)return;tickN++;
 S.servers.forEach((s,i)=>{
  const L=lvl(s);const modos=s.staff.filter(x=>x.role==="Modo"||x.role==="Admin").length;
  // croissance
  let attr=(0.4+s.partners*.15+L*.6+s.bots.length*.15+modos*.05)*(s.sat/70)*(s.raid?.2:1)*(1-s.verif*.08)*(A().x10?10:1);
  const join=Math.random()<Math.min(.95,.15+attr*.25)?Math.max(1,Math.round(attr*rnd(.5,1.5)*(1+s.members/400))):0;
  if(join){s.members+=join;if(i===S.cur&&Math.random()<.5)sysMsg(s,"général",`Bienvenue <b>${esc(uname())}</b> ! ${hasBot(s,"welcome")?"👋 (BienvenueBot)":""}`)}
  if(s.sat<35&&Math.random()<.3){const l=Math.max(1,Math.round(s.members*.01));s.members=Math.max(1,s.members-l)}
  s.online=Math.max(1,Math.round(s.members*rnd(.08,.16)));
  // boosts naturels
  if(s.members>30&&Math.random()<.004*(1+s.members/2000)){const n=uname();s.boosts++;s.boosters.push(n);sysMsg(s,"général",`💜 <b>${esc(n)}</b> vient de booster le serveur !`);if(i===S.cur)toast(`💜 ${esc(n)} a boosté le serveur !`)}
  // chat
  if(s.members>1&&Math.random()<Math.min(.9,.25+s.online/60)&&!s.slowBlock)memberMsg(s);
  if(s.slow&&tickN%Math.max(1,Math.round(s.slow/2))!==0)s.slowBlock=true;else s.slowBlock=false;
  if(s.members>3&&Math.random()<.05)memberMsg(s,"memes",pick(["😂😂😂","ce meme est trop drôle","💀💀","[image]","ratio","mdrrr"]));
  // satisfaction
  const pend=s.tickets.length;s.sat=clamp(s.sat-(pend>4?.25:0)-(s.raid?.8:0)+(hasBot(s,"music")?.05:0)+(hasBot(s,"level")?.04:0)+(s.auto.insult?.02:0),0,100);
  if(A().sat100)s.sat=100;
  // tickets
  if(s.members>5&&Math.random()<.035*(1+Math.min(3,s.members/500))&&!A().noTix)newTicket(s);
  // staff/bots traitent

 else if(c==="/giveaway"){if(!pay(300))return;const g=Math.round(20+s.members*rnd(.05,.12)*(hasBot(s,"giveaway")?1.8:1));s.members+=g;sysMsg(s,CH,`🎁 GIVEAWAY lancé ! +${g} membres sont venus participer`)}

function voice(n){const s=SV();const ppl=Math.min(10,Math.round(s.online*rnd(.05,.2)));popup(`<div class="big">🔊</div><h2>${esc(n)}</h2><div class="mut" style="text-align:center">${ppl} personne(s) en vocal${hasBot(s,"music")?" · 🎵 MusicBot joue de la musique":""}</div><div style="margin-top:10px">${Array.from({length:ppl},()=>`<div class="it" style="margin-bottom:4px"><div class="ic" style="background:${pick(AVC)}">${pick(AVS)}</div><div class="inf"><b>${uname()}</b></div>${Math.random()<.3?"🔇":"🎙️"}</div>`).join("")||`<div class="mut" style="text-align:center">Personne…</div>`}</div><button class="btn g full" id="jv" style="margin-top:10px">🎙️ Rejoindre (+satisfaction)</button>`);$("#jv").onclick=()=>{s.sat=clamp(s.sat+3,0,100);closePop();toast("🎙️ Tu as rejoint le vocal")}}
function openTicket(id){const s=SV();const t=s.tickets.find(x=>x.id===id);if(!t)return;const fn=TICKETS.find(()=>true);
 popup(`<div class="big">🎫</div><h2>${t.ty}</h2><div class="it"><div class="ic" style="background:${t.c}">${t.av}</div><div class="inf"><b>${esc(t.from)}</b><small>${esc(t.tx)}</small></div></div><div class="opts">${t.o.map((o,i)=>`<button data-o="${i}">${esc(o[0])}</button>`).join("")}</div>`);
 document.querySelectorAll("#ov [data-o]").forEach(b=>b.onclick=()=>{const r=t.o[+b.dataset.o][1]();s.tickets=s.tickets.filter(x=>x.id!==id);s.ticketsDone++;sysMsg(s,"tickets",`✅ Ticket de ${esc(t.from)} fermé par <b>${esc(S.user)}</b>`);closePop();toast(r);renderView();updateBadges()})}
function boost(s,who){s.boosts++;s.boosters.push(who);sysMsg(s,"général",`💜 <b>${esc(who)}</b> vient de booster le serveur !`);const L=lvl(s);toast(`💜 Boosté ! (${LEVELS[L][1]})`);slog(s,`💜 ${who} a boosté`);renderView();renderTop()}
function pickIcon(cb){popup(`<h2>Choisis une icône</h2><div class="emo">${ICONS.map(i=>`<button data-i="${i}">${i}</button>`).join("")}</div>`);document.querySelectorAll("#ov [data-i]").forEach(b=>b.onclick=()=>{closePop();cb(b.dataset.i)})}
function createServer(){if(S.servers.length>=6){toast("6 serveurs max");return}let ic=pick(ICONS);
 popup(`<div class="big">🏠</div><h2>Crée ton serveur</h2><div class="mut" style="text-align:center">Ton serveur, c'est là où toi et ta communauté vous retrouvez.</div><label>Nom du serveur</label><input type="text" id="sn" maxlength="30" value="Serveur de ${esc(S.user)}"><label>Icône</label><div class="emo" id="si">${ICONS.map(i=>`<button data-i="${i}" class="${i===ic?"on":""}">${i}</button>`).join("")}</div>${okB("Créer","sok")}`);
 document.querySelectorAll("#si button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#si button").forEach(x=>x.classList.remove("on"));b.classList.add("on");ic=b.dataset.i});
 $("#sok").onclick=()=>{const n=$("#sn").value.trim().replace(/[<>]/g,"").slice(0,30)||"Mon serveur";const s=newServer(n,ic);S.servers.push(s);S.cur=S.servers.length-1;sysMsg(s,"général",`🎉 <b>${esc(S.user)}</b> a créé le serveur. Bienvenue !`);push(s,"règles",{n:S.user,av:S.av,c:"#f23f43",role:"Owner",t:"1. Respect 2. Pas de spam 3. Pas de pub 4. Amusez-vous",tm:now()});slog(s,"🏠 Serveur créé");closePop();CH="général";TAB="chat";render();
  setTimeout(()=>{s.members+=ri(2,5);memberMsg(s,"général","yo c'est quoi ce serveur ?")},2500)}}
function profile(){popup(`<div class="big">${S.av}</div><h2>${esc(S.user)} ${S.turbo?"💎":""}</h2><div class="mut" style="text-align:center">${S.turbo?"Abonné Disko Turbo":"Pas de Turbo"} · ${S.servers.length} serveur(s) · ${eur(S.money)}</div><label>Avatar</label><div class="emo">${AVS.map(a=>`<button data-a="${a}">${a}</button>`).join("")}</div>${okB()}`);document.querySelectorAll("#ov [data-a]").forEach(b=>b.onclick=()=>{S.av=b.dataset.a;closePop();render()})}
function startHTML(){return `<div style="margin:auto;max-width:420px;padding:30px 20px;text-align:center;align-self:center"><div style="font-size:64px">💬</div><h1 style="margin:6px 0">DISKO</h1><div class="mut">Crée ton serveur, gère tes membres, tes modos, tes tickets et deviens le plus gros serveur.</div>
 <div style="text-align:left;margin-top:20px"><label>Ton pseudo</label><input type="text" id="un" maxlength="20" placeholder="pseudo"><label>Avatar</label><div class="emo" id="ua">${AVS.map((a,i)=>`<button data-a="${a}" class="${i===12?"on":""}">${a}</button>`).join("")}</div><button class="btn full" id="ugo" style="margin-top:16px;padding:14px">Continuer</button></div></div>`}
function bindStart(){let av="😎";document.querySelectorAll("#ua button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#ua button").forEach(x=>x.classList.remove("on"));b.classList.add("on");av=b.dataset.a});
 $("#ugo").onclick=()=>{const n=$("#un").value.trim().replace(/[^a-zA-Z0-9._]/g,"").toLowerCase().slice(0,20);if(n.length<2){toast("Choisis un pseudo");return}S.user=n;S.av=av;render();setTimeout(createServer,200)}}
/* ---------- Panel admin ---------- */
function admin(){const a=A();const s=SV();const T=(k,l)=>`<button class="tg ${a[k]?"on":""}" data-tg="${k}">${a[k]?"✅":"⬜"} ${l}</button>`;
 popup(`<div class="adm"><h2>🛠️ Panel admin</h2>
 <h3>💰 Argent</h3>${[1e3,1e5,1e7].map(v=>`<button class="tg" data-mo="${v}">+${fmt(v)} €</button>`).join("")}${T("infMoney","Argent infini")}
 ${s?`<h3>👥 Membres de « ${esc(s.name)} »</h3>${[100,1e4,1e6].map(v=>`<button class="tg" data-me="${v}">+${fmt(v)}</button>`).join("")}${T("x10","Croissance ×10")}
 <h3>💜 Boosts</h3><button class="tg" data-bo="1">+1 boost</button><button class="tg" data-bo="7">+7 boosts</button><button class="tg" id="l3">🌟 Niveau 3 direct</button><button class="tg" id="tur">💎 Turbo gratuit</button>
 <h3>🛡️ Modération</h3>${T("noRaid","Plus de raids")}<button class="tg" id="rd">🚨 Lancer un raid</button><button class="tg" id="er">✅ Stopper le raid</button><button class="tg" id="m5">👮 +5 modos</button>
 <h3>🎫 Tickets</h3><button class="tg" id="t5">🎫 +5 tickets</button>${T("noTix","Plus de tickets")}<button class="tg" id="tc">🧹 Fermer tous les tickets</button>
 <h3>😊 Serveur</h3>${T("sat100","Satisfaction toujours 100 %")}<button class="tg" id="bots">🤖 Tous les bots</button><button class="tg" id="pt">🤝 +10 partenaires</button>`:""}
 ${okB("Fermer")}</div>`);
 const re=m=>{if(m)toast(m);render();admin()};
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{a[b.dataset.tg]=!a[b.dataset.tg];re()});
 document.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{S.money+=+b.dataset.mo;re("💰 Ajouté")});
 if(!s)return;
 document.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>{s.members+=+b.dataset.me;re("👥 Membres ajoutés")});
 document.querySelectorAll("[data-bo]").forEach(b=>b.onclick=()=>{for(let i=0;i<+b.dataset.bo;i++){s.boosts++;s.boosters.push(uname())}re("💜 Boosts ajoutés")});
 $("#l3").onclick=()=>{while(s.boosts<14){s.boosts++;s.boosters.push(uname())}re("🌟 Niveau 3")};$("#tur").onclick=()=>{S.turbo=true;S.turboB+=2;re("💎 Turbo activé")};
 $("#rd").onclick=()=>{closePop();startRaid(s);TAB="mod";render()};$("#er").onclick=()=>{s.raid=null;re("✅ Raid stoppé")};
 $("#m5").onclick=()=>{for(let i=0;i<5;i++)s.staff.push({n:uname(),role:"Modo",av:pick(AVS),c:pick(AVC)});re("👮 +5 modos")};
 $("#t5").onclick=()=>{for(let i=0;i<5;i++)newTicket(s);re("🎫 +5 tickets")};$("#tc").onclick=()=>{s.ticketsDone+=s.tickets.length;s.tickets=[];re("🧹 Tickets fermés")};
 $("#bots").onclick=()=>{BOTS.forEach(b=>{if(!hasBot(s,b.k))s.bots.push(b.k)});re("🤖 Tous les bots")};$("#pt").onclick=()=>{s.partners+=10;re("🤝 +10 partenaires")}}
render();
Object.defineProperty(window,"__D",{get:()=>S});
})();
</script>
