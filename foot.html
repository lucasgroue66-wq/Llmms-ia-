<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ULTRA CLUB — jeu de foot de llmms ia</title>
<meta name="description" content="ULTRA CLUB : gère ton club, ouvre des packs de joueurs et gagne la ligue. Un jeu créé avec llmms ia.">
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#07110c;--card:#0f1f17;--line:#1d3a2a;--txt:#effaf3;--dim:#8fb3a0;--a:#22c55e;--b:#facc15;--r:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(900px 500px at 50% -10%,#14532d 0%,transparent 60%),var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:980px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;background:rgba(7,17,12,.85);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:20px;letter-spacing:.05em;background:linear-gradient(90deg,#4ade80,#facc15);-webkit-background-clip:text;background-clip:text;color:transparent}
.grow{flex:1}.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;white-space:nowrap}
main{flex:1;padding:14px}
nav{display:flex;gap:6px;padding:10px 14px 16px;position:sticky;bottom:0;background:rgba(7,17,12,.92);border-top:1px solid var(--line)}
nav button{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-weight:700;font-size:13.5px}
nav button.on{background:linear-gradient(135deg,#16a34a,#15803d);border-color:transparent}
h2{margin:4px 0 12px;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.btn{background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:12px;padding:12px 16px;font-weight:800}
.btn.gold{background:linear-gradient(135deg,#fde047,#ca8a04);color:#1a1400}
.btn.ghost{background:#163024;border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
/* terrain */
.pitch{position:relative;aspect-ratio:3/4;max-height:68vh;margin:0 auto;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(0deg,#15803d 0 40px,#16a34a 40px 80px);border:3px solid #dcfce7}
.pitch:before{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:rgba(255,255,255,.6)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:2px solid rgba(255,255,255,.6);border-radius:50%;transform:translate(-50%,-50%)}
.slot{position:absolute;transform:translate(-50%,-50%);z-index:2}
.pitch .pc{width:66px;transform:scale(.86)}.pitch .pc .fc,.pitch .pc .fc img{width:40px;height:40px}.pitch .pc .rt{font-size:17px}
/* carte joueur */
.pc{width:76px;border-radius:12px;padding:6px 5px 7px;text-align:center;position:relative;color:#111;box-shadow:0 6px 14px -6px #000;font-size:11px;line-height:1.15}
.pc .rt{font-size:20px;font-weight:900}.pc .ps{font-weight:800;font-size:10px}
.pc .fc{position:relative;margin:2px auto 1px;width:50px;height:50px}.pc .fc img{width:50px;height:50px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.pc .fc .fl{position:absolute;left:-8px;top:-2px;font-size:13px}.pc .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r0{background:linear-gradient(160deg,#e7c3a2,#a8724b)}.r1{background:linear-gradient(160deg,#f1f5f9,#94a3b8)}.r2{background:linear-gradient(160deg,#fef08a,#ca8a04)}.r3{background:linear-gradient(160deg,#c4b5fd,#7c3aed);color:#fff}
.r3:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 18px 3px rgba(167,139,250,.8);pointer-events:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;justify-items:center}
.pc.sel{outline:3px solid #fff}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats .pill{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--dim);font-weight:600}
tr.me td{color:#4ade80;font-weight:800}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pack{border-radius:16px;padding:16px;text-align:center;border:1px solid var(--line)}
.pack .pi{font-size:46px}.pack b{display:block;font-size:17px;margin:4px 0}
/* match */
.score{display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:900;margin:6px 0 10px}
.score .tn{font-size:15px;font-weight:800;max-width:34%;text-align:center;line-height:1.2}
.score small{display:block;font-size:13px;font-weight:600;color:var(--dim)}
.feed{height:240px;overflow:auto;background:#0a1711;border-radius:12px;padding:10px;font-size:14px}
.feed div{padding:4px 0;border-bottom:1px dashed #173225}.feed .g{color:#facc15;font-weight:800}
.bar{height:8px;background:#163024;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15)}
/* popups */
#pop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;place-items:center;z-index:20;padding:16px}
#pop.on{display:grid}#pop .in{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(560px,100%);text-align:center;max-height:calc(100dvh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pop .in.wide{width:min(820px,100%);padding:20px 18px 26px}
#pop .in::-webkit-scrollbar{width:8px}#pop .in::-webkit-scrollbar-thumb{background:#2f5a43;border-radius:9px}
.reveal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.reveal .pc{animation:flip .6s both}@keyframes flip{from{transform:rotateY(90deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#16a34a;padding:10px 16px;border-radius:12px;font-weight:800;opacity:0;transition:.25s;z-index:30;pointer-events:none}
#toast.on{opacity:1}
.hint{color:var(--dim);font-size:13px}
.adm{text-align:left}.adm h2{font-size:20px;color:#fff;position:sticky;top:-20px;background:var(--card);padding:10px 0;margin:-6px 0 6px;z-index:2}.adm h3{margin:18px 0 8px;font-size:16px;color:var(--b)}
.adm .btn{padding:12px 14px;font-size:15px}.adm .sec{background:#0a1711;border:1px solid var(--line);border-radius:14px;padding:4px 12px 12px;margin-bottom:10px}
.adm input,.adm select{background:#0a1711;color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px}
.adm .row2 button{padding:9px 12px}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.r4{background:linear-gradient(160deg,#fff7d6,#f5d06f 45%,#fff 55%,#d4a017);color:#2a1d00}
.r4:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 22px 4px rgba(255,215,90,.9);pointer-events:none}
.r5{background:linear-gradient(160deg,#a5f3fc,#0e7490);color:#fff}
.r6{background:linear-gradient(160deg,#111 0%,#7f1d1d 40%,#ef4444 60%,#111 100%);background-size:200% 200%;animation:ult 3s linear infinite;color:#fff}
.r6:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 22px 4px rgba(239,68,68,.9);pointer-events:none}
@keyframes ult{to{background-position:200% 200%}}
.r7{background:linear-gradient(160deg,#fbcfe8,#db2777 55%,#6d28d9);color:#fff}
.r7:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 18px 3px rgba(244,114,182,.85);pointer-events:none}
.r5:after{content:"";position:absolute;inset:0;border-radius:12px;box-shadow:0 0 18px 3px rgba(34,211,238,.8);pointer-events:none}
/* cinématiques */
#cine{position:fixed;inset:0;z-index:40;background:#000;display:none;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;text-align:center}
#cine.on{display:flex}
#cine .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,var(--cc,#facc15) 0 6deg,transparent 6deg 18deg);opacity:.18;animation:spin 14s linear infinite}
#cine .glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,var(--cc,#facc15) 0%,transparent 65%);opacity:.35;animation:pulse 2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.15);opacity:.5}}
#cine .ln{position:relative;font-weight:900;color:#fff;text-shadow:0 0 24px var(--cc,#facc15);animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
#cine .big{font-size:min(30vw,190px);line-height:1}
#cine .t1{font-size:min(9vw,54px);letter-spacing:.04em}
#cine .t2{font-size:min(5vw,24px);font-weight:700;opacity:.9;letter-spacing:.2em;text-transform:uppercase}
#cine .pc{transform:scale(2.1);margin:60px 0 40px}
#cine .skip{position:absolute;right:14px;bottom:16px;background:rgba(255,255,255,.15);padding:8px 14px;border-radius:999px;font-weight:700;color:#fff;z-index:2}
#cfx{position:absolute;inset:0;pointer-events:none}
#cbg{position:absolute;inset:0;width:100%;height:100%}
#cine .flash{position:absolute;inset:0;background:#fff;pointer-events:none;animation:flash .6s ease-out forwards;z-index:3}
@keyframes flash{from{opacity:1}to{opacity:0}}
#cine .bars:before,#cine .bars:after{content:"";position:absolute;left:0;right:0;height:9vh;background:#000;z-index:4}#cine .bars:before{top:0}#cine .bars:after{bottom:0}
/* mode action */
#ctl{display:none}#mg.live #ctl{display:block}
#joy{position:absolute;left:22px;bottom:34px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.2));border:2px solid rgba(255,255,255,.45);touch-action:none;z-index:3}
#joyK{position:absolute;left:50%;top:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#94a3b8);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.abtn{position:absolute;border-radius:50%;font-weight:900;color:#fff;letter-spacing:.04em;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 -5px 0 rgba(0,0,0,.25);touch-action:none;z-index:3;border:2px solid rgba(255,255,255,.6)}
.abtn:active{transform:scale(.92)}
#bShot{right:22px;bottom:34px;width:104px;height:104px;background:radial-gradient(circle at 35% 30%,#f87171,#b91c1c);font-size:19px}
#bPass{right:136px;bottom:54px;width:82px;height:82px;background:radial-gradient(circle at 35% 30%,#60a5fa,#1d4ed8);font-size:15px}
#mg .hud{z-index:2}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
/* mini-jeux */
#mg{position:fixed;inset:0;z-index:35;display:none;background:#000}
#mg.on{display:block}#mg canvas{width:100%;height:100%;display:block;touch-action:none}
#mg .hud{position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 8px #000;pointer-events:none}
#mg .hud small{display:block;font-size:14px;font-weight:600;opacity:.9}
.lgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.lgs button{background:#163024;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13.5px}
.lgs button.on{background:#16a34a;border-color:transparent}
.trlist{display:flex;gap:8px;flex-wrap:wrap}
.tr{display:flex;align-items:center;gap:6px;background:#163024;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:800}
.trn{display:flex;flex-direction:column;gap:8px}
.trn .it{display:flex;align-items:center;gap:10px;background:#0a1711;border-radius:12px;padding:8px}
.trn .it .pc{width:58px;font-size:9px}.trn .it .pc .rt{font-size:15px}.trn .it .pc .fc{font-size:16px}
.trn .it .grow{flex:1}.trn .it button{padding:8px 10px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <header><span class="logo">ULTRA CLUB</span><span class="grow"></span><span class="pill">🪙 <span id="coins">0</span></span><span class="pill">⭐ <span id="ovr">0</span></span><button class="pill" id="adm" title="Panel admin">🛠️</button></header>
  <main id="main"></main>
  <nav><button data-p="club" class="on">🏟️ Club</button><button data-p="car">⭐ Carrière</button><button data-p="match">⚽ Match</button><button data-p="packs">🎁 Packs</button><button data-p="ligue">🏆 Ligue</button></nav>
</div>
<div id="pop"><div class="in" id="popIn"></div></div>
<div id="cine"><canvas id="cbg"></canvas><div class="rays"></div><div class="glow"></div><canvas id="cfx"></canvas><div id="cineIn" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:10px"></div><button class="skip" id="cineSkip">Passer ⏭</button></div>
<div id="mg"><canvas id="mgc"></canvas><div class="hud" id="mgHud"></div><div id="ctl"><div id="joy"><div id="joyK"></div></div><button class="abtn" id="bPass">PASSE</button><button class="abtn" id="bShot">TIR</button></div></div>
<div id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const FLAGS=["🇫🇷","🇧🇷","🇦🇷","🇪🇸","🇵🇹","🇩🇪","🇮🇹","🇳🇱","🇧🇪","🇸🇳","🇲🇦","🇩🇿","🇳🇬","🇯🇵","🇺🇸","🇬🇧","🇨🇮","🇭🇷","🇨🇲","🇺🇾","🇨🇴","🇳🇴"];
const SYL=["ka","lo","mi","ra","vo","di","zu","ne","ta","bo","ri","sa","le","mo","gu","fa","pe","xa","ni","ko","ru","dé","yo","va","an","té","so","li"];
const FIRST=["Enzo","Kylan","Matéo","Ilyès","Noah","Rayan","Adam","Lucas","Sami","Yanis","Diego","Rafa","Luka","Kenzo","Malik","Théo","Nolan","Amir","Bruno","Tiago","Ivan","Jules","Oscar","Elio"];
const ICONS=[["Valentin Sorrel","ATT"],["Ezio Brancati","MIL"],["Thiago Almeira","ATT"],["Noé Kerbrat","DEF"],["Ruben Ostergaard","GB"],["Amadou Keïta-Lys","MIL"],["Yuto Shirakawa","MIL"],["Lorenzo Fiamma","DEF"],["Ibrahim Saldor","ATT"],["Mathis Varenne","MIL"],["Aurelio Vantez","ATT"],["Kaïs Morelon","ATT"],["Dario Belcastro","MIL"],["Ismaël Okonta","MIL"],["Sven Halvorsen","DEF"],["Joaquim Ferraz","DEF"],["Léandre Moutou","GB"],["Paolo Ventrini","ATT"],["Hugo Castellane","MIL"],["Malick Diatta","ATT"],["Rui Monteverde","MIL"],["Tobias Granlund","GB"]];
const RNAME=["Common","Rare","Or","Légende","Icône","Pépite","Ultime","Future Star"];
const ULTIMES=[["Zayn Okafor-Reyes","ATT"],["Léo Marchetti","MIL"],["Kenji Dalvaro","ATT"],["Raphaël N'Gessa","DEF"],["Iker Solvay","GB"],["Enzo Kaïros","ATT"],["Aleksandar Vuk","MIL"],["Malo Tessier","DEF"]];
const POS=["GB","DEF","MIL","ATT"];
const FORM=[["GB",50,90],["DEF",15,70],["DEF",38,74],["DEF",62,74],["DEF",85,70],["MIL",25,48],["MIL",50,52],["MIL",75,48],["ATT",20,22],["ATT",50,16],["ATT",80,22]];
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const mkName=()=>pick(FIRST)+" "+cap(pick(SYL)+pick(SYL)+(Math.random()<.4?pick(SYL):""));
const KITS=[["#dc2626","#111827"],["#2563eb","#f8fafc"],["#16a34a","#f8fafc"],["#facc15","#1e3a8a"],["#7c3aed","#f8fafc"],["#f97316","#111827"],["#0f172a","#f8fafc"],["#f8fafc","#1e293b"]];
const SKINS=["#f1c7a5","#d9a27a","#a8714d","#7a4b2f","#5a3622"];
const HAIRS=["#1a1410","#3b2a1a","#6b4423","#c9a15a","#111","#7a2e12"];
let uid=Date.now();
function mkPlayer(rar,pos){
  const look={f:pick(FLAGS),sk:pick(SKINS),hr:pick(HAIRS),hs:ri(0,5),bd:Math.random()<.3?1:0};
  if(rar===4||rar===6){ const ic=pick(rar===4?ICONS:ULTIMES); return Object.assign({id:++uid,n:ic[0],p:pos||ic[1],r:rar===4?ri(93,98):ri(96,99),k:rar},look); }
  const base=[[50,64],[63,74],[74,84],[85,92],[93,98],[70,80],[96,99],[76,86]][rar];
  return Object.assign({id:++uid,n:mkName(),p:pos||pick(POS),r:ri(base[0],base[1]),k:rar},look);
}
function rollRarity(odds){ let x=Math.random()*100; for(let i=odds.length-1;i>=0;i--){ if(x<odds[i]) return i; x-=odds[i]; } return 0; }
const LEAGUES={
  fr:{n:"Championnat de France",f:"🇫🇷",c:["Olympique Lumière","FC Riviera","Stade Breizh","AS Volcan","Racing Capitale","FC Phocée","Girondins Océan"]},
  es:{n:"Championnat d'Espagne",f:"🇪🇸",c:["Real Sol","Atlético Toro","FC Catalunya","Sevilla Azahar","Valencia Naranja","Betis Verde","Bilbao Leones"]},
  en:{n:"Championnat d'Angleterre",f:"🏴",c:["London Lions","Manchester Thunder","Liverpool Harbour","Newcastle Steel","Aston Royals","Brighton Gulls","Everton Blues"]},
  it:{n:"Championnat d'Italie",f:"🇮🇹",c:["Inter Stella","Milano Diavoli","Juve Zebra","Roma Lupi","Napoli Vesuvio","Lazio Aquile","Torino Granata"]},
  de:{n:"Championnat d'Allemagne",f:"🇩🇪",c:["Bayern Adler","Dortmund Blitz","Leipzig Bulle","Leverkusen Werk","Frankfurt Falken","Stuttgart Löwen","Wolfsburg Wölfe"]}
};
const DEF={coins:1500,club:"Mon Club",squad:[],line:[],table:null,day:0,season:1,trophies:0,ldc:0,bdo:0,lg:"fr",goals:{},kit:0};
let S; try{ S=JSON.parse(localStorage.getItem("ultraclub")||"null"); }catch{ S=null; }
if(!S){ S=JSON.parse(JSON.stringify(DEF)); ["GB","DEF","DEF","DEF","DEF","MIL","MIL","MIL","ATT","ATT","ATT"].forEach(p=>S.squad.push(mkPlayer(0,p))); for(let i=0;i<4;i++) S.squad.push(mkPlayer(0)); S.line=S.squad.slice(0,11).map(p=>p.id); }
for(const k in DEF) if(S[k]===undefined) S[k]=JSON.parse(JSON.stringify(DEF[k]));
S.squad.forEach(p=>{ p.sk=p.sk||pick(SKINS); p.hr=p.hr||pick(HAIRS); if(p.hs==null){ p.hs=ri(0,5); p.bd=Math.random()<.3?1:0; } });
if(!S.table||!S.table[0]?.lg) newSeason(false);
function newSeason(bump){ if(bump) S.season++; S.day=0; const L=LEAGUES[S.lg]; S.table=[{n:S.club,me:1,pts:0,j:0,bp:0,bc:0,ovr:0,lg:S.lg}].concat(L.c.map((n,i)=>({n,pts:0,j:0,bp:0,bc:0,ovr:Math.min(95,ri(58,70)+S.season*3+i),kit:i%KITS.length}))); save(); }
function save(){ try{ localStorage.setItem("ultraclub",JSON.stringify(S)); }catch{} }
const byId=id=>S.squad.find(p=>p.id===id);
function teamOvr(){ const L=S.line.map(byId).filter(Boolean); if(!L.length) return 0; let s=0; L.forEach((p,i)=>{ s+=p.r-(p.p===FORM[i][0]?0:8); }); return Math.round(s/11); }
let AC=null; const beep=(f,d=.08,t="triangle",v=.08)=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=t; o.frequency.value=f; g.gain.value=v; g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime+d); }catch{} };
const crowd=(d=1.5)=>{ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const n=AC.createBufferSource(), b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate), c=b.getChannelData(0); for(let i=0;i<c.length;i++) c[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/c.length)*.35; n.buffer=b; const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; n.connect(f).connect(AC.destination); n.start(); }catch{} };
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),1600); }
const FACE=new Map();
function face(p){ const key=[p.sk,p.hr,p.hs,p.bd,S.kit].join("|"); if(FACE.has(key)) return FACE.get(key);

// type: "pen" | "cf" | "drib" ; shooter = joueur ; opp = équipe adverse ; renvoie Promise<bool>

    const r=await live(me,{n:"Nation adverse",ovr:86,kit:2},{solo:1,attrs:C.a,mates:[0,1,2].map(()=>{ const p=mkPlayer(2,"MIL"); p.r=ri(80,88); return p; }),kit:KITS[1],teamOvr:84,time:30});
    if(r.team){ C.tro.nat++; won.push("🌍 Coupe des Nations"); save(); await trophyCine("COUPE DES NATIONS",esc(C.name)+" "+C.f,"🌍","#22c55e"); } else toast("Finale des Nations perdue…"); }
  C.hist.push(`Saison ${C.season} · ${esc(cl)} · ${rank}e · ${C.st.m} m · ${C.st.g} buts · ${C.st.a} passes · note ${avg.toFixed(1)}${won.length?" · "+won.join(", "):""}`);
  C.age++; C.season++; C.pts+=4; C.mercato=1;
  if(C.age>=31) ATTR.forEach(([k])=>{ if(k!=="lead") C.a[k]=Math.max(40,C.a[k]-ri(0,C.age>=34?3:1)); });
  if(C.age>=37) C.retired=1;
  cNewTable(); C.iw=-1; save();
  popup(`<h2>Fin de la saison</h2><p style="font-size:19px">${esc(cl)} finit <b>${rank}${rank===1?"er 🏆":"e"}</b></p><p>${won.join(" · ")||"Pas de trophée cette fois."}</p>${C.retired?"<p><b>Tu as 37 ans : c'est l'heure de la retraite 👋</b></p>":"<p>💼 Le <b>mercato est ouvert</b> : regarde les offres des autres clubs !</p>"}<button class="btn" id="ok">OK</button>`,()=>{ $("ok").onclick=()=>{ closePop(); car(); }; });
  await new Promise(r=>{ const iv=setInterval(()=>{ if(!$("pop").classList.contains("on")){ clearInterval(iv); r(); } },300); });
}
function carMercato(){ const C=S.car, ovr=cOvr(C), cur=cStr(C.lg,C.ci), offers=[];
  LGK.forEach(lg=>cClubs(lg).forEach((n,i)=>{ const s=cStr(lg,i); if(!(lg===C.lg&&i===C.ci)&&s>cur-3&&s<=ovr+7+C.fans/400) offers.push({lg,i,n,s}); }));
  offers.sort(()=>Math.random()-.5); const list=offers.slice(0,4).sort((a,b)=>b.s-a.s);
  popup(`<h2>💼 Mercato</h2><p class="hint">Ta note : <b>${ovr}</b>. Les clubs plus forts te veulent quand tu progresses.</p><div class="trn">${list.map((o,k)=>`<div class="it"><div class="grow" style="text-align:left"><b>${LEAGUES[o.lg].f} ${esc(o.n)}</b><div class="hint">⭐ ${o.s} · salaire ~💶 ${(Math.max(150,(o.s-55)*140)).toLocaleString("fr-FR")}/match</div></div><button class="btn gold" data-of="${k}">Signer</button></div>`).join("")||'<p class="hint">Aucune offre pour l’instant. Progresse encore !</p>'}</div>
  <div class="row2" style="justify-content:center;margin-top:12px"><button class="btn ghost" id="stay">Rester à ${esc(cClubs(C.lg)[C.ci])}</button></div>`,()=>{
    document.querySelectorAll("[data-of]").forEach(b=>b.onclick=async()=>{ const o=list[+b.dataset.of]; C.lg=o.lg; C.ci=o.i; C.role=0; C.rel=50; C.mercato=0; cNewTable(); C.hist.push(`✍️ Transfert à ${esc(o.n)} (${LEAGUES[o.lg].n})`); save(); closePop(); await trophyCine("TRANSFERT !",`${esc(C.name)} → ${esc(o.n)}`,"✍️","#38bdf8"); car(); });
    $("stay").onclick=()=>{ C.mercato=0; C.rel=Math.min(100,C.rel+8); save(); closePop(); toast("Tu restes, le coach apprécie (+8)"); car(); }; }); }
function carEnd(){ const C=S.car;
  $("main").innerHTML=`<div class="box" style="text-align:center"><h2>👋 Fin de carrière</h2><div style="display:inline-block;transform:scale(1.3);margin:20px">${card(cMe())}</div><p style="font-size:18px"><b>${esc(C.name)}</b> · ${C.tot.m} matchs · ${C.tot.g} buts · ${C.tot.a} passes D.</p>
  <div class="trlist" style="justify-content:center"><span class="tr">🏆 ${C.tro.chp}</span><span class="tr">🥇 ${C.tro.ldc}</span><span class="tr">👟 ${C.tro.sou}</span><span class="tr">🟡⚽ ${C.tro.bdo}</span><span class="tr">🌍 ${C.tro.nat}</span></div>
  <p class="hint">${C.tro.bdo>=3?"Une vraie LÉGENDE du foot !":C.tro.chp>=3?"Une légende de club.":"Belle carrière !"}</p><button class="btn gold" id="cnew">⭐ Nouvelle carrière</button></div>`;
  $("cnew").onclick=()=>{ S.car=null; save(); car(); }; }

/* ================= MATCH ================= */
let matchRunning=false, liveGoal=null;
function opponent(){ const others=S.table.filter(t=>!t.me); return others[S.day%others.length]; }
function match(){ if(S.day>=14) return endSeason();
  const o=opponent(), me=teamOvr();
  $("main").innerHTML=`<div class="box" style="text-align:center"><h2>${LEAGUES[S.lg].f} Journée ${S.day+1}/14</h2><div class="score"><div class="tn">${esc(S.club)}<small>⭐ ${me}</small></div><div>VS</div><div class="tn">${esc(o.n)}<small>⭐ ${o.ovr}</small></div></div>
  <div class="bar"><i style="width:${Math.round(100*me/(me+o.ovr))}%"></i></div><p class="hint">Pendant le match, tu joues toi-même les grosses occasions : action au joystick avec tes coéquipiers, penalty, coup franc ou dribble. Si tu rates, attends la prochaine !</p><button class="btn" id="kick" style="width:100%;font-size:18px">⚽ Jouer le match</button><button class="btn ghost" id="free" style="width:100%;margin-top:10px">🎮 Entraînement libre (joystick)</button></div>`;
  $("kick").onclick=()=>playMatch(o);
  $("free").onclick=async()=>{ const L=S.line.map(byId).filter(Boolean), h=L.filter(p=>p.p==="ATT").sort((a,b)=>b.r-a.r)[0]||L[0]; const ok=await live(h,o); toast(ok?"⚽ Joli but !":"Raté… recommence !"); };
}
function playMatch(o){ matchRunning=true; const me=teamOvr(); let a=0,b=0,min=0,paused=false,chances=0;
  const atk=S.line.map(byId).filter(p=>p.p==="ATT"||p.p==="MIL");
  $("main").innerHTML=`<div class="box"><div class="score"><div class="tn">${esc(S.club)}</div><div id="sc">0 - 0</div><div class="tn">${esc(o.n)}</div></div><div style="text-align:center" class="hint" id="mn">0'</div><div class="feed" id="feed"></div></div>`;
  const feed=$("feed"), add=(t,g)=>{ const d=document.createElement("div"); if(g) d.className="g"; d.textContent=t; feed.prepend(d); };
  const goal=s=>{ a++; S.goals[s.id]=(S.goals[s.id]||0)+1; add(`${min}' ⚽ BUT ! ${s.n} marque pour ${S.club} !`,1); $("sc").textContent=`${a} - ${b}`; };
  liveGoal=(n=1)=>{ for(let i=0;i<n;i++) goal(pick(atk)||byId(S.line[10])); };
  add("Coup d'envoi ! 🟢");
  const tick=setInterval(async()=>{ if(paused) return; min+=3; $("mn").textContent=min+"'";
    const pMe=.06*Math.pow(me/o.ovr,2), pOp=.07*Math.pow(o.ovr/me,2.2);
    if(chances<4&&Math.random()<.11*Math.pow(me/o.ovr,1.2)){ chances++; paused=true; const s=pick(atk)||byId(S.line[10]); const type=S.allLive?"live":pick(["pen","cf","drib","live","live","live"]);
      add(`${min}' 🔥 ${type==="pen"?"Penalty pour":"Grosse occasion pour"} ${s.n} !`); await new Promise(r=>setTimeout(r,600));
      const ok=type==="live"?await live(s,o):await moment(type,s,o); if(ok) goal(s); else add(`${min}' Occasion manquée…`); paused=false; }
    else if(Math.random()<pMe){ goal(pick(atk)||byId(S.line[10])); beep(880,.2); }
    else if(Math.random()<pOp){ b++; add(`${min}' ⚽ But de ${o.n}…`,1); beep(220,.3,"sawtooth",.05); }
    else if(Math.random()<.25) add(`${min}' ${pick(["Belle action","Frappe à côté","Arrêt du gardien","Corner","Carton jaune","Contre-attaque","Tir sur la barre !"])}`);
    $("sc").textContent=`${a} - ${b}`;
    if(min>=90){ clearInterval(tick); liveGoal=null; finish(o,a,b); }
  },420);
}
function finish(o,a,b){ matchRunning=false; const me=S.table.find(t=>t.me);
  const res=(x,y,t)=>{ t.j++; t.bp+=x; t.bc+=y; t.pts+=x>y?3:x===y?1:0; };
  res(a,b,me); res(b,a,o);
  const rest=S.table.filter(t=>!t.me&&t!==o); for(let i=0;i+1<rest.length;i+=2){ const x=ri(0,3),y=ri(0,3); res(x,y,rest[i]); res(y,x,rest[i+1]); }
  S.day++; const gain=(a>b?900:a===b?400:200)+a*100; S.coins+=gain; save(); head();
  popup(`<h2>${a>b?"VICTOIRE 🎉":a===b?"Match nul":"Défaite 😤"}</h2><div class="score">${a} - ${b}</div><p>+${gain} 🪙</p><button class="btn" id="ok">Continuer</button>`,()=>{ $("ok").onclick=()=>{ closePop(); if(S.day>=14){ go("ligue"); setTimeout(endSeason,300); } else go("match"); }; });
}
async function endSeason(){ const t=S.table.slice().sort((a,b)=>b.pts-a.pts||(b.bp-b.bc)-(a.bp-a.bc)); const rank=t.findIndex(r=>r.me)+1, L=LEAGUES[S.lg];
  if(rank===1){ S.trophies++; S.coins+=10000; save(); await trophyCine("CHAMPIONS !",`${L.f} ${L.n} · Saison ${S.season}`);
    const win=Math.random()<Math.min(.85,teamOvr()/(teamOvr()+82)+.1);
    if(win){ S.ldc++; S.coins+=20000; save(); await trophyCine("COUPE DES CHAMPIONS","Victoire en finale !","🥇","#60a5fa"); } else toast("Finale de la Coupe des Champions perdue…");
  } else S.coins+=Math.max(500,4000-rank*400);
  const ids=S.line; let best=null, bg=-1; ids.forEach(id=>{ const g=S.goals[id]||0, p=byId(id); if(p&&(g*3+p.r)>bg){ bg=g*3+p.r; best=p; } });
  if(best&&((S.goals[best.id]||0)>=8||best.r>=90)){ S.bdo++; S.coins+=15000; save(); await ballonDor(best); }
  S.goals={}; save();
  popup(`<h2>Fin de la saison ${S.season}</h2><p style="font-size:20px">Tu finis <b>${rank}${rank===1?"er 🏆":"e"}</b></p><p>Récompenses versées.</p><button class="btn" id="ok">Saison suivante</button>`,()=>{ $("ok").onclick=()=>{ newSeason(true); closePop(); go("club"); }; });
}

/* ================= PANEL ADMIN ================= */
function admin(){
  popup(`<div class="adm"><h2>🛠️ Panel admin <small class="hint" style="font-size:12px">· fais défiler ↕</small></h2>
  <h3>🪙 Pièces</h3><div class="row2"><button class="btn ghost" data-c="10000">+10 000</button><button class="btn ghost" data-c="100000">+100 000</button><button class="btn ghost" data-c="1000000">+1 000 000</button><input id="cIn" type="number" placeholder="montant" style="width:110px"><button class="btn" id="cGo">Give</button></div>
  <h3>👤 Donner un joueur</h3><div class="row2"><input id="pN" placeholder="Nom (facultatif)" style="flex:1;min-width:120px"><select id="pP"><option>ATT</option><option>MIL</option><option>DEF</option><option>GB</option></select><select id="pK"><option value="6">Ultime</option><option value="4">Icône</option><option value="7">Future Star</option><option value="3">Légende</option><option value="2">Or</option><option value="5">Pépite</option><option value="1">Rare</option><option value="0">Common</option></select><input id="pR" type="number" min="1" max="99" value="99" style="width:70px"><button class="btn" id="pGo">Give</button></div>
  <h3>🎁 Packs gratuits</h3><div class="row2">${PACKS.map((p,i)=>`<button class="btn ghost" data-fp="${i}">${p[1]} ${p[0]}</button>`).join("")}</div>
  <h3>⚽ Buts (pendant un match)</h3><div class="row2"><button class="btn ghost" id="g1">+1 but</button><button class="btn ghost" id="g5">+5 buts</button></div>
  <h3>🏆 Trophées</h3><div class="row2"><button class="btn ghost" id="tBdo">🟡⚽ +1 Ballon d'Or</button><button class="btn ghost" id="tLdc">🥇 +1 Coupe des Champions</button><button class="btn ghost" id="tChp">🏆 +1 Championnat</button></div>
  <h3>⭐ Équipe et ligue</h3><div class="row2"><button class="btn ghost" id="t99">Toute l'équipe à 99</button><button class="btn ghost" id="pts">+3 points</button><button class="btn ghost" id="fin">Finir la saison</button></div>
  <h3>⭐ Carrière</h3><div class="row2"><button class="btn ghost" id="cA1">+10 points compétence</button><button class="btn ghost" id="cA2">Compétences à 99</button><button class="btn ghost" id="cA3">+30 relation coach</button><button class="btn ghost" id="cA4">+100 000 💶</button><button class="btn ghost" id="cA5">Ouvrir le mercato</button><button class="btn ghost" id="cA6">Devenir capitaine</button></div>
  <h3>🎮 Mode action</h3><div class="row2"><button class="btn ghost" id="aLive">${S.allLive?"✅":"⬜"} Toutes les occasions en mode joystick</button><button class="btn ghost" id="aTurbo">${S.turbo?"✅":"⬜"} Vitesse x1,5</button><button class="btn ghost" id="aPlay">▶️ Jouer une action</button></div>
  <div class="row2" style="margin-top:16px"><button class="btn ghost" id="rst" style="color:#fca5a5">Tout réinitialiser</button><span class="grow"></span><button class="btn" id="ok">Fermer</button></div></div>`,()=>{
    const done=t=>{ save(); head(); toast(t); beep(988); };
    document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ S.coins+=+b.dataset.c; done(`+${(+b.dataset.c).toLocaleString("fr-FR")} 🪙`); });
    $("cGo").onclick=()=>{ const v=Math.floor(+$("cIn").value||0); if(!v) return; S.coins=Math.max(0,S.coins+v); done(`${v>0?"+":""}${v.toLocaleString("fr-FR")} 🪙`); };
    $("pGo").onclick=()=>{ const p=mkPlayer(+$("pK").value,$("pP").value); p.r=Math.max(1,Math.min(99,Math.floor(+$("pR").value||99))); const nm=$("pN").value.trim().slice(0,24); if(nm) p.n=nm; S.squad.push(p); done(`${p.n} (${p.r}) ajouté !`); };
    document.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.fp; S.coins+=PACKS[i][2]; closePop(); openPack(i); });
    $("g1").onclick=()=>{ if(!liveGoal) return toast("Lance d'abord un match"); liveGoal(1); };
    $("g5").onclick=()=>{ if(!liveGoal) return toast("Lance d'abord un match"); liveGoal(5); };
    $("tBdo").onclick=async()=>{ if(matchRunning) return toast("Attends la fin du match"); S.bdo++; save(); closePop(); const L=S.line.map(byId).filter(Boolean); await ballonDor(L.reduce((a,p)=>p.r>a.r?p:a,L[0])); draw(); };
    $("tLdc").onclick=async()=>{ if(matchRunning) return toast("Attends la fin du match"); S.ldc++; save(); closePop(); await trophyCine("COUPE DES CHAMPIONS",esc(S.club),"🥇","#60a5fa"); draw(); };
    $("tChp").onclick=async()=>{ if(matchRunning) return toast("Attends la fin du match"); S.trophies++; save(); closePop(); await trophyCine("CHAMPIONS !",LEAGUES[S.lg].n); draw(); };
    const needC=f=>()=>{ if(!S.car||!S.car.name) return toast("Crée d'abord ton joueur (onglet Carrière)"); f(S.car); done("Carrière mise à jour"); if(page==="car") car(); };
    $("cA1").onclick=needC(C=>C.pts+=10); $("cA2").onclick=needC(C=>ATTR.forEach(([k])=>C.a[k]=99)); $("cA3").onclick=needC(C=>C.rel=Math.min(100,C.rel+30)); $("cA4").onclick=needC(C=>C.money+=100000); $("cA5").onclick=needC(C=>C.mercato=1); $("cA6").onclick=needC(C=>{C.role=2;C.rel=Math.max(C.rel,85);});
    $("aLive").onclick=()=>{ S.allLive=!S.allLive; done(S.allLive?"Mode joystick à chaque occasion":"Occasions variées"); admin(); };
    $("aTurbo").onclick=()=>{ S.turbo=!S.turbo; done(S.turbo?"Turbo activé":"Turbo désactivé"); admin(); };
    $("aPlay").onclick=async()=>{ if(matchRunning) return toast("Attends la fin du match"); closePop(); const L=S.line.map(byId).filter(Boolean), h=L.filter(p=>p.p==="ATT").sort((a,b)=>b.r-a.r)[0]||L[0]; const ok=await live(h,opponent()); toast(ok?"⚽ But !":"Raté…"); };
    $("t99").onclick=()=>{ S.line.map(byId).forEach(p=>p.r=99); done("Tous les titulaires à 99 !"); };
    $("pts").onclick=()=>{ S.table.find(t=>t.me).pts+=3; done("+3 points"); };
    $("fin").onclick=()=>{ if(matchRunning) return toast("Attends la fin du match"); S.day=14; save(); closePop(); endSeason(); };
    $("rst").onclick=()=>{ if($("rst").dataset.k){ try{ localStorage.removeItem("ultraclub"); }catch{} location.reload(); } else { $("rst").dataset.k=1; $("rst").textContent="Appuie encore pour confirmer"; } };
    $("ok").onclick=()=>{ closePop(); if(!matchRunning) draw(); };
  });
}
$("adm").onclick=admin;
function popup(html,after){ const pi=$("popIn"); pi.classList.toggle("wide",html.includes('class="adm"')); pi.scrollTop=0; pi.innerHTML=html; $("pop").classList.add("on"); after&&after(); }
function closePop(){ $("pop").classList.remove("on"); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
if(!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){ this.rect(x,y,w,h); };
window.__test={moment,live,car,carAfter,carSeasonEnd,carMercato,walkout,ballonDor,trophyCine,S};
draw();
})();
</script>
