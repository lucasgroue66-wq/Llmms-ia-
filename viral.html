<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>VIRAL</title>
<style>
:root{--bg:#050507;--card:#111118;--card2:#191922;--line:#272735;--txt:#f4f4fa;--mut:#8f8fa6;--cy:#25f4ee;--pk:#fe2c55;--gold:#ffd23d;--grn:#2ee59d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding-bottom:84px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(5,5,7,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
.row{display:flex;align-items:center;gap:8px}
.logo{font-weight:900;font-size:20px;letter-spacing:1px;text-shadow:-2px -1px 0 var(--cy),2px 1px 0 var(--pk)}
.rk{font-size:12px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.st b{display:block;font-size:14px}.st span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.en{height:6px;background:#1d1d28;border-radius:4px;margin-top:6px;overflow:hidden}.en i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk));transition:width .3s}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.btn{background:var(--pk);padding:11px 14px;border-radius:12px;font-weight:700}
.btn.c{background:var(--cy);color:#001}
.btn.s{background:var(--card2);border:1px solid var(--line)}
.btn.g{background:linear-gradient(135deg,var(--cy),var(--pk));color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left}
.act .ic{font-size:24px}.act b{display:block;margin-top:4px}.act small{color:var(--mut)}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#000;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;padding:6px 0;border-radius:10px;font-size:10px;color:var(--mut)}
.nav button div{font-size:20px}
.nav button.on{color:#fff}
.nav button.plus div{background:linear-gradient(90deg,var(--cy),var(--pk));border-radius:10px;width:44px;margin:0 auto;font-size:18px;padding:2px 0;color:#fff}
.vid{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;aspect-ratio:9/13;max-height:72vh;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line)}
.vid .art{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.vid .ov2{position:relative;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.vid .side{position:absolute;right:10px;bottom:90px;display:flex;flex-direction:column;gap:14px;align-items:center;font-size:12px;font-weight:700;text-shadow:0 1px 4px #000}
.vid .side div{text-align:center}.vid .side span{display:block;font-size:26px}
.vid .cap{font-size:14px;margin-top:4px;padding-right:60px}
.vid .snd{font-size:12px;color:#ddd;margin-top:6px}
.vid.me{border:2px solid var(--cy)}
.badge{display:inline-block;background:var(--cy);color:#001;border-radius:50%;width:16px;height:16px;font-size:11px;text-align:center;line-height:16px;font-weight:900;vertical-align:middle}
.ovl{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:16px}
.pop{background:#14141c;border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto;text-align:center}
.pop .big{font-size:52px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}
.chip.on{background:var(--cy);color:#001;border-color:var(--cy);font-weight:700}
.chip .x{color:var(--gold);font-weight:800;margin-left:4px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:80;background:#191922;border:1px solid var(--cy);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px #000;animation:tin .25s;max-width:92vw}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}
.adm h3{margin:14px 0 6px;text-align:left;font-size:14px;color:var(--cy)}.adm .chips{justify-content:flex-start;margin:0}.adm .chip{font-size:12px;padding:7px 10px}
.tbar{position:relative;height:42px;background:#1d1d28;border-radius:12px;overflow:hidden;margin:14px 0}
.tbar .z{position:absolute;top:0;bottom:0;background:rgba(37,244,238,.3);border-left:2px solid var(--cy);border-right:2px solid var(--cy)}
.tbar .z.p{background:rgba(254,44,85,.55);border-color:var(--pk)}
.tbar .k{position:absolute;top:0;bottom:0;width:4px;background:#fff;box-shadow:0 0 10px #fff}
.clips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.clips button{aspect-ratio:1;border-radius:12px;background:var(--card2);border:2px solid var(--line);font-size:30px;transition:.15s}
.clips button.lit{border-color:var(--cy);background:#0f3537;transform:scale(1.06)}
.clips button.ok{border-color:var(--grn);background:#0e3326}
.clips button.ko{border-color:var(--pk);background:#3a0e18}
.list .it{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--card2);margin-bottom:8px;border:1px solid var(--line)}
.list .ic2{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none;background:#24243a}
.list .inf{flex:1;min-width:0}.list .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#23233a;color:var(--cy);margin-left:4px}
.bar2{height:8px;background:#1d1d28;border-radius:5px;overflow:hidden;margin-top:4px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pk))}
input[type=text]{width:100%;background:#0a0a10;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:inherit;font-size:16px}
.hero{text-align:center;padding:18px 10px}
.hero .av{font-size:64px}
.log{font-size:13px;color:var(--mut);max-height:160px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed #23233a}
.flex{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{background:var(--card2);border:1px solid var(--line);padding:12px;border-radius:12px;text-align:left;font-size:14px}
.cm{display:flex;gap:8px;text-align:left;padding:8px;border-radius:10px;background:var(--card2);margin-bottom:6px;font-size:13px}
.cm b{font-size:12px;color:var(--mut)}
.prof{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.prof div{aspect-ratio:3/4;border-radius:8px;display:flex;align-items:flex-end;justify-content:flex-start;padding:4px;font-size:11px;font-weight:700;position:relative;overflow:hidden}
.prof div span{position:absolute;inset:0;display:grid;place-items:center;font-size:34px}
.prof div small{position:relative;text-shadow:0 1px 3px #000}
.livebox{background:#000;border-radius:16px;padding:12px;min-height:230px;text-align:left;position:relative;overflow:hidden}
.livebox .chat{font-size:13px;height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.livebox .chat div{padding:2px 0;animation:tin .2s}
.livebox .hd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.lv{background:var(--pk);border-radius:6px;padding:2px 6px;font-weight:800;font-size:11px}
.gift{position:absolute;right:10px;font-size:34px;animation:up 1.4s forwards}
@keyframes up{from{bottom:20px;opacity:1}to{bottom:200px;opacity:0}}
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="main"></main>
<nav class="nav" id="nav"></nav>
<script>
(()=>{
"use strict";
const KEY="viral1";
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1).replace(".0","")+"Md";if(a>=1e6)return(n/1e6).toFixed(1).replace(".0","")+"M";if(a>=1e4)return(n/1e3).toFixed(1).replace(".0","")+"k";return n.toLocaleString("fr-FR")};
const eur=n=>fmt(n)+" €";

/* ---------- Données ---------- */
const RANKS=[[0,"Inconnu","👤"],[1000,"Petit créateur","🌱"],[10000,"Créateur","🎬"],[100000,"Influenceur","✅"],[500000,"Gros influenceur","⭐"],[2e6,"Star du web","🔥"],[10e6,"Méga star","💎"],[50e6,"Icône","👑"],[150e6,"N°1 MONDIAL","🌍"]];
const FORMATS=[
 {n:"Danse",ic:"💃",col:"#3a1450",sk:"dance"},{n:"Humour",ic:"😂",col:"#4a3a08",sk:"humour"},{n:"Storytime",ic:"🗣️",col:"#123a4a",sk:"talk"},
 {n:"Gaming",ic:"🎮",col:"#0f2a50",sk:"edit"},{n:"Réaction",ic:"😱",col:"#4a1020",sk:"talk"},{n:"Tuto",ic:"📚",col:"#103a28",sk:"edit"},
 {n:"Défi",ic:"🏆",col:"#4a2a08",sk:"dance"},{n:"Vlog",ic:"📸",col:"#2a2a40",sk:"talk"},{n:"Cuisine",ic:"🍳",col:"#4a2010",sk:"edit"},{n:"Sport",ic:"⚽",col:"#0e3a1a",sk:"dance"}
];
const SOUNDS=["Phonk nocturne","Son mystère 🎵","Remix accéléré","Beat drill","Piano triste","Son qui buzz","Jingle rétro","Basse 808","Lo-fi chill","Son original"];
const TRENDS=["#ChallengeDuSiècle","#POV","#AvantAprès","#JourDansMaVie","#ÇaPasse","#Transition","#5SecondesPour","#DisMoiSans","#Glow up","#CapOuPasCap","#Rétro","#ModeHiver","#BestOf","#Fail"];
const CAPS={
 Danse:["Nouvelle choré 🔥","Je l'ai apprise en 1h","Essayez de la faire"],Humour:["Quand ta mère dit 'on a à manger à la maison'","Le prof qui...","POV : t'es le seul réveillé"],
 Storytime:["Le jour où j'ai perdu mes clés…","Ma pire honte","Vous allez pas me croire"],Gaming:["Le clutch de ma vie","Rage quit 😤","Top 1 sans armes"],
 Réaction:["Je réagis à vos vidéos","C'est quoi ça ???","Mon avis honnête"],Tuto:["3 astuces que personne connaît","Comment faire en 30s","Tuto facile"],
 Défi:["Défi 24h","Cap ou pas cap ?","Défi impossible"],Vlog:["Une journée avec moi","Je vous emmène","Ma routine"],Cuisine:["Recette en 1 minute","J'ai testé la recette virale","Meilleur goûter"],
 Sport:["Mon meilleur geste","Entraînement du jour","Le but de l'année"]
};
const CREATORS=[
 {n:"lea.dance",ic:"💃",f:4000,fmt:"Danse"},{n:"tom_lol",ic:"🤡",f:15000,fmt:"Humour"},{n:"nina.vlog",ic:"📸",f:60000,fmt:"Vlog"},
 {n:"kurogamer",ic:"🎮",f:250000,fmt:"Gaming"},{n:"chef.moussa",ic:"🍳",f:900000,fmt:"Cuisine"},{n:"zoé.storytime",ic:"🗣️",f:3e6,fmt:"Storytime"},
 {n:"maxfoot10",ic:"⚽",f:9e6,fmt:"Sport"},{n:"lou.trend",ic:"✨",f:25e6,fmt:"Défi"},{n:"mega.ryan",ic:"🦁",f:80e6,fmt:"Réaction"}
];
const BRANDS=[
 {n:"Bulle Soda",ic:"🥤",need:5000,pay:150},{n:"ZapPhone",ic:"📱",need:30000,pay:800},{n:"Sneak'R",ic:"👟",need:120000,pay:3500},
 {n:"GameNova",ic:"🎮",need:500000,pay:15000},{n:"Glow Cosmetic",ic:"💄",need:2e6,pay:60000},{n:"Volt Auto",ic:"🚗",need:10e6,pay:300000},{n:"Lux Watch",ic:"⌚",need:40e6,pay:1.2e6}
];
const SHOP=[
 {k:"phone",n:"Téléphone",ic:"📱",lv:["Vieux tel fissuré","Tel correct","Tel dernier cri","Caméra pro","Caméra cinéma"],cost:[0,300,2500,20000,180000],d:"+qualité image"},
 {k:"light",n:"Lumière",ic:"💡",lv:["Lampe de chambre","Ring light","Softbox","Studio lumière","Plateau TV"],cost:[0,120,1500,12000,100000],d:"+qualité et +énergie max"},
 {k:"edit",n:"Montage",ic:"✂️",lv:["Appli gratuite","Appli payante","PC de montage","Monteur freelance","Équipe de monteurs"],cost:[0,200,3000,25000,220000],d:"+qualité montage"},
 {k:"manager",n:"Manager",ic:"🕴️",lv:["Toi tout seul","Pote qui aide","Manager","Agence","Agence mondiale"],cost:[0,1500,15000,120000,900000],d:"+sponsors et +vues"}
];
const GOOD_C=["Trop drôle 😂😂","T'es trop fort","Je l'ai regardé 10 fois","Abonné direct 🔥","Le meilleur créateur","Partie 2 STP","Mdrrr","Pourquoi c'est si bien","Enfin une vidéo","Légende","Qui est là en 2026 ?","Ça mérite plus de vues"];
const BAD_C=["Bof…","C'était mieux avant","Copieur","Pas drôle","Encore toi ?","Personne t'a demandé","Mid","Je skip"];
const LIVE_C=["salut !!","t'es trop fort","dis bonjour à moi","d'où tu viens ?","quel âge t'as","fais une danse","🔥🔥🔥","je suis là depuis le début","GG","c'est quoi ton jeu préféré","t'as un chat ?","lol","❤️❤️","on veut un défi","premier !"];
const GIFTS=[["🌹",1],["🍩",5],["🎁",20],["🦁",100],["🚀",500],["🌌",2000]];
const NAMES=["sam","lina","yanis","ines","noah","jade","rayan","emma","adam","lou","nael","maya","ilyes","sara","enzo","zoe","kenzo","nour"];
const user=()=>pick(NAMES)+ri(1,999);

/* ---------- État ---------- */
const NEW=()=>({v:1,name:"",av:"😎",day:1,money:20,fol:0,likes:0,views:0,en:100,hype:5,
 sk:{dance:5,humour:5,talk:5,edit:5},up:{phone:0,light:0,edit:0,manager:0},
 vids:[],deals:[],collabs:[],log:[],trends:[],verified:false,cancel:0,live:{best:0,coins:0,n:0},stats:{viral:0,best:0}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||NEW()}catch(e){S=NEW()}S=Object.assign(NEW(),S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const enMax=()=>S.adm&&S.adm.infEn?9999:100+S.up.light*20;
const rank=()=>{let r=RANKS[0];for(const x of RANKS)if(S.fol>=x[0])r=x;return r};
const nextRank=()=>RANKS.find(x=>x[0]>S.fol);
const log=t=>{S.log.unshift("J"+S.day+" · "+t);S.log=S.log.slice(0,40)};
function newTrends(){const t=[...TRENDS].sort(()=>Math.random()-.5).slice(0,3).map(x=>({t:x,f:pick(FORMATS).n,m:+rnd(1.6,3.2).toFixed(1)}));t.push({t:"Aucune tendance",f:null,m:1});S.trends=t}
if(!S.trends.length)newTrends();
let toastT;function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2300)}
function popup(html,close=true){closePop();const o=document.createElement("div");o.className="ovl";o.id="ov";o.innerHTML='<div class="pop">'+html+'</div>';if(close)o.addEventListener("click",e=>{if(e.target===o)closePop()});document.body.appendChild(o);return o}
function closePop(){const o=$("#ov");if(o)o.remove()}
const okBtn=(t="OK")=>`<button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:12px">${t}</button>`;
function useEn(n){if(S.adm&&S.adm.infEn)return true;if(S.en<n){toast("😴 Plus d'énergie — va dormir");return false}S.en-=n;return true}
function pay(n){if(S.money<n){toast("💸 Pas assez d'argent");return false}S.money-=n;return true}
const blue=()=>S.verified?' <span class="badge">✓</span>':"";

/* ---------- Mini-jeux ---------- */
function timingGame(o){
 const {title,sub,rounds=4,onEnd}=o;if(typeof A==="function"&&A().auto){onEnd(1,rounds);return}
 const GOAL=14+Math.round((o.speed||1)*2);let n=0,t0=0,T=null,done=false;
 popup(`<h2>${title}</h2><div class="mut">${sub||""}</div><div style="font-size:15px;margin-top:8px"><b>Tape le plus vite possible pendant 3 secondes !</b></div>
 <div style="font-size:46px;font-weight:900;margin:8px 0" id="tpn">0</div><div class="mut" id="tpt">Appuie pour commencer</div>
 <div style="height:12px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin:10px 0"><i id="tpb" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#facc15);transition:width .1s"></i></div>
 <button id="tbt" style="width:100%;padding:34px 10px;border-radius:18px;font-size:22px;font-weight:900;background:linear-gradient(135deg,#ff2e55,#8b5cff);color:#fff;user-select:none;touch-action:manipulation">👆 TAPE !</button>`,false);
 const fin=()=>{if(done)return;done=true;clearInterval(T);const sc=Math.min(1,n/GOAL);setTimeout(()=>{closePop();onEnd(sc>=1?1:sc>=.6?.7+(sc-.6)*.75:sc,Math.round(sc*rounds))},450);$("#tpt").innerHTML=sc>=1?"🔥 PARFAIT":sc>=.6?"✅ Bien joué":"😅 Un peu lent"};
 $("#tbt").onpointerdown=e=>{e.preventDefault();if(done)return;if(!t0){t0=performance.now();T=setInterval(()=>{const l=Math.max(0,3-(performance.now()-t0)/1000);const el=$("#tpt");if(el)el.textContent=l.toFixed(1)+" s";if(l<=0)fin()},100)}n++;$("#tpn").textContent=n;$("#tpb").style.width=Math.min(100,n/GOAL*100)+"%";if(n>=GOAL)fin()};
}
function editGame(onEnd){ // montage : touche les bons plans quand ils s'allument
 const icons=["🎥","✨","😂","🔥","💥","🎵","👀","⚡"];let hits=0,miss=0,n=0,lit=-1,T;const total=10;
 popup(`<h2>✂️ Montage</h2><div class="mut">Touche le plan qui s'allume — vite !</div><div style="font-weight:900;font-size:22px;margin-top:6px" id="ec">0/${total}</div><div class="clips">${icons.map((c,i)=>`<button data-i="${i}">${c}</button>`).join("")}</div>`,false);
 const btns=[...document.querySelectorAll(".clips button")];
 const next=()=>{btns.forEach(b=>b.classList.remove("lit"));if(n>=total){clearTimeout(T);setTimeout(()=>{closePop();onEnd(clamp((hits-miss*.5)/total,0,1))},300);return}
  lit=ri(0,7);btns[lit].classList.add("lit");n++;$("#ec").textContent=`${n}/${total}`;T=setTimeout(()=>{miss++;next()},Math.max(520,900-n*30))};
 btns.forEach((b,i)=>b.onclick=()=>{if(lit<0)return;clearTimeout(T);if(i===lit){hits++;b.classList.add("ok")}else{miss++;b.classList.add("ko")}setTimeout(()=>b.classList.remove("ok","ko"),200);lit=-1;next()});
 setTimeout(next,500)}

/* ---------- Rendu ---------- */
let TAB="feed";
const NAV=[["feed","🏠","Pour toi"],["trend","🔥","Tendances"],["post","➕",""],["biz","💼","Business"],["me","👤","Profil"]];
function renderTop(){const r=rank();
 $("#top").innerHTML=`<div class="row"><div class="logo">VIRAL</div><button id="adm" title="Panel admin" style="background:#191922;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:15px">🛠️</button><div style="flex:1"></div><div class="rk">${r[2]} ${r[1]}</div></div>
 <div class="stats"><div class="st"><span>Abonnés</span><b>${fmt(S.fol)}</b></div><div class="st"><span>Likes</span><b>${fmt(S.likes)}</b></div><div class="st"><span>Argent</span><b>${eur(S.money)}</b></div><div class="st"><span>Jour</span><b>${S.day}</b></div></div>
 <div class="en"><i style="width:${S.en/enMax()*100}%"></i></div>`}
function renderNav(){const ab=$("#adm");if(ab)ab.onclick=admin;$("#nav").innerHTML=NAV.map(n=>`<button class="${TAB===n[0]?"on":""} ${n[0]==="post"?"plus":""}" data-t="${n[0]}"><div>${n[1]}</div>${n[2]}</button>`).join("");
 document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();window.scrollTo(0,0)})}
function render(){save();renderTop();renderNav();const m=$("#main");
 if(!S.name){m.innerHTML=startHTML();bindStart();return}
 m.innerHTML=({feed:feedHTML,trend:trendHTML,post:postHTML,biz:bizHTML,me:meHTML})[TAB]();

 const out=[];let i=0,j=0;while(i<mine.length||j<items.length){if(j<items.length)out.push(items[j++]);if(i<mine.length)out.push(mine[i++]);if(j<items.length)out.push(items[j++])}

let P={f:null,t:null,s:null};
function postHTML(){const tr=S.trends;
 return `<div class="card"><h2>🎬 Nouvelle vidéo</h2><div class="mut">Choisis bien : suivre la tendance du jour = beaucoup plus de vues.</div>

    const skill=S.sk[f.sk]*.5+S.sk.edit*.2;const gear=S.up.phone*4+S.up.light*2+S.up.edit*4;
    let q=Math.round(clamp(hook*30+ed*20+skill*.6+gear+rnd(-6,6),1,100));if(S.adm&&S.adm.q100)q=100;
    const trendOk=t.f===null?1:(t.f===f.n?t.m:1+(t.m-1)*.25);
    publish(f,t,snd,q,trendOk);P={f:null,t:null,s:null}})}})}}
function publish(f,t,snd,q,trendOk){
 const mgr=1+S.up.manager*.2;const soundB=snd==="Son qui buzz"?1.25:1;
 const reach=(S.fol*rnd(.6,1.4)+ri(80,250))*(q/55)**2*trendOk*soundB*mgr*(.7+S.hype/100*.6)*(S.cancel>0?.4:1);
 const vChance=clamp((q-60)/120*trendOk*.9,0,.6);const viral=(S.adm&&S.adm.viral)||Math.random()<vChance;
 const views=Math.round(reach*(viral?rnd(8,25):1));
 const likes=Math.round(views*rnd(.05,.12)*(q/70));const com=Math.round(views*rnd(.003,.008));const sh=Math.round(views*rnd(.001,.004)*(viral?3:1));
 const fol=Math.round(views*rnd(.008,.02)*(q/70)*(viral?1.6:1));
 const v={ic:f.ic,col:f.col,fmt:f.n,cap:pick(CAPS[f.n]),tr:t.f?t.t:"#fyp",snd,q,views,likes,com,sh,viral,day:S.day,tail:Math.round(views*(viral?.5:.25)),replied:false};
 S.vids.unshift(v);S.vids=S.vids.slice(0,30);S.views+=views;S.likes+=likes;S.fol+=fol;S.hype=clamp(S.hype+(viral?35:6),0,100);S.stats.best=Math.max(S.stats.best,views);if(viral)S.stats.viral++;
 log(`${viral?"🚀 VIRAL":"🎬 Vidéo"} ${f.ic} ${f.n} : ${fmt(views)} vues, +${fmt(fol)} abonnés`);checkVerified();
 popup(`<div class="big">${viral?"🚀":q>=70?"🔥":q>=45?"👍":"😐"}</div><h2>${viral?"TA VIDÉO EST VIRALE":"Vidéo en ligne"}</h2>
  <div class="mut">Qualité ${q}/100 · ${trendOk>1.4?"tendance réussie ✅":trendOk>1?"tendance à moitié":"pas de tendance"}</div>
  <div style="font-size:26px;font-weight:900;margin:10px 0;color:var(--cy)">👁️ ${fmt(views)} vues</div><div class="mut">❤️ ${fmt(likes)} · 💬 ${fmt(com)} · ↗️ ${fmt(sh)} · <b style="color:#fff">+${fmt(fol)} abonnés</b></div>
  <div class="flex" style="justify-content:center;margin-top:12px"><button class="btn s" onclick="document.getElementById('ov').remove()">OK</button><button class="btn g" id="seecom">💬 Voir les commentaires</button></div>`);

function checkVerified(){if(!S.verified&&S.fol>=100000){S.verified=true;log("✅ Compte certifié");const sh=()=>{if($("#ov")){setTimeout(sh,800);return}popup(`<div class="big">✅</div><h2>COMPTE CERTIFIÉ</h2><div class="mut">Tu as le badge bleu à côté de ton pseudo !</div>${okBtn("Trop bien")}`)};setTimeout(sh,900)}}

 document.querySelectorAll("#ov [data-i]").forEach(b=>b.onclick=()=>{closePop();e.a[+b.dataset.i][1]();render()})}

/* ---------- Panel admin ---------- */
function admin(){S.adm=S.adm||{};const A=S.adm;const T=(k,l)=>`<button class="chip ${A[k]?"on":""}" data-tg="${k}">${A[k]?"✅":"⬜"} ${l}</button>`;
 popup(`<div class="adm"><h2>🛠️ Panel admin</h2><div class="mut">Ta partie, tes règles 😈</div>
 <h3>👥 Abonnés</h3><div class="chips">${[1e3,1e5,1e6,1e8].map(v=>`<button class="chip" data-fo="${v}">+${fmt(v)}</button>`).join("")}<button class="chip" data-fo="-1">🌍 Direct N°1 MONDIAL</button></div>
 <h3>💶 Argent & likes</h3><div class="chips">${[1e3,1e5,1e6,1e9].map(v=>`<button class="chip" data-mo="${v}">+${fmt(v)} €</button>`).join("")}<button class="chip" id="alk">❤️ +1M likes</button></div>
 <h3>⚡ Énergie & hype</h3><div class="chips"><button class="chip" id="aen">⚡ Énergie pleine</button>${T("infEn","Énergie infinie")}<button class="chip" id="ahy">🔥 Hype 100</button><button class="chip" id="acn">😇 Effacer les dramas</button></div>
 <h3>🎬 Vidéos</h3><div class="chips">${T("viral","Chaque vidéo = VIRALE")}${T("q100","Qualité toujours 100")}<button class="chip" id="atr">🔥 Tendances ×10</button><button class="chip" id="arv">🚀 Relancer toutes mes vidéos</button></div>
 <h3>🔴 Lives</h3><div class="chips">${T("bigGift","Que des cadeaux 🌌")}</div>
 <h3>📊 Skills & matos</h3><div class="chips"><button class="chip" id="ask">Tous les skills à 100</button><button class="chip" id="aup">Tout le matos au max</button><button class="chip" id="ave">✅ Badge certifié</button><button class="chip" id="asp">🤝 Tous les sponsors</button><button class="chip" id="acl">🤝 Toutes les collabs</button></div>
 <h3>📅 Temps</h3><div class="chips"><button class="chip" id="ad1">⏩ +1 jour</button><button class="chip" id="ad7">⏩ +7 jours</button><button class="chip" id="aev">🎲 Événement maintenant</button></div>
 <h3>✏️ Profil</h3><div class="chips"><button class="chip" id="anm">Changer de pseudo</button>${AVS.map(a=>`<button class="chip" data-av="${a}">${a}</button>`).join("")}</div>
 <button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:16px">Fermer</button></div>`);
 const re=m=>{if(m)toast(m);checkVerified();render();admin()};
 document.querySelectorAll("[data-fo]").forEach(b=>b.onclick=()=>{const v=+b.dataset.fo;if(v<0)S.fol=Math.max(S.fol,1.5e8);else S.fol+=v;re("👥 Abonnés ajoutés")});
 document.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{S.money+=+b.dataset.mo;re("💶 Argent ajouté")});
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{A[b.dataset.tg]=!A[b.dataset.tg];if(b.dataset.tg==="infEn")S.en=enMax();re()});
 document.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{S.av=b.dataset.av;re("Photo changée")});
 $("#alk").onclick=()=>{S.likes+=1e6;re("❤️ +1M likes")};
 $("#aen").onclick=()=>{S.en=enMax();re("⚡ Énergie pleine")};$("#ahy").onclick=()=>{S.hype=100;re("🔥 Hype 100")};$("#acn").onclick=()=>{S.cancel=0;re("😇 Plus de drama")};
 $("#atr").onclick=()=>{for(const t of S.trends)if(t.f)t.m=10;re("🔥 Tendances ×10 aujourd'hui")};
 $("#arv").onclick=()=>{for(const v of S.vids)v.tail+=Math.round(v.views+S.fol*.5);re("🚀 Tes vidéos repartent cette nuit")};
 $("#ask").onclick=()=>{for(const k in S.sk)S.sk[k]=100;re("📊 Skills à 100")};
 $("#aup").onclick=()=>{for(const s of SHOP)S.up[s.k]=s.cost.length-1;re("🛒 Matos au max")};
 $("#ave").onclick=()=>{S.verified=true;re("✅ Certifié")};
 $("#asp").onclick=()=>{BRANDS.forEach((b,i)=>{if(!S.deals.find(d=>d.i===i))S.deals.push({i,daily:Math.round(b.pay*.05)})});re("🤝 Tous les sponsors signés")};
 $("#acl").onclick=()=>{S.collabs=CREATORS.map((_,i)=>i);re("🤝 Collabs faites")};
 $("#ad1").onclick=()=>{closePop();sleep()};$("#ad7").onclick=()=>{closePop();for(let i=0;i<7;i++)sleep();closePop()};
 $("#aev").onclick=()=>{closePop();event()};
 $("#anm").onclick=()=>{const n=prompt("Nouveau pseudo :",S.name);if(n&&n.trim().length>=2){S.name=n.trim().replace(/[^a-zA-Z0-9._àâéèêëîïôûùç-]/g,"").toLowerCase().slice(0,18);re("✏️ Pseudo changé")}};
}

/* Tendances + collabs */
function trendHTML(){
 return `<div class="card"><h2>🔥 Tendances du jour</h2><div class="mut">Elles changent chaque nuit.</div>${S.trends.filter(t=>t.f).map((t,i)=>`<div class="list"><div class="it"><div class="ic2">${FORMATS.find(f=>f.n===t.f).ic}</div><div class="inf"><b>${esc(t.t)}</b><small class="mut">Format : ${t.f}</small></div><span class="tag" style="color:var(--gold);font-size:14px">×${t.m}</span></div></div>`).join("")}</div>
 <div class="card"><h2>🤝 Collabs</h2><div class="mut" style="margin-bottom:8px">Une collab = ses abonnés découvrent ton contenu. 35⚡</div><div class="list">${CREATORS.map((c,i)=>{const ok=S.fol>=c.f*.08,done=S.collabs.includes(i);return `<div class="it"><div class="ic2">${c.ic}</div><div class="inf"><b>@${c.n}${c.f>=1e5?' <span class="badge">✓</span>':""}${done?'<span class="tag">✔ fait</span>':""}</b><small class="mut">${fmt(c.f)} abonnés · ${c.fmt}</small></div>${ok?`<button class="btn" data-c="${i}" style="padding:8px 12px;font-size:13px">Collab</button>`:`<small class="mut">🔒 ${fmt(c.f*.08)}</small>`}</div>`}).join("")}</div></div>
 <div class="card"><h2>🏆 Classement</h2>${[...CREATORS.map(c=>({n:c.n,ic:c.ic,f:c.f})),{n:S.name,ic:S.av,f:S.fol,me:1}].sort((a,b)=>b.f-a.f).map((a,i)=>`<div class="list"><div class="it" style="${a.me?"border-color:var(--cy)":""}"><b style="width:22px;color:var(--cy)">${i+1}</b><div class="ic2" style="width:34px;height:34px;font-size:18px">${a.ic}</div><div class="inf"><b>@${esc(a.n)}</b></div><small>${fmt(a.f)}</small></div></div>`).join("")}</div>`}
function bindTrend(){document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const i=+b.dataset.c,c=CREATORS[i];if(!useEn(35))return;
 timingGame({title:`🤝 Collab avec @${c.n}`,sub:"Tournez ensemble — reste synchro",rounds:5,onEnd:sc=>{const f=Math.round(c.f*rnd(.01,.03)*(.4+sc)*(S.collabs.includes(i)?.4:1)+20);const v=Math.round(c.f*rnd(.2,.6)*(.5+sc));S.fol+=f;S.views+=v;S.hype=clamp(S.hype+15,0,100);if(!S.collabs.includes(i))S.collabs.push(i);
  log(`🤝 Collab avec @${c.n} : +${fmt(f)} abonnés`);popup(`<div class="big">🤝</div><h2>Collab en ligne</h2><div class="mut">avec @${c.n} ${c.ic}</div><div style="font-size:24px;font-weight:900;color:var(--cy);margin:8px 0">👁️ ${fmt(v)} vues · +${fmt(f)} abonnés</div>${okBtn()}`);checkVerified();render()}})})}

/* Business */
function bizHTML(){
 return `<div class="card"><h2>💰 Fonds créateurs</h2><div class="mut">${S.fol>=10000?"✅ Activé : tu gagnes de l'argent sur les vues de chaque nuit.":"🔒 Débloqué à 10 000 abonnés."}</div></div>
 <div class="card"><h2>🤝 Sponsors</h2><div class="list">${BRANDS.map((b,i)=>{const own=S.deals.find(d=>d.i===i),ok=S.fol>=b.need;const p=Math.round(b.pay*(1+S.up.manager*.3));return `<div class="it"><div class="ic2">${b.ic}</div><div class="inf"><b>${b.n}${own?'<span class="tag">✔ partenaire</span>':""}</b><small class="mut">${ok?(own?`+${eur(own.daily)}/jour`:`Vidéo sponso : ${eur(p)} + ${eur(p*.05)}/jour`):`🔒 ${fmt(b.need)} abonnés`}</small></div>${ok&&!own?`<button class="btn c" data-b="${i}" style="padding:8px 10px;font-size:13px">Signer</button>`:""}</div>`}).join("")}</div></div>
 <div class="card"><h2>🛒 Matos</h2><div class="list">${SHOP.map(s=>{const l=S.up[s.k],nx=s.cost[l+1];return `<div class="it"><div class="ic2">${s.ic}</div><div class="inf"><b>${s.n} <span class="tag">${s.lv[l]}</span></b><small class="mut">${s.d}</small></div>${nx!=null?`<button class="btn c" data-u="${s.k}" style="padding:8px 10px;font-size:13px">${eur(nx)}</button>`:`<span class="tag">MAX</span>`}</div>`}).join("")}</div></div>`}
function bindBiz(){
 document.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>{const i=+x.dataset.b,b=BRANDS[i];if(!useEn(20))return;const p=Math.round(b.pay*(1+S.up.manager*.3));
  timingGame({title:`${b.ic} Vidéo sponso ${b.n}`,sub:"Présente le produit sans que ce soit gênant",rounds:4,onEnd:sc=>{const money=Math.round(p*(.6+sc*.6));S.money+=money;S.deals.push({i,daily:Math.round(p*.05)});const f=Math.round(S.fol*(sc>.6?.01:-.01));S.fol+=f;
   log(`${b.ic} Partenariat ${b.n} : +${eur(money)}`);popup(`<div class="big">${b.ic}</div><h2>Partenariat signé</h2><div style="font-size:24px;font-weight:900;color:var(--grn);margin:8px 0">+${eur(money)}</div><div class="mut">${sc>.6?"Vidéo réussie, tes abonnés ont aimé":"Un peu forcé… certains abonnés sont partis"}</div>${okBtn()}`);render()}})});
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{const s=SHOP.find(x=>x.k===b.dataset.u),l=S.up[s.k];if(!pay(s.cost[l+1]))return;S.up[s.k]++;log(`🛒 ${s.n} : ${s.lv[l+1]}`);toast(`${s.ic} ${s.lv[l+1]} !`);render()})}

/* Profil */
function meHTML(){
 return `<div class="card hero"><div class="av">${S.av}</div><h2 style="margin:6px 0">@${esc(S.name)}${blue()}</h2><div class="mut">${rank()[2]} ${rank()[1]}</div>
 <div class="flex" style="justify-content:space-around;margin-top:12px"><div><b>${fmt(S.fol)}</b><div class="mut">abonnés</div></div><div><b>${fmt(S.likes)}</b><div class="mut">likes</div></div><div><b>${fmt(S.views)}</b><div class="mut">vues</div></div></div></div>
 <div class="card"><h3>🎬 Mes vidéos (${S.vids.length})</h3>${S.vids.length?`<div class="prof">${S.vids.map((v,i)=>`<div data-v="${i}" style="background:radial-gradient(circle,${v.col},#000)"><span>${v.ic}</span><small>▶ ${fmt(v.views)}${v.viral?" 🚀":""}</small></div>`).join("")}</div>`:`<div class="mut">Aucune vidéo.</div>`}</div>
 <div class="card"><h3>📊 Skills</h3>${Object.keys(SKN).map(k=>`<div style="margin-bottom:8px"><div class="row"><span style="font-size:13px">${SKN[k]}</span><div style="flex:1"></div><b style="font-size:13px">${Math.round(S.sk[k])}/100</b></div><div class="bar2"><i style="width:${S.sk[k]}%"></i></div></div>`).join("")}</div>
 <div class="card"><h3>🏆 Stats</h3><div class="mut" style="line-height:1.8">🚀 Vidéos virales : ${S.stats.viral}<br>👁️ Record : ${fmt(S.stats.best)} vues<br>🔴 Lives : ${S.live.n} · record ${fmt(S.live.best)} spectateurs<br>🤝 Collabs : ${S.collabs.length}</div></div>
 <div class="card"><h3>📰 Journal</h3><div class="log">${S.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></div>
 <div style="text-align:center"><button class="btn s" id="reset" style="font-size:12px;padding:6px 10px">Recommencer à zéro</button></div>`}
function bindMe(){document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>comments(+b.dataset.v));
 $("#reset").onclick=()=>{popup(`<h2>Tout effacer ?</h2><div class="flex" style="justify-content:center;margin-top:12px"><button class="btn s" onclick="document.getElementById('ov').remove()">Non</button><button class="btn" id="rz">Oui</button></div>`);$("#rz").onclick=()=>{S=NEW();newTrends();closePop();TAB="feed";render()}}}

render();
Object.defineProperty(window,"__VI",{get:()=>S});
})();
</script>
