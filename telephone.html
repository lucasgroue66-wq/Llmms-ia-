<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LE TÉLÉPHONE ULTIME</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0a0a0f;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#phone{position:relative;width:100%;height:100%;max-width:430px;max-height:930px;margin:0 auto;overflow:hidden;background:#000}
@media(min-width:500px){#phone{margin-top:2vh;height:96vh;border-radius:44px;border:10px solid #1d1d24;box-shadow:0 30px 80px #000}}
.wall{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,#6d28d9 0,transparent 55%),radial-gradient(100% 70% at 100% 100%,#db2777 0,transparent 55%),#0f0a1f}
.sb{position:absolute;top:0;left:0;right:0;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:700;z-index:40;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.screen{position:absolute;inset:34px 0 0 0;overflow-y:auto;overflow-x:hidden}
.home{padding:18px 18px 110px}
.wid{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border-radius:24px;padding:14px;margin-bottom:18px}
.wid b{font-size:15px}.wid .big{font-size:30px;font-weight:900}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;position:relative}
.app .ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:31px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.app .bd{position:absolute;top:-6px;right:4px;background:#ff3b30;border-radius:999px;min-width:22px;height:22px;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.dock{position:absolute;bottom:22px;left:14px;right:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(16px);border-radius:28px;padding:12px;display:flex;justify-content:space-around;z-index:5}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:5px;background:rgba(255,255,255,.8);z-index:45}
.appv{position:absolute;inset:0;background:#0e0e14;z-index:20;display:flex;flex-direction:column;animation:op .22s}
@keyframes op{from{transform:scale(.85);opacity:0}}
.ah{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:800;font-size:19px;border-bottom:1px solid #222}
.ah .bk{font-size:22px;padding:2px 8px}
.ab{flex:1;overflow-y:auto;padding:14px 14px 40px}
.card{background:#17171f;border:1px solid #26262f;border-radius:16px;padding:12px;margin-bottom:10px}
.mut{color:#9a9aae;font-size:13px}
.btn{background:#7c3aed;border-radius:12px;padding:11px 14px;font-weight:800;color:#fff}
.btn.full{width:100%}
.row{display:flex;align-items:center;gap:10px}
.it{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:#17171f;margin-bottom:8px;border:1px solid #24242e}
.it .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#26263a;flex:none}
.it .inf{flex:1;min-width:0}.it .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#26263a;color:#c4b5fd;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#1e1e28;border:1px solid #2e2e3a;border-radius:999px;padding:8px 12px;font-size:13px}
.chip.on{background:#fff;color:#000;font-weight:800}
.notif{position:absolute;top:40px;left:10px;right:10px;z-index:60;background:rgba(40,40,52,.95);backdrop-filter:blur(14px);border-radius:20px;padding:12px;display:flex;gap:10px;align-items:center;animation:nd .3s;box-shadow:0 10px 30px rgba(0,0,0,.5)}
@keyframes nd{from{transform:translateY(-120%)}}
.notif .ni{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex:none}
.notif b{font-size:13px}.notif div{font-size:13px}
.ov{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:16px}
.pop{background:#17171f;border:1px solid #2a2a36;border-radius:22px;padding:18px;width:100%;max-height:86%;overflow:auto;text-align:center}
.pop .bigi{font-size:50px}
.opts{display:grid;gap:8px;margin-top:10px}.opts button{background:#22222e;border:1px solid #30303e;padding:12px;border-radius:12px;text-align:left;font-size:14px}
.live{position:absolute;inset:34px 0 0 0;background:linear-gradient(160deg,#1b103a,#050508);z-index:30;display:flex;flex-direction:column}
.live .game{height:38%;display:grid;place-items:center;font-size:90px;position:relative;background:radial-gradient(circle,#2a1960,#090612)}
.live .lv{position:absolute;top:10px;left:10px;background:#e11d48;border-radius:6px;padding:3px 8px;font-weight:900;font-size:12px}
.live .vw{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:700}
.chat{flex:1;overflow:hidden;padding:8px 12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:14px}
.chat div{padding:3px 0;animation:op .15s}
.chat .sub{background:linear-gradient(90deg,#7c3aed55,transparent);border-left:3px solid #a78bfa;padding-left:6px;border-radius:4px}
.chat .troll{color:#fca5a5}
.chat .troll button{background:#ef4444;border-radius:6px;padding:1px 6px;font-size:12px;margin-left:6px}
.lacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px 26px}
.lacts button{background:#22222e;border:1px solid #33334a;border-radius:12px;padding:11px 6px;font-size:13px;font-weight:700}
.lacts button:disabled{opacity:.35}
.flame{color:#fb923c;font-weight:900}
.adm h3{margin:14px 0 6px;text-align:left;font-size:14px;color:#c4b5fd}.adm .chips{margin:0}.adm .chip{font-size:12px;padding:7px 10px}
.toast{position:absolute;left:50%;bottom:60px;transform:translateX(-50%);z-index:80;background:#22222e;border:1px solid #a78bfa;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap;animation:op .2s}
input[type=text]{width:100%;background:#0b0b10;border:1px solid #2e2e3a;color:#fff;border-radius:12px;padding:12px;font:inherit;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid3 div{aspect-ratio:1;display:grid;place-items:center;font-size:34px;border-radius:4px;position:relative}
.grid3 small{position:absolute;bottom:3px;left:4px;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.bat{display:inline-block;width:24px;height:12px;border:2px solid #fff;border-radius:3px;position:relative;vertical-align:-1px}.bat i{position:absolute;left:1px;top:1px;bottom:1px;border-radius:1px}
</style>
</head>
<body>
<div id="phone"><div class="wall"></div><div class="sb" id="sb"></div><div class="screen" id="scr"></div><div class="homebar" id="hb"></div></div>
<script>
(()=>{
"use strict";
const KEY="telephone1";
const $=s=>document.querySelector(s);const P=()=>$("#phone");
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1).replace(".0","")+"Md";if(a>=1e6)return(n/1e6).toFixed(1).replace(".0","")+"M";if(a>=1e4)return(n/1e3).toFixed(1).replace(".0","")+"k";return n.toLocaleString("fr-FR")};
const eur=n=>fmt(n)+" €";
/* ---------- Applis (noms inventés) ---------- */
const APPS={
 streamo:{n:"Streamo",ic:"📺",bg:"linear-gradient(135deg,#7c3aed,#a855f7)"},
 snapo:{n:"Snapo",ic:"👻",bg:"#fde047"},
 toktok:{n:"TokTok",ic:"🎵",bg:"linear-gradient(135deg,#111,#222)"},
 insta:{n:"Instaflo",ic:"📸",bg:"linear-gradient(135deg,#f59e0b,#ec4899,#8b5cf6)"},
 disko:{n:"Disko",ic:"💬",bg:"#5865f2"},
 msg:{n:"Messages",ic:"✉️",bg:"#22c55e"},
 bank:{n:"Banque",ic:"💳",bg:"linear-gradient(135deg,#0ea5e9,#2563eb)"},
 shop:{n:"Boutique",ic:"🛍️",bg:"linear-gradient(135deg,#f97316,#ef4444)"},
 stats:{n:"Stats",ic:"📊",bg:"linear-gradient(135deg,#14b8a6,#0d9488)"},
 settings:{n:"Réglages",ic:"⚙️",bg:"#6b7280"},
 panel:{n:"Panel",ic:"🛠️",bg:"linear-gradient(135deg,#111,#7c3aed)"},
 sonify:{n:"Sonify",ic:"🎧",bg:"linear-gradient(135deg,#16a34a,#065f46)"},
 mode:{n:"Shopping",ic:"👕",bg:"linear-gradient(135deg,#f472b6,#be185d)"},
 market:{n:"Bourse",ic:"📈",bg:"linear-gradient(135deg,#0f172a,#16a34a)"},
 phone:{n:"Téléphone",ic:"📞",bg:"#22c55e"},
 promo:{n:"Promo",ic:"📣",bg:"linear-gradient(135deg,#ea580c,#facc15)"}
};
const GAMES=[["Fortnite-like","🔫"],["Jeu de foot","⚽"],["Minecraft-like","⛏️"],["Horreur","👻"],["Just Chatting","💬"],["Course","🏎️"],["Roblox-like","🧱"]];
const NAMES=["sam","lina","yanis","ines","noah","jade","rayan","emma","adam","lou","nael","maya","ilyes","sara","enzo","zoe","kenzo","nour","mehdi","lea"];
const user=()=>pick(NAMES)+pick(["","_","."])+ri(1,999);
const CHAT=["salut !!","GG","t'es trop fort","premier !","d'où tu viens ?","fais un défi","😂😂😂","on t'aime","c'est quoi ton setup ?","clip ça","LETS GO","dis bonjour à moi stp","w stream","joue avec nous","🔥🔥🔥","mdrr","t'as quel âge ?","tu streams demain ?"];
const TROLL=["t'es nul","ennuyant…","stream de fou… NON","je dors","nul le jeu"];
const FRIENDS=[["kenzo","🧑🏾"],["lina","👧"],["yanis","🧑"],["jade","👱‍♀️"],["mehdi","🧔"],["zoe","👩‍🦰"]];
const PLACES=[{n:"Ta chambre",ic:"🛏️",c:0,m:1},{n:"Parc",ic:"🌳",c:0,m:1.1},{n:"Resto chic",ic:"🍣",c:300,m:1.4},{n:"Plage",ic:"🏖️",c:2000,m:1.8},{n:"Paris",ic:"🗼",c:8000,m:2.3},{n:"Dubaï",ic:"🏙️",c:60000,m:3.2},{n:"Jet privé",ic:"✈️",c:500000,m:5}];
const SETUP=[{k:"pc",n:"PC",ic:"🖥️",lv:["Vieux PC","PC gamer","PC de streamer","Setup de pro"],c:[0,800,5000,40000]},{k:"cam",n:"Caméra",ic:"📷",lv:["Webcam floue","Webcam HD","Caméra pro","Caméra cinéma"],c:[0,150,1500,15000]},{k:"mic",n:"Micro",ic:"🎙️",lv:["Micro du casque","Micro USB","Micro studio","Micro légendaire"],c:[0,100,1200,10000]},{k:"light",n:"Lumière",ic:"💡",lv:["Lampe","Ring light","LED RGB","Studio lumière"],c:[0,60,600,6000]}];
const BRANDS=[["Bulle Soda","🥤",200],["ZapPhone","📱",900],["Sneak'R","👟",3000],["GameNova","🎮",12000],["Glow","💄",40000],["Volt Auto","🚗",150000]];
const TRENDS=["#POV","#Transition","#Danse","#Défi24h","#AvantAprès","#Fail","#GlowUp","#Rétro"];
/* ---------- État ---------- */
const NEW=()=>({v:1,name:"",av:"😎",day:1,hour:9,bat:100,money:30,
 f:{streamo:0,snapo:0,toktok:0,insta:0,disko:0},subs:0,
 flames:FRIENDS.map(x=>({n:x[0],ic:x[1],fl:ri(0,4),sent:false})),
 posts:[],tok:[],up:{pc:0,cam:0,mic:0,light:0},places:[0,1],
 dms:[],notifs:{},log:[],verified:false,trend:pick(TRENDS),lives:0,bestV:0,deals:[],adm:{},liveDone:0});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||NEW()}catch(e){S=NEW()}S=Object.assign(NEW(),S);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const A=()=>S.adm||(S.adm={});
const fame=()=>Object.values(S.f).reduce((a,b)=>a+b,0);
const gear=()=>Object.values(S.up).reduce((a,b)=>a+b,0);
const log=t=>{S.log.unshift(`J${S.day} ${hh()} · ${t}`);S.log=S.log.slice(0,60)};
const hh=()=>String(Math.floor(S.hour)).padStart(2,"0")+":"+String(Math.round((S.hour%1)*60)).padStart(2,"0");
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.innerHTML=t;P().appendChild(d);setTimeout(()=>d.remove(),2200)}
function popup(h,close=true){closePop();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML=`<div class="pop">${h}</div>`;if(close)o.onclick=e=>{if(e.target===o)closePop()};P().appendChild(o)}
function closePop(){const o=$("#ov");if(o)o.remove()}
const okB=(t="OK",id="")=>`<button class="btn full" style="margin-top:12px" ${id?`id="${id}"`:`onclick="this.closest('.ov').remove()"`}>${t}</button>`;
function notify(app,title,text){const a=APPS[app];if(LOCKED){S.lockN.unshift({app,title,text,h:hh()});S.lockN=S.lockN.slice(0,8);S.notifs[app]=(S.notifs[app]||0)+1;drawLock();return}document.querySelectorAll(".notif").forEach(e=>e.remove());const d=document.createElement("div");d.className="notif";d.innerHTML=`<div class="ni" style="background:${a.bg}">${a.ic}</div><div style="flex:1"><b>${a.n.toUpperCase()} · maintenant</b><div><b>${esc(title)}</b> ${esc(text)}</div></div>`;d.onclick=()=>{d.remove();open(app)};P().appendChild(d);setTimeout(()=>d.remove(),3500);S.notifs[app]=(S.notifs[app]||0)+1}
function useBat(n,h=1){if(A().infBat){S.hour+=h*.5;return true}if(S.bat<n){popup(`<div class="bigi">🪫</div><h3>Batterie faible</h3><div class="mut">Il te reste ${Math.round(S.bat)}%. Recharge ton téléphone ou va dormir.</div><div class="opts"><button id="chg">🔌 Recharger (+2 h)</button><button id="slp">😴 Dormir → jour suivant</button></div>`);$("#chg").onclick=()=>{closePop();charge()};$("#slp").onclick=()=>{closePop();sleep()};return false}
 S.bat-=n;S.hour+=h;if(S.hour>=24){sleep(true);return false}return true}
function charge(){S.bat=100;S.hour+=2;if(S.hour>=24){sleep(true);return}toast("🔌 Batterie 100 %");render()}
function sleep(forced){
 // flammes Snapo
 let lost=0;for(const f of S.flames){if(f.sent)f.fl++;else if(f.fl>0&&!A().keepFl){f.fl=0;lost++}f.sent=false}
 const passive=Math.round(S.subs*2.5+S.f.toktok*.01+S.f.insta*.01+S.deals.reduce((a,d)=>a+d,0));S.money+=passive;
 for(const k in S.f)S.f[k]=Math.round(S.f[k]*rnd(.995,1.01));
 S.day++;S.hour=8+Math.random();S.bat=100;S.trend=pick(TRENDS);S.liveDone=0;
 log(`😴 Nuit : +${eur(passive)} (abonnés payants & partenariats)${lost?` · 💔 ${lost} flamme(s) perdue(s)`:""}`);
 render();popup(`<div class="bigi">${forced?"🥱":"☀️"}</div><h3>${forced?"Il est minuit, tu t'endors…":"Bonjour !"} Jour ${S.day}</h3><div class="mut">+${eur(passive)} pendant la nuit${lost?`<br>💔 Tu as perdu ${lost} flamme(s) Snapo (tu n'as pas envoyé de snap)`:""}<br>🔥 Tendance du jour : <b>${S.trend}</b></div>${okB()}`);
 if(Math.random()<.7)setTimeout(newDM,2500)}
/* ---------- DM ---------- */
function newDM(){const fm=fame();const pool=[
 {from:"Un fan",ic:"🥹",t:"Je regarde tous tes lives, tu m'as trop motivé ❤️",o:[["Répondre ❤️",()=>{S.f.insta+=ri(5,20);toast("❤️ Le fan est trop content")}],["Ignorer",()=>{}]]},
 {from:"Hater",ic:"😒",t:"T'es surcôté frère.",o:[["😂 Répondre avec humour",()=>{if(Math.random()<.6){S.f.toktok+=ri(10,60);toast("😂 Ta réponse a fait rire tout le monde")}else toast("😐 Bof")}],["🚫 Bloquer",()=>toast("🚫 Bloqué")]]}];
 if(fm>200)pool.push({from:"Créateur "+pick(["@luna.live","@maxgaming","@nina.vlog","@kuro"]),ic:"🤝",t:"Collab ensemble ? Live à deux ce soir 👀",o:[["Accepter (20 % batterie)",()=>{if(!useBat(20,1))return;const g=Math.round(fm*rnd(.05,.12)+40);S.f.streamo+=g;S.f.toktok+=Math.round(g*.6);log(`🤝 Collab : +${fmt(g)} followers`);toast(`🤝 +${fmt(g)} followers`)}],["Refuser",()=>{}]]});
 const b=BRANDS.filter(x=>fm>=x[2]*3);if(b.length){const B=b[b.length-1];const pay=Math.round(B[2]*(1+gear()*.08));pool.push({from:B[0],ic:B[1],t:`Partenariat ? On te paye ${eur(pay)} pour une story + ${eur(Math.round(pay*.03))}/jour.`,o:[["✅ Signer",()=>{S.money+=pay;S.deals.push(Math.round(pay*.03));log(`${B[1]} Partenariat ${B[0]} : +${eur(pay)}`);toast(`💸 +${eur(pay)}`)}],["Non merci",()=>{}]]})}
 if(Math.random()<.25)pool.push({from:"Compte « Support »",ic:"⚠️",t:"Ton compte va être supprimé ! Envoie ton mot de passe pour le vérifier.",o:[["🛡️ Ignorer (c'est une arnaque)",()=>toast("🛡️ Bien joué : JAMAIS de mot de passe")],["Envoyer le mot de passe",()=>{const l=Math.round(S.f.insta*.2);S.f.insta-=l;log("🔓 Compte Instaflo piraté");toast(`🔓 Piraté ! −${fmt(l)} abonnés`)}]]});
 const d=pick(pool);S.dms.unshift({...d,o:d.o.map(x=>x[0]),id:Date.now(),done:false});S.dms=S.dms.slice(0,20);DMF[S.dms[0].id]=d.o.map(x=>x[1]);notify("msg",d.from,d.t);render(true)}
const DMF={};
/* ---------- Rendu ---------- */
let OPEN=null;
function sbar(){const b=Math.round(S.bat);$("#sb").innerHTML=`<span>${hh()}</span><span>J${S.day} · 📶 <span class="bat"><i style="width:${Math.max(4,b/100*18)}px;background:${b<20?"#ef4444":"#fff"}"></i></span> ${A().infBat?"∞":b+"%"}</span>`}
function render(keep){save();sbar();if(!S.name){$("#scr").innerHTML=setupHTML();bindSetup();return}
 if(!keep||!OPEN){$("#scr").innerHTML=homeHTML();document.querySelectorAll("[data-app]").forEach(b=>b.onclick=()=>open(b.dataset.app));const sb=$("#sleepB");if(sb)sb.onclick=()=>sleep()}
 if(OPEN&&!keep)open(OPEN,true)}
function homeHTML(){const fm=fame();const ap=k=>`<button class="app" data-app="${k}"><div class="ic" style="background:${APPS[k].bg}">${APPS[k].ic}</div>${APPS[k].n}${S.notifs[k]?`<span class="bd">${S.notifs[k]}</span>`:""}</button>`;
 return `<div class="home"><div class="wid"><div class="row"><div style="font-size:40px">${S.av}</div><div style="flex:1"><b>@${esc(S.name)}${S.verified?" ✅":""}</b><div class="mut" style="color:#ddd">${fmt(fm)} followers au total</div></div><div style="text-align:right"><div class="big">${eur(S.money)}</div></div></div></div>
 <div class="apps">${["streamo","snapo","toktok","insta","disko","sonify","mode","market","promo","bank","shop","stats","panel"].map(ap).join("")}</div>
 <div class="wid" style="margin-top:18px"><b>🔥 Tendance du jour : ${S.trend}</b><div class="mut" style="color:#ddd">Poste sur TokTok avec la tendance = ×3 vues</div></div>
 <button class="wid" id="sleepB" style="width:100%;text-align:left"><b>😴 Dormir → jour ${S.day+1}</b><div class="mut" style="color:#ddd">Envoie tes snaps avant, sinon tu perds tes flammes 🔥</div></button></div>
 <div class="dock">${["phone","msg","snapo","settings"].map(ap).join("")}</div>`}
function shell(k,body){const a=APPS[k];return `<div class="appv"><div class="ah" style="background:${k==="snapo"?"#fde047;color:#000":"#0e0e14"}"><button class="bk" id="bk">‹</button><span>${a.ic} ${a.n}</span></div><div class="ab">${body}</div></div>`}
function open(k,re){if(k==="disko"||OPEN==="disko")syncDisko();OPEN=k;S.notifs[k]=0;const el=document.createElement("div");el.id="appwrap";document.querySelectorAll("#appwrap").forEach(e=>e.remove());el.innerHTML=shell(k,VIEWS[k]());$("#scr").appendChild(el);$("#bk").onclick=goHome;(BIND[k]||(()=>{}))();save();sbar()}
function goHome(){if(OPEN==="disko")syncDisko();OPEN=null;document.querySelectorAll("#appwrap").forEach(e=>e.remove());render()}
$("#hb").onclick=goHome;
/* Démarrage */
const AVS=["😎","🦊","🐼","👽","🥷","🐸","💀","🤖","🐺","👑"];

/* ---------- STREAMO (live) ---------- */
const VIEWS={},BIND={};
VIEWS.streamo=()=>`<div class="card" style="text-align:center"><div style="font-size:44px">${S.av}</div><b>${esc(S.name)}</b><div class="mut">${fmt(S.f.streamo)} followers · ${fmt(S.subs)} abonnés 💜 · ${S.lives} lives</div></div>
 <div class="card"><b>🎮 Choisis ton jeu</b><div class="chips" id="gm">${GAMES.map((g,i)=>`<button class="chip ${i?"":"on"}" data-g="${i}">${g[1]} ${g[0]}</button>`).join("")}</div><button class="btn full" id="golive" style="background:#e11d48;padding:14px">🔴 PASSER EN LIVE (25 % batterie, 2 h)</button></div>
 <div class="mut">Record : ${fmt(S.bestV)} viewers. Les abonnés 💜 te rapportent de l'argent chaque nuit.</div>`;
BIND.streamo=()=>{let g=0;document.querySelectorAll("#gm .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#gm .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");g=+b.dataset.g});$("#golive").onclick=()=>{if(!useBat(25,2))return;goLive(g)}};
function goLive(gi){S.lives++;const G=GAMES[gi];const fm=fame();let v=Math.max(2,Math.round(S.f.streamo*rnd(.04,.09)+fm*.01+ri(1,6)+gear()*3)),hype=55,t=45,subs=0,money=0,newF=0,T;
 const el=document.createElement("div");el.className="live";el.id="live";el.innerHTML=`<div class="game"><span class="lv">LIVE</span><span class="vw">👁️ <b id="lvv">${v}</b> · ⏱️ <b id="lvt">${t}</b>s</span>${G[1]}<div style="position:absolute;bottom:8px;left:10px;right:10px"><div style="height:8px;background:#ffffff22;border-radius:6px;overflow:hidden"><i id="lvh" style="display:block;height:100%;width:55%;background:linear-gradient(90deg,#a78bfa,#f472b6)"></i></div><div class="mut" style="margin-top:3px;color:#ddd">Ambiance — garde le chat chaud !</div></div></div>
 <div class="chat" id="lch"></div><div class="lacts"><button data-l="talk">💬 Parler au chat</button><button data-l="play">🎮 Action de fou</button><button data-l="def">🎯 Défi du chat</button><button data-l="give">🎁 Giveaway</button><button data-l="end" style="grid-column:span 2;background:#3a0d18;border-color:#e11d48">⏹️ Arrêter le live</button></div>`;
 P().appendChild(el);
 const chat=(h,cls="")=>{const c=$("#lch");if(!c)return;const d=document.createElement("div");d.className=cls;d.innerHTML=h;c.appendChild(d);while(c.children.length>12)c.firstChild.remove()};
 const upd=()=>{$("#lvv").textContent=fmt(v);$("#lvt").textContent=t;$("#lvh").style.width=hype+"%"};
 el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const a=b.dataset.l;if(a==="end"){end();return}b.disabled=true;setTimeout(()=>b.disabled=false,a==="give"?15000:2500);
  const q=1+gear()*.12;if(a==="talk"){hype=clamp(hype+10*q,0,100);chat(`<b style="color:#a78bfa">${esc(S.name)}</b> : Wesh le chat, ça va ?`)}
  if(a==="play"){if(Math.random()<.65+gear()*.03){hype=clamp(hype+18*q,0,100);chat("💥 <b>CLIP CLIP CLIP</b>");v+=ri(2,8)}else{hype=clamp(hype-6,0,100);chat("😬 raté mdrrr")}}
  if(a==="def"){hype=clamp(hype+14*q,0,100);chat(`🎯 Défi de ${user()} : ${pick(["jouer sans regarder","faire un cri","chanter 10 s","danser en live"])} ✅`)}
  if(a==="give"){if(!pay(50))return;hype=clamp(hype+25,0,100);v=Math.round(v*1.25+5);chat("🎁 <b>GIVEAWAY</b> lancé ! Tout le monde reste !")}upd()});
 T=setInterval(()=>{t--;hype=clamp(hype-rnd(2,4),0,100);const g=(hype-40)/100;v=Math.max(1,Math.round(v*(1+g*.1)+(hype>60?ri(0,2+gear()):0)));
  if(Math.random()<.75)chat(`<b style="color:${pick(["#60a5fa","#f472b6","#34d399","#fbbf24","#f87171"])}">${user()}</b> : ${esc(pick(CHAT))}`);
  if(Math.random()<.06+hype/500+v/3000){subs++;money+=5;chat(`💜 <b>${user()}</b> s'est abonné !`,"sub")}
  if(Math.random()<.05+v/5000){const b=ri(1,20)*(1+Math.floor(v/300));money+=b;chat(`💎 <b>${user()}</b> a envoyé ${b} € !`,"sub")}
  if(Math.random()<.07){const u=user();const id="tr"+Date.now();chat(`<b>${u}</b> : ${esc(pick(TROLL))}<button id="${id}">🔨 Ban</button>`,"troll");setTimeout(()=>{const x=$("#"+id);if(x)x.onclick=()=>{x.parentElement.innerHTML=`🔨 <i>${u} a été banni</i>`;hype=clamp(hype+5,0,100)}},10)}
  if(hype<10&&Math.random()<.3)chat("<i>…des viewers s'en vont</i>","troll");
  newF+=Math.max(0,Math.round(v*.02*(hype/60)));upd();if(t<=0)end()},1000);
 const end=()=>{clearInterval(T);const raid=v>30&&Math.random()<.4;const rv=raid?ri(10,Math.max(12,Math.round(v*.8))):0;
  newF+=Math.round(v*.12*(hype/60))+rv;S.f.streamo+=newF;S.subs+=subs;S.money+=money;S.bestV=Math.max(S.bestV,v);log(`🔴 Live : ${v} viewers, +${fmt(newF)} followers, +${subs} 💜, +${eur(money)}`);
  el.remove();popup(`<div class="bigi">🔴</div><h3>Live terminé !</h3><div class="mut">Pic à ${fmt(v)} viewers${raid?` · ⚡ Raid de ${rv} viewers !`:""}</div><div style="font-size:22px;font-weight:900;margin:10px 0">+${fmt(newF)} followers · +${subs} 💜 · +${eur(money)}</div>${okB()}`);checkV();open("streamo",true)}}

 ${S.flames.map((f,i)=>`<div class="it"><div class="av">${f.ic}</div><div class="inf"><b>${f.n}</b><small class="mut">${f.sent?"✅ Snap envoyé aujourd'hui":"⏳ À envoyer"}</small></div><span class="flame">${f.fl} 🔥</span>${f.sent?"":`<button class="btn" data-s="${i}" style="padding:8px 12px;background:#facc15;color:#000">📸</button>`}</div>`).join("")}

 <div class="card" style="margin-top:10px"><b>👻 Ta story</b><div class="mut">${fmt(S.f.snapo)} amis · tes stories font grimper ta popularité</div><button class="btn full" id="story" style="margin-top:8px;background:#facc15;color:#000">➕ Poster une story (10 %)</button></div>`;

VIEWS.toktok=()=>`<div class="card" style="text-align:center"><b>@${esc(S.name)}${S.verified?" ✅":""}</b><div class="mut">${fmt(S.f.toktok)} abonnés</div></div>
 <div class="card"><b>🎬 Nouvelle vidéo</b><div class="chips" id="tt">${["Danse 💃","Humour 😂","Gaming 🎮","Storytime 🗣️","Défi 🏆"].map((x,i)=>`<button class="chip ${i?"":"on"}" data-i="${i}">${x}</button>`).join("")}</div>

 <div class="grid3">${S.tok.map(v=>`<div style="background:${v.col}"><span>${v.ic}</span><small>▶ ${fmt(v.v)}${v.vir?" 🚀":""}</small></div>`).join("")}</div>`;
BIND.toktok=()=>{let ty=0;document.querySelectorAll("#tt .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tt .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");ty=+b.dataset.i});
 $("#film").onclick=()=>{const tr=$("#usetr").checked;if(!useBat(15,1))return;tapGame("🎥 Tournage","Tape vite pour une vidéo de fou !",sc=>{
  const q=clamp(sc*60+gear()*4+rnd(0,25),1,100);const vir=A().viral||Math.random()<(q-50)/180*(tr?1.6:1);
  const v=Math.round((S.f.toktok*rnd(.5,1.5)+ri(50,300))*(q/55)**2*(tr?3:1)*(vir?rnd(6,20):1));const g=Math.round(v*rnd(.01,.02));S.f.toktok+=g;
  const ics=["💃","😂","🎮","🗣️","🏆"],cols=["#4c1d95","#78350f","#1e3a8a","#134e4a","#7c2d12"];S.tok.unshift({ic:ics[ty],col:cols[ty],v,vir});S.tok=S.tok.slice(0,30);
  log(`🎵 Vidéo TokTok : ${fmt(v)} vues${vir?" (VIRALE)":""}`);popup(`<div class="bigi">${vir?"🚀":"🎵"}</div><h3>${vir?"TA VIDÉO EST VIRALE !":"Vidéo en ligne"}</h3><div style="font-size:26px;font-weight:900;margin:8px 0">👁️ ${fmt(v)} vues</div><div class="mut">+${fmt(g)} abonnés</div>${okB()}`);checkV();open("toktok",true)})}};
function tapGame(title,sub,cb){if(A().autoWin){cb(1);return}let n=0,t0=0,T,done=false;const goal=14;
 popup(`<h3>${title}</h3><div class="mut">${sub}</div><div style="font-size:44px;font-weight:900;margin:8px 0" id="tpn">0</div><div class="mut" id="tpt">Appuie pour commencer (3 s)</div><button id="tbt" style="width:100%;padding:32px;border-radius:18px;margin-top:10px;font-size:22px;font-weight:900;background:linear-gradient(135deg,#fe2c55,#7c3aed);touch-action:manipulation">👆 TAPE !</button>`,false);
 const fin=()=>{if(done)return;done=true;clearInterval(T);setTimeout(()=>{closePop();cb(Math.min(1,n/goal))},350)};
 $("#tbt").onpointerdown=e=>{e.preventDefault();if(done)return;if(!t0){t0=performance.now();T=setInterval(()=>{const l=3-(performance.now()-t0)/1000;$("#tpt").textContent=Math.max(0,l).toFixed(1)+" s";if(l<=0)fin()},100)}n++;$("#tpn").textContent=n;if(n>=goal)fin()}}

 <div class="mut">Acheter = 25 % de ton argent · Vendre = tout vendre</div>`};

 document.querySelectorAll("[data-sl]").forEach(b=>b.onclick=()=>{const k=b.dataset.sl,q=S.port[k];if(!q){toast("Tu n'en as pas");return}const g=q*S.px[k];S.money+=g;S.port[k]=0;toast(`💶 Vendu : +${eur(g)}`);log(`📈 Vente ${k} : +${eur(g)}`);open("market",true)})};
/* ---- Banque : argent de tes autres jeux ---- */
const GAMES_W=[["rapempire1","🎤","RAP EMPIRE"],["viral1","📱","VIRAL"],["gangcity1","🌆","GANG CITY"],["vie1","👶","DE ZÉRO À MILLIARDAIRE"],["footlegende1","⚽","FOOT LÉGENDE"]];
const _vb=VIEWS.bank;VIEWS.bank=()=>{const rows=GAMES_W.map(([k,ic,n])=>{let m=0;try{const d=JSON.parse(localStorage.getItem(k)||"null");m=d&&d.money>0?d.money:0}catch(e){}return [k,ic,n,m]});
 return _vb()+`<div class="card"><b>🔗 Argent de tes autres jeux</b><div class="mut">Transfère l'argent gagné dans tes jeux vers ton téléphone.</div>${rows.map(r=>`<div class="it" style="margin-top:8px"><div class="av">${r[1]}</div><div class="inf"><b>${r[2]}</b><small class="mut">${r[3]?eur(r[3]):"Pas de partie / 0 €"}</small></div>${r[3]>=1?`<button class="btn" data-tr="${r[0]}" style="padding:8px 10px">Transférer</button>`:""}</div>`).join("")}</div>`};
const _bb=BIND.bank||(()=>{});BIND.bank=()=>{_bb();document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{try{const k=b.dataset.tr;const d=JSON.parse(localStorage.getItem(k));const m=Math.floor(d.money);d.money=0;localStorage.setItem(k,JSON.stringify(d));S.money+=m;log(`🔗 Transfert depuis ${k} : +${eur(m)}`);toast(`💸 +${eur(m)} sur ton téléphone`);open("bank",true)}catch(e){toast("Erreur de transfert")}})};
/* ---- Réglages : code ---- */
const _vst=VIEWS.settings;VIEWS.settings=()=>`<div class="it" id="pinB" style="cursor:pointer"><div class="av">🔐</div><div class="inf"><b>Code de verrouillage</b><small class="mut">${S.pin?"Activé · touche pour retirer":"Aucun · touche pour en créer un"}</small></div>›</div><div class="it" id="lkB" style="cursor:pointer"><div class="av">🔒</div><div class="inf"><b>Verrouiller maintenant</b></div>›</div>`+_vst();
const _bst=BIND.settings;BIND.settings=()=>{_bst();$("#lkB").onclick=()=>{goHome();lockNow()};$("#pinB").onclick=()=>{if(S.pin){S.pin=null;toast("🔓 Code retiré");open("settings",true);return}const c=prompt("Choisis un code à 4 chiffres :","");if(c&&/^\d{4}$/.test(c)){S.pin=c;toast("🔐 Code enregistré");open("settings",true)}else if(c)toast("Il faut 4 chiffres")}};
/* ---- Panel : en plus ---- */
const _ab=adminBody;adminBody=()=>_ab().replace(/<\/div>$/,"")+`<h3>📞 Appels & verrouillage</h3><div class="chips"><button class="chip" id="cu">📞 Appel numéro inconnu</button><button class="chip" id="cm">📞 Appel de maman</button><button class="chip" id="cb">📞 Appel d'une marque</button><button class="chip" id="np">🔓 Retirer le code</button></div>
 <h3>📈 Bourse & musique</h3><div class="chips">${(()=>{const a=A();return `<button class="chip ${a.boom?"on":""}" data-tg="boom">${a.boom?"✅":"⬜"} Bourse qui monte toujours</button>`})()}<button class="chip" id="crash">📉 Krach</button><button class="chip" id="items">👕 Tout le shopping</button></div></div>`;
const _bA=bindAdmin;bindAdmin=(re,inPop)=>{_bA(re,inPop);const on=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f};
 on("cu",()=>{closePop();goHome();incomingCall("unk")});on("cm",()=>{closePop();goHome();incomingCall("maman")});on("cb",()=>{closePop();goHome();incomingCall("brand")});on("np",()=>{S.pin=null;re("🔓 Code retiré")});
 on("crash",()=>{ASSETS.forEach(a=>S.px[a[0]]=+(S.px[a[0]]*.4).toFixed(2));re("📉 Krach !")});on("items",()=>{ITEMS.forEach((x,i)=>{if(!S.items.includes(i)){S.items.push(i);S.style+=x[3]}});re("👕 Tout acheté")})};
/* appels aléatoires */
setInterval(()=>{if(!S.name||LOCKED||$("#ov")||$("#live")||$("#call"))return;if(Math.random()<.35)incomingCall(pick(["maman","kenzo","brand","unk","unk"]))},70000);

/* ================= TÉLÉPHONES, FONDS, ICÔNES, PROMO ================= */
for(const [k,v] of Object.entries({ph:0,phones:[0],wall:0,walls:[0],ipack:0,ipacks:[0],promos:[]}))if(S[k]==null)S[k]=v;
const PHONES=[{n:"Vieux tel fissuré",ic:"📱",c:0,bat:1,cam:0,fr:"#1d1d24",d:"Batterie normale"},{n:"Zphone 12",ic:"📱",c:400,bat:1.25,cam:1,fr:"#9ca3af",d:"Batterie +25 % · photo +15 %"},{n:"Galaxo S",ic:"📲",c:1800,bat:1.5,cam:2,fr:"#1e3a8a",d:"Batterie +50 % · photo +30 %"},{n:"Pixo Pro",ic:"📸",c:6000,bat:1.7,cam:4,fr:"#e5e7eb",d:"Caméra de fou · photo +60 %"},{n:"Zphone Ultra Titane",ic:"🔱",c:25000,bat:2.2,cam:5,fr:"#a8a29e",d:"Batterie ×2,2 · photo +75 %"},{n:"Zphone Gold Édition",ic:"👑",c:300000,bat:3,cam:7,fr:"#facc15",d:"En or. Batterie ×3 · photo +105 %"}];
const WALLS=[{n:"Violet néon",c:0,bg:"radial-gradient(120% 80% at 20% 0%,#6d28d9 0,transparent 55%),radial-gradient(100% 70% at 100% 100%,#db2777 0,transparent 55%),#0f0a1f"},
 {n:"Coucher de soleil",c:80,bg:"linear-gradient(180deg,#f97316,#db2777 45%,#312e81)"},{n:"Océan",c:80,bg:"linear-gradient(180deg,#0ea5e9,#1e3a8a 60%,#020617)"},
 {n:"Galaxie",c:250,bg:"radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 60%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#fff,transparent),radial-gradient(1px 1px at 85% 15%,#fff,transparent),radial-gradient(80% 60% at 30% 40%,#7c3aed88,transparent),radial-gradient(60% 50% at 80% 70%,#0ea5e988,transparent),#030014"},
 {n:"Anime nuit",c:400,bg:"radial-gradient(circle at 75% 18%,#fde68a 0 6%,transparent 6.5%),linear-gradient(180deg,#1e1b4b,#7f1d1d 75%,#111)"},
 {n:"Matrix",c:600,bg:"repeating-linear-gradient(90deg,#052e16 0 14px,#064e3b 14px 16px),linear-gradient(#000,#022c22)"},
 {n:"Noir & rouge",c:900,bg:"radial-gradient(90% 60% at 50% 110%,#dc2626,transparent 60%),#050505"},
 {n:"Or massif",c:15000,bg:"linear-gradient(135deg,#78350f,#facc15 40%,#fef3c7 50%,#ca8a04 60%,#451a03)"}];
const IPACKS=[{n:"Classique",c:0,css:""},{n:"Néon",c:300,css:"#phone.ip1 .app .ic{box-shadow:0 0 14px #a855f7,0 0 2px #fff inset;border:2px solid #e9d5ff}"},{n:"Ronds",c:200,css:"#phone.ip2 .app .ic{border-radius:50%}"},{n:"Noir & blanc",c:500,css:"#phone.ip3 .app .ic{filter:grayscale(1) contrast(1.2)}"},{n:"Doré",c:8000,css:"#phone.ip4 .app .ic{background:linear-gradient(135deg,#78350f,#facc15,#fef3c7,#ca8a04)!important;box-shadow:0 0 12px #facc1588}"}];
(()=>{const st=document.createElement("style");st.textContent=IPACKS.map(x=>x.css).join("\n");document.head.appendChild(st)})();
function applyLook(){const w=document.querySelector(".wall");if(w)w.style.background=WALLS[S.wall].bg;const ph=P();ph.className=S.ipack?"ip"+S.ipack:"";ph.style.borderColor=PHONES[S.ph].fr}
const _ub=useBat;useBat=(n,h)=>_ub(Math.max(1,Math.round(n/PHONES[S.ph].bat)),h);
/* Shopping avec onglets */
let MT="ph";
VIEWS.mode=()=>{const tabs=[["ph","📱 Téléphones"],["wl","🖼️ Fonds"],["ip","🎨 Icônes"],["cl","👕 Style"]];
 const row=(own,eq,ic,n,d,c,attr)=>`<div class="it"><div class="av">${ic}</div><div class="inf"><b>${n}${eq?'<span class="tag">✔ utilisé</span>':own?'<span class="tag">à toi</span>':""}</b><small class="mut">${d}</small></div>${eq?"":own?`<button class="btn" ${attr} style="padding:8px 10px">Utiliser</button>`:`<button class="btn" ${attr} style="background:#be185d;padding:8px 10px">${c?eur(c):"Gratuit"}</button>`}</div>`;
 let body="";
 if(MT==="ph")body=`<div class="card"><b>📱 Ton téléphone : ${PHONES[S.ph].ic} ${PHONES[S.ph].n}</b><div class="mut">Un meilleur téléphone = plus de batterie et de plus belles photos.</div></div>`+PHONES.map((x,i)=>row(S.phones.includes(i),S.ph===i,`<span style="display:inline-block;width:22px;height:36px;border-radius:6px;border:3px solid ${x.fr};background:#111"></span>`,`${x.ic} ${x.n}`,x.d,x.c,`data-ph="${i}"`)).join("");
 if(MT==="wl")body=WALLS.map((x,i)=>`<div class="it"><div style="width:44px;height:70px;border-radius:9px;background:${x.bg};flex:none;border:2px solid #333"></div><div class="inf"><b>${x.n}${S.wall===i?'<span class="tag">✔ utilisé</span>':S.walls.includes(i)?'<span class="tag">à toi</span>':""}</b></div>${S.wall===i?"":S.walls.includes(i)?`<button class="btn" data-wl="${i}" style="padding:8px 10px">Utiliser</button>`:`<button class="btn" data-wl="${i}" style="background:#be185d;padding:8px 10px">${x.c?eur(x.c):"Gratuit"}</button>`}</div>`).join("");
 if(MT==="ip")body=IPACKS.map((x,i)=>row(S.ipacks.includes(i),S.ipack===i,`<span style="font-size:20px">${["📺","💜","⚪","⚫","🟡"][i]}</span>`,`Pack « ${x.n} »`,"Change le look de toutes les icônes",x.c,`data-ip="${i}"`)).join("");
 if(MT==="cl")body=`<div class="card"><b>✨ Ton style : ${S.style}</b><div class="mut">+${S.style+PHONES[S.ph].cam*15} % de likes sur Instaflo (vêtements + téléphone)</div></div>`+ITEMS.map((x,i)=>`<div class="it"><div class="av">${x[0]}</div><div class="inf"><b>${x[1]}${S.items.includes(i)?'<span class="tag">✔ à toi</span>':""}</b><small class="mut">+${x[3]} style</small></div>${S.items.includes(i)?"":`<button class="btn" data-it="${i}" style="background:#be185d;padding:8px 10px">${eur(x[2])}</button>`}</div>`).join("");
 return `<div class="chips">${tabs.map(t=>`<button class="chip ${MT===t[0]?"on":""}" data-mt="${t[0]}">${t[1]}</button>`).join("")}</div>${body}`};
BIND.mode=()=>{document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{MT=b.dataset.mt;open("mode",true)});
 const buy=(own,list,i,cost,set,msg)=>{if(!S[list].includes(i)){if(!pay(cost))return;S[list].push(i)}S[set]=i;applyLook();toast(msg);open("mode",true)};
 document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ph;buy(0,"phones",i,PHONES[i].c,"ph",`${PHONES[i].ic} ${PHONES[i].n} activé !`)});
 document.querySelectorAll("[data-wl]").forEach(b=>b.onclick=()=>{const i=+b.dataset.wl;buy(0,"walls",i,WALLS[i].c,"wall","🖼️ Fond d'écran changé")});
 document.querySelectorAll("[data-ip]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ip;buy(0,"ipacks",i,IPACKS[i].c,"ipack","🎨 Icônes changées")});
 document.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{const i=+b.dataset.it,x=ITEMS[i];if(!pay(x[2]))return;S.items.push(i);S.style+=x[3];toast(`${x[0]} ${x[1]} acheté !`);open("mode",true)})};
/* Promo : payer des gens pour te faire de la pub */
const PROMOS=[{n:"@petit.créateur",ic:"🙂",f:2000,c:60,dur:20,g:[1,4],pl:["toktok","insta"]},{n:"@lina.vlog",ic:"📸",f:25000,c:400,dur:30,g:[4,12],pl:["insta","snapo"]},{n:"@kuro.gaming",ic:"🎮",f:120000,c:2500,dur:35,g:[12,35],pl:["streamo","disko"]},{n:"@mega.ryan",ic:"🦁",f:2e6,c:30000,dur:45,g:[80,220],pl:["toktok","streamo","insta"]},{n:"@lou.trend",ic:"✨",f:15e6,c:250000,dur:60,g:[500,1500],pl:["toktok","insta","snapo","streamo"]}];
const PLN={toktok:"TokTok",insta:"Instaflo",snapo:"Snapo",streamo:"Streamo",disko:"Disko"};
VIEWS.promo=()=>{const act=S.promos.filter(x=>x.until>Date.now());return `<div class="card" style="background:linear-gradient(135deg,#7c2d12,#0e0e14)"><b>📣 Paie des créateurs pour qu'ils parlent de toi</b><div class="mut" style="color:#ddd">Pendant la pub, tu gagnes des abonnés en direct.${act.length?` <b style="color:#86efac">${act.length} pub(s) en cours</b>`:""}</div></div>
 ${act.map(x=>`<div class="it" style="border-color:#16a34a"><div class="av">${x.ic}</div><div class="inf"><b>${x.n} parle de toi 🔴</b><small class="mut">encore ${Math.ceil((x.until-Date.now())/1000)} s · +${fmt(x.got)} abonnés</small></div></div>`).join("")}
 ${PROMOS.map((x,i)=>{const c=Math.round(x.c*(1+fame()/200000));return `<div class="it"><div class="av">${x.ic}</div><div class="inf"><b>${x.n} <span class="tag">${fmt(x.f)} abonnés</span></b><small class="mut">${x.pl.map(p=>PLN[p]).join(", ")} · ${x.dur} s</small></div><button class="btn" data-pr="${i}" style="background:#ea580c;padding:8px 10px">${eur(c)}</button></div>`}).join("")}`};
BIND.promo=()=>document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{const x=PROMOS[+b.dataset.pr];const c=Math.round(x.c*(1+fame()/200000));if(!pay(c))return;S.promos.push({n:x.n,ic:x.ic,until:Date.now()+x.dur*1000,g:x.g,pl:x.pl,got:0});log(`📣 Pub payée à ${x.n} : ${eur(c)}`);toast(`📣 ${x.n} va parler de toi !`);open("promo",true)});
setInterval(()=>{if(!S.promos||!S.promos.length)return;const now_=Date.now();let any=false;for(const x of S.promos){if(x.until<now_){if(!x.done){x.done=true;if(!$("#ov")&&!LOCKED)popup(`<div class="bigi">${x.ic}</div><h3>Pub de ${x.n} terminée</h3><div class="mut">+${fmt(x.got)} abonnés grâce à elle 📣</div>${okB()}`)}continue}
 any=true;const g=Math.round(rnd(x.g[0],x.g[1])*(1+fame()/50000));const pl=pick(x.pl);if(pl==="disko"){try{const d=JSON.parse(localStorage.getItem("disko1"));if(d&&d.servers&&d.servers.length){d.servers[d.cur||0].members+=g;localStorage.setItem("disko1",JSON.stringify(d))}}catch(e){}}S.f[pl]=(S.f[pl]||0)+g;x.got+=g;
 if(Math.random()<.15)notify(pl==="disko"?"disko":pl,x.n,pick(["a parlé de toi dans sa story 🔥","« allez follow mon pote ! »","a partagé ton profil","t'a mentionné en live"]))}
 S.promos=S.promos.filter(x=>x.until>now_-1000||!x.done);if(any&&OPEN==="promo"&&!$("#ov"))open("promo",true);checkV()},2000);
const _ren=render;render=k=>{_ren(k);applyLook()};
const _ab2=adminBody;adminBody=()=>_ab2().replace(/<\/div>$/,"")+`<h3>📱 Look & pub</h3><div class="chips"><button class="chip" id="allph">📱 Tous les téléphones</button><button class="chip" id="allwl">🖼️ Tous les fonds & icônes</button><button class="chip" id="frpr">📣 Pub de @lou.trend gratuite</button></div></div>`;
const _bA2=bindAdmin;bindAdmin=(re,inPop)=>{_bA2(re,inPop);const on=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f};
 on("allph",()=>{S.phones=PHONES.map((_,i)=>i);S.ph=PHONES.length-1;applyLook();re("👑 Zphone Gold activé")});on("allwl",()=>{S.walls=WALLS.map((_,i)=>i);S.ipacks=IPACKS.map((_,i)=>i);re("🖼️ Tout débloqué")});
 on("frpr",()=>{const x=PROMOS[4];S.promos.push({n:x.n,ic:x.ic,until:Date.now()+x.dur*1000,g:x.g,pl:x.pl,got:0});re("📣 Pub lancée")})};
syncDisko();render();if(S.name&&S.pin)lockNow();
Object.defineProperty(window,"__T",{get:()=>S});window.__saveT=()=>{save();sbar()};
})();
</script>
