/* ---------- Sauvegarde ---------- */
const NEW=()=>({v:1,name:"",av:"🧢",day:1,money:120,fans:20,hype:10,en:100,
 sk:{flow:5,ecr:5,prod:5,scene:5},up:{mic:0,studio:0,coach:0,team:0},

 mood:"",lastEvt:0,trainCount:0,albums:[]});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||NEW()}catch(e){S=NEW()}
S=Object.assign(NEW(),S);

let toastT;
function toast(t){document.querySelectorAll(".toast").forEach(e=>e.remove());const d=document.createElement("div");d.className="toast";d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2200)}
function popup(html,close=true){closePop();const o=document.createElement("div");o.className="ov";o.id="ov";o.innerHTML='<div class="pop">'+html+'</div>';if(close)o.addEventListener("click",e=>{if(e.target===o)closePop()});document.body.appendChild(o);return o}

/* ---------- Audio (beat maker) ---------- */
let AC=null;
const ac=()=>{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC};
function noise(c,dur){const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;return s}
function hit(type,t,note){const c=ac(),g=c.createGain();g.connect(c.destination);
 if(type===0){const o=c.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);o.start(t);o.stop(t+.3)}
 else if(type===1){const n=noise(c,.2),f=c.createBiquadFilter();f.type="highpass";f.frequency.value=1200;n.connect(f);f.connect(g);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);n.start(t);n.stop(t+.2)}
 else if(type===2){const n=noise(c,.05),f=c.createBiquadFilter();f.type="highpass";f.frequency.value=7000;n.connect(f);f.connect(g);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);n.start(t);n.stop(t+.06)}
 else{const o=c.createOscillator();o.type="sine";const fr=[55,49,65.4,73.4][note||0];o.frequency.setValueAtTime(fr*1.5,t);o.frequency.exponentialRampToValueAtTime(fr,t+.06);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(g);o.start(t);o.stop(t+.6)}}
let seqTimer=null,seqStep=0;
function stopSeq(){if(seqTimer){clearInterval(seqTimer);seqTimer=null}document.querySelectorAll(".seq .pl").forEach(e=>e.classList.remove("pl"))}
function playSeq(grid,bpm,onStep){stopSeq();seqStep=0;const iv=60/bpm/4*1000;
 seqTimer=setInterval(()=>{const c=ac(),t=c.currentTime+.02;for(let r=0;r<4;r++)if(grid[r][seqStep])hit(r,t,(seqStep>>2)%4);onStep&&onStep(seqStep);seqStep=(seqStep+1)%16},iv)}
function beatScore(g,bpm){let n=0,rows=0;for(const r of g){const c=r.filter(Boolean).length;n+=c;if(c)rows++}
 let s=rows*12; s+=Math.min(n,26)*1.4; if(g[0][0])s+=6; if(g[1][4]||g[1][12])s+=8; if(g[2].filter(Boolean).length>=6)s+=6; if(n>40)s-=15; if(bpm<60||bpm>170)s-=8;
 return clamp(Math.round(s*.65+S.sk.prod*.6),5,100)}

/* ---------- Mini-jeux ---------- */
function timingGame({title,sub,rounds=5,speed=1,zone=.22,onEnd}){
 let r=0,score=0,perfect=0,pos=0,dir=1,raf,last=performance.now(),z=0,zw=zone;
 const o=popup(`<h2>${title}</h2><div class="mut">${sub}</div><div class="tbar" id="tb"><div class="z" id="tz"></div><div class="z p" id="tp"></div><div class="k" id="tk"></div></div><div id="tr" class="mut">Tape quand la barre est dans le vert — doré = parfait</div><button class="btn" id="tbt" style="width:100%;margin-top:10px;padding:18px">🎤 MAINTENANT</button>`,false);
 const place=()=>{zw=Math.max(.08,zone-r*.015);z=rnd(.05,.95-zw);$("#tz").style.left=z*100+"%";$("#tz").style.width=zw*100+"%";$("#tp").style.left=(z+zw*.35)*100+"%";$("#tp").style.width=zw*.3*100+"%"};
 place();
 const loop=t=>{const dt=(t-last)/1000;last=t;pos+=dir*dt*(.75+r*.12)*speed;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}const k=$("#tk");if(k)k.style.left=pos*100+"%";raf=requestAnimationFrame(loop)};
 raf=requestAnimationFrame(loop);
 $("#tbt").onclick=()=>{const inZ=pos>=z&&pos<=z+zw,pf=pos>=z+zw*.35&&pos<=z+zw*.65;
  if(pf){score+=1;perfect++;$("#tr").innerHTML="🔥 PARFAIT"}else if(inZ){score+=.65;$("#tr").innerHTML="✅ Propre"}else{$("#tr").innerHTML="❌ Raté"}
  r++;if(r>=rounds){cancelAnimationFrame(raf);setTimeout(()=>{closePop();onEnd(score/rounds,perfect)},350)}else place()};
}
function rhymeGame(onEnd){
 const R=pick(RHYMES);let found=0,bad=0,left=12;
 const words=[...[...R.ok].sort(()=>Math.random()-.5).slice(0,6),...[...R.ko].sort(()=>Math.random()-.5).slice(0,6)].sort(()=>Math.random()-.5);
 popup(`<h2>✍️ Écris ton couplet</h2><div class="mut">Touche tous les mots qui riment en <b style="color:var(--gold)">${R.e}</b></div><div style="font-size:28px;font-weight:900;margin-top:6px" id="rt">${left}s</div><div class="words">${words.map((w,i)=>`<button data-i="${i}">${esc(w)}</button>`).join("")}</div>`,false);

  $("#dcancel").onclick=()=>{S.draft=null;render()};
 }else{
  let bs=null,ts=null;
  document.querySelectorAll("#bsel .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#bsel .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");bs=+b.dataset.b});
  document.querySelectorAll("#tsel .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tsel .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");ts=+b.dataset.t});
  $("#dnew").onclick=()=>{if(bs==null){toast("Choisis un beat gardé");return}if(ts==null){toast("Choisis un thème");return}
   const th=THEMES[ts],b=S.beats[bs];let t=pick(TITLES[th[0]]);if(S.songs.some(s=>s.t===t))t+=" "+pick(["II","(Remix)","Part. 2","Freestyle","Intro","Outro"]);
   S.draft={t,th:th[0],ic:th[1],col:th[2],beat:b.q,lyr:null};render()};
 }
}

/* Mes sons */
function sonsHTML(){const un=S.songs.filter(s=>!s.released),re=S.songs.filter(s=>s.released);
 return `<div class="card"><h2>💿 Prêts à sortir</h2>${un.length?un.map(s=>songRow(s,true)).join(""):`<div class="mut">Aucun son en attente. Va au 🎹 Studio.</div>`}</div>
 <div class="card"><h2>🎧 Sortis (${re.length})</h2><div class="mut" style="margin-bottom:8px">Total : ${fmt(S.stats.streams)} streams · ${S.gold} certifs</div>${re.length?re.map(s=>songRow(s,false)).join(""):`<div class="mut">Rien de sorti pour l'instant.</div>`}</div>
 ${re.length>=6?`<div class="card"><h2>📀 Album</h2><div class="mut">Regroupe 6 sons sortis en album : gros boost de streams sur tous.</div><button class="btn g" id="album" style="width:100%;margin-top:8px">📀 Sortir un album (${eur(albumCost())}, 40⚡)</button></div>`:""}`}
const albumCost=()=>Math.round(2000+S.fans*.05);
function songRow(s,un){const i=S.songs.indexOf(s);
 return `<div class="song"><div class="cov" style="background:${s.col}">${s.ic}</div><div class="inf"><b>${esc(s.t)}${s.hit?'<span class="tag">HIT</span>':""}${(s.cert||[]).map(c=>`<span class="tag">💿 ${c}</span>`).join("")}${s.clip?'<span class="tag">🎬</span>':""}</b><small class="mut">${s.th} · <span class="q">${s.q}/100</span>${un?"":` · ${fmt(s.streams)} streams · ${fmt(s.daily)}/j`}</small></div>
 ${un?`<button class="btn g" data-rel="${i}" style="padding:8px 10px;font-size:13px">🚀 Sortir</button>`:(!s.clip?`<button class="btn s" data-clip="${i}" style="padding:8px 10px;font-size:12px">🎬 Clip</button>`:"")}</div>`}
const clipCost=s=>Math.round(300+S.fans*.03+s.q*20);
function bindSons(){
 document.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>{const s=S.songs[+b.dataset.rel];
  popup(`<div class="big">${s.ic}</div><h2>Sortir "${esc(s.t)}"</h2><div class="mut">Choisis ta promo</div><div class="punch">
   <button data-pr="0">🆓 Sortie simple — gratuit</button><button data-pr="1">📣 Promo réseaux — ${eur(150+S.fans*.01)}</button><button data-pr="2">🎵 Playlist officielle — ${eur(1000+S.fans*.04)}</button></div>`);
  document.querySelectorAll("[data-pr]").forEach(x=>x.onclick=()=>{const pr=+x.dataset.pr;const cost=[0,Math.round(150+S.fans*.01),Math.round(1000+S.fans*.04)][pr];if(!pay(cost))return;closePop();release(s,[1,1.6,2.6][pr])})});
 document.querySelectorAll("[data-clip]").forEach(b=>b.onclick=()=>{const s=S.songs[+b.dataset.clip];const c=clipCost(s);
  popup(`<div class="big">🎬</div><h2>Clip pour "${esc(s.t)}"</h2><div class="mut">Un clip relance le son et ramène des fans.</div><button class="btn g" id="dc" style="width:100%;margin-top:12px">Tourner le clip — ${eur(c)} · 30⚡</button>`);
  $("#dc").onclick=()=>{if(S.en<30){toast("😴 Pas assez d'énergie");return}if(!pay(c))return;S.en-=30;closePop();s.clip=true;s.daily=Math.round(s.daily*1.8+S.fans*.5);const f=Math.round(S.fans*.04*(s.q/70)+30);S.fans+=f;S.hype=clamp(S.hype+15,0,100);log(`🎬 Clip "${s.t}" (+${fmt(f)} fans)`);toast(`🎬 Clip en ligne · +${fmt(f)} fans`);render()}});
 const al=$("#album");if(al)al.onclick=()=>{if(S.en<40){toast("😴 Pas assez d'énergie");return}if(!pay(albumCost()))return;S.en-=40;const re=S.songs.filter(s=>s.released);for(const s of re.slice(0,6))s.daily=Math.round(s.daily*2+S.fans*.4);const avg=re.slice(0,6).reduce((a,s)=>a+s.q,0)/6;const f=Math.round(S.fans*(.08+avg/600));S.fans+=f;S.hype=clamp(S.hype+30,0,100);S.albums.push(S.day);
  log(`📀 Album n°${S.albums.length} (+${fmt(f)} fans)`);popup(`<div class="big">📀</div><h2>ALBUM N°${S.albums.length} DISPO</h2><div class="mut">Note moyenne ${Math.round(avg)}/100 · +${fmt(f)} fans · hype au max</div><button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:12px">🔥</button>`);render()};
}
function release(s,mul){s.released=true;s.rday=S.day;
 const base=(S.fans*1.2+300)*(s.q/60)**2.2*mul*(.6+S.hype/100*.8);
 const hit=(S.adm&&S.adm.hit)||s.q>=78&&Math.random()<(s.q-70)/60*mul*.6;
 s.hit=hit;s.daily=Math.round(base*(hit?4:1));
 const f=Math.round((S.fans*.03+20)*(s.q/60)*mul*(hit?3:1));S.fans+=f;S.hype=clamp(S.hype+(hit?30:8),0,100);
 S.stats.best=Math.max(S.stats.best,s.q);log(`🚀 Sortie "${s.t}" ${hit?"— HIT !":""} (+${fmt(f)} fans)`);
 popup(`<div class="big">${hit?"💥":"🚀"}</div><h2>${hit?"C'EST UN HIT !":"Son sorti !"}</h2><div class="mut">"${esc(s.t)}" · ~${fmt(s.daily)} streams/jour · +${fmt(f)} fans</div><button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:12px">${hit?"Je suis trop fort":"OK"}</button>`);render()}

/* Scène */
function sceneHTML(){
 return `<div class="card"><h2>🎤 Concerts</h2>${VENUES.map((v,i)=>{const ok=S.fans>=v.fans;return `<div class="song"><div class="cov" style="background:#2a2342">${v.ic}</div><div class="inf"><b>${v.n}</b><small class="mut">${ok?`${fmt(v.cap)} places · ${v.price} €/place · ${v.en}⚡`:`🔒 ${fmt(v.fans)} fans requis`}</small></div>${ok?`<button class="btn" data-v="${i}" style="padding:8px 12px;font-size:13px">Jouer</button>`:""}</div>`}).join("")}</div>
 <div class="card"><h2>⚔️ Clashs</h2><div class="mut" style="margin-bottom:8px">Gagne un clash = tu lui voles des fans. Perds = l'humiliation.</div>${RIVALS.map((r,i)=>{const beat=S.rivalsBeat.includes(i);const ok=S.fans>=r.fans*.05;return `<div class="song"><div class="cov" style="background:#2a1020">${r.ic}</div><div class="inf"><b>${r.n} ${beat?'<span class="tag">✔ battu</span>':""}</b><small class="mut">${fmt(r.fans)} fans · niveau ${r.lvl}</small></div>${ok?`<button class="btn" data-r="${i}" style="padding:8px 12px;font-size:13px">Clasher</button>`:`<span class="mut" style="font-size:11px">🔒 ${fmt(r.fans*.05)} fans</span>`}</div>`}).join("")}<div class="mut" style="margin-top:6px">Bilan : ${S.stats.clashW} victoires · ${S.stats.clashL} défaites</div></div>`}
function bindScene(){
 document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const v=VENUES[+b.dataset.v];if(!S.songs.some(s=>s.released)){toast("Sors au moins un son avant");return}if(!useEn(v.en))return;
  timingGame({title:`${v.ic} ${v.n}`,sub:"Le public attend ton entrée…",rounds:6,speed:1+(+b.dataset.v)*.08,onEnd:(sc,p)=>{
   const fill=clamp(S.fans/(v.cap*6)+.2,.15,1);const crowd=Math.round(v.cap*fill);const money=Math.round(crowd*v.price*(.7+sc*.5));const f=Math.round(crowd*(.05+sc*.25));
   S.money+=money;S.fans+=f;S.hype=clamp(S.hype+sc*12,0,100);S.sk.scene=clamp(S.sk.scene+(1+sc*2)*(1-S.sk.scene/140),0,100);S.stats.concerts++;
   log(`${v.ic} Concert ${v.n} : ${fmt(crowd)} personnes, +${eur(money)}`);
   popup(`<div class="big">${sc>.8?"🤯":sc>.5?"🙌":"😬"}</div><h2>${sc>.8?"Le public est en FEU":sc>.5?"Bon concert":"Concert raté…"}</h2><div class="mut">${fmt(crowd)} personnes · ${p} moments parfaits</div><div style="font-size:24px;font-weight:900;color:var(--gold);margin:8px 0">+${eur(money)} · +${fmt(f)} fans</div><button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%">OK</button>`);render()}})});
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>clash(+b.dataset.r));
}
function clash(i){const r=RIVALS[i];if(!useEn(30))return;
 let me=100,him=100,round=0;
 const draw=(msg)=>{popup(`<h2>⚔️ CLASH</h2><div class="vs"><div>${S.av}</div><div style="font-size:18px;color:var(--mut)">VS</div><div>${r.ic}</div></div>
  <div class="row"><div style="flex:1"><div style="font-size:12px;text-align:left">${esc(S.name)}</div><div class="hp me"><i style="width:${me}%"></i></div></div><div style="width:14px"></div><div style="flex:1"><div style="font-size:12px;text-align:right">${r.n}</div><div class="hp"><i style="width:${him}%"></i></div></div></div>
  <div class="mut" style="margin-top:10px;min-height:36px">${msg}</div><div class="mut">Round ${round+1}/3 — choisis ta punchline</div><div class="punch">${opts.map((p,k)=>`<button data-k="${k}">🎤 ${esc(p)}</button>`).join("")}</div>`,false);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>turn())};
 let opts=[];const newOpts=()=>{opts=[...PUNCH[0],...PUNCH[1]].sort(()=>Math.random()-.5).slice(0,3)};
 const turn=()=>{closePop();timingGame({title:"🎤 Ta punchline",sub:"Le timing fait toute la différence",rounds:3,speed:1+r.lvl*.07,zone:.24-r.lvl*.01,onEnd:sc=>{
   const myPow=(sc*.6+S.sk.flow/250+S.sk.ecr/250)*rnd(.85,1.15);const hisPow=(.28+r.lvl*.075)*rnd(.8,1.2);
   const dmgHim=Math.round(myPow*45),dmgMe=Math.round(hisPow*45);him=Math.max(0,him-dmgHim);me=Math.max(0,me-dmgMe);round++;
   const crowd=dmgHim>dmgMe?"🔥 Le public crie pour toi !":"😮 Il t'a bien répondu…";
   if(round>=3||me<=0||him<=0){end()}else{newOpts();draw(`${crowd} (toi −${dmgMe} · lui −${dmgHim})`)}}})};
 const end=()=>{const win=(S.adm&&S.adm.winClash)||him<me;
  if(win){const f=Math.round(Math.min(r.fans,S.fans*2+r.fans*.02)*.06+50);S.fans+=f;S.hype=clamp(S.hype+25,0,100);S.stats.clashW++;if(!S.rivalsBeat.includes(i))S.rivalsBeat.push(i);S.sk.scene=clamp(S.sk.scene+2,0,100);log(`⚔️ Clash GAGNÉ contre ${r.n} (+${fmt(f)} fans)`);
   popup(`<div class="big">🏆</div><h2>TU L'AS DÉTRUIT</h2><div class="mut">${r.n} est KO · +${fmt(f)} fans · hype +25</div><button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:12px">GG</button>`)}
  else{const f=Math.round(S.fans*.04);S.fans-=f;S.hype=clamp(S.hype-10,0,100);S.stats.clashL++;log(`⚔️ Clash perdu contre ${r.n}`);
   popup(`<div class="big">💀</div><h2>Défaite…</h2><div class="mut">${r.n} t'a eu cette fois · −${fmt(f)} fans. Entraîne ton flow et reviens.</div><button class="btn s" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:12px">Je reviendrai</button>`)}render()};
 newOpts();draw(`${r.n} lâche sa première phase…`);
}

/* ---------- Panel admin ---------- */
function admin(){S.adm=S.adm||{};const A=S.adm;const T=(k,l)=>`<button class="chip ${A[k]?"on":""}" data-tg="${k}">${A[k]?"✅":"⬜"} ${l}</button>`;
 popup(`<div class="adm"><h2>🛠️ Panel admin</h2><div class="mut">Triche activée = c'est ta partie, fais-toi plaisir 😈</div>
 <h3>💶 Argent</h3><div class="chips">${[1e3,1e5,1e6,1e9].map(v=>`<button class="chip" data-mo="${v}">+${fmt(v)} €</button>`).join("")}</div>
 <h3>👥 Fans</h3><div class="chips">${[1e3,1e5,1e6,1e8].map(v=>`<button class="chip" data-fa="${v}">+${fmt(v)}</button>`).join("")}<button class="chip" data-fa="-1">🐐 Direct LÉGENDE</button></div>
 <h3>⚡ Énergie & hype</h3><div class="chips"><button class="chip" id="aen">⚡ Énergie pleine</button>${T("infEn","Énergie infinie")}<button class="chip" id="ahy">🔥 Hype 100</button></div>
 <h3>🎤 Skills & matos</h3><div class="chips"><button class="chip" id="ask">📊 Tous les skills à 100</button><button class="chip" id="aup">🛒 Tout le matos au max</button><button class="chip" id="ame">👕 Tout le merch</button><button class="chip" id="ala">🏷️ Tous les artistes au label</button></div>
 <h3>💿 Musique</h3><div class="chips">${T("q100","Sons toujours 100/100")}${T("hit","Chaque sortie = HIT")}<button class="chip" id="asg">🎁 Me donner un son 100/100</button><button class="chip" id="acer">💿 +1M streams à tous mes sons</button></div>
 <h3>⚔️ Clashs</h3><div class="chips">${T("winClash","Gagner tous les clashs")}<button class="chip" id="ariv">🏆 Tous les rivaux battus</button></div>
 <h3>📅 Temps</h3><div class="chips"><button class="chip" id="ad1">⏩ +1 jour</button><button class="chip" id="ad7">⏩ +7 jours</button><button class="chip" id="aev">🎲 Événement maintenant</button></div>
 <h3>✏️ Profil</h3><div class="chips"><button class="chip" id="anm">Changer de blaze</button>${AVS.map(a=>`<button class="chip" data-av="${a}">${a}</button>`).join("")}</div>
 <button class="btn g" onclick="document.getElementById('ov').remove()" style="width:100%;margin-top:16px">Fermer</button></div>`);
 const re=(m)=>{if(m)toast(m);render();admin()};
 document.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{S.money+=+b.dataset.mo;re("💶 Argent ajouté")});
 document.querySelectorAll("[data-fa]").forEach(b=>b.onclick=()=>{const v=+b.dataset.fa;if(v<0)S.fans=Math.max(S.fans,1.5e8);else S.fans+=v;re("👥 Fans ajoutés")});
 document.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{A[b.dataset.tg]=!A[b.dataset.tg];if(b.dataset.tg==="infEn")S.en=enMax();re()});
 document.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{S.av=b.dataset.av;re("Style changé")});
 $("#aen").onclick=()=>{S.en=enMax();re("⚡ Énergie pleine")};$("#ahy").onclick=()=>{S.hype=100;re("🔥 Hype au max")};
 $("#ask").onclick=()=>{for(const k in S.sk)S.sk[k]=100;re("📊 Skills à 100")};
 $("#aup").onclick=()=>{for(const s of SHOP)S.up[s.k]=s.cost.length-1;re("🛒 Matos au max")};
 $("#ame").onclick=()=>{S.merch=MERCH.map((_,i)=>i);re("👕 Tout le merch en vente")};
 $("#ala").onclick=()=>{for(const a of ARTISTS)if(!S.label.find(x=>x.n===a.n))S.label.push({n:a.n,ic:a.ic,tal:a.tal,inc:Math.round(a.cost*.006)});re("🏷️ Label complet")};
 $("#asg").onclick=()=>{const th=pick(THEMES);S.songs.unshift({t:pick(TITLES[th[0]])+" (Admin)",th:th[0],ic:th[1],col:th[2],q:100,streams:0,daily:0,released:false,clip:false,day:S.day});re("🎁 Son 100/100 dans Mes sons")};
 $("#acer").onclick=()=>{for(const s of S.songs)if(s.released)s.streams+=1e6;re("💿 Streams ajoutés (certifs à la prochaine nuit)")};
 $("#ariv").onclick=()=>{S.rivalsBeat=RIVALS.map((_,i)=>i);re("🏆 Tous battus")};
 $("#ad1").onclick=()=>{closePop();sleep()};$("#ad7").onclick=()=>{closePop();for(let i=0;i<7;i++)sleep();closePop()};
 $("#aev").onclick=()=>{closePop();randomEvent()};
 $("#anm").onclick=()=>{const n=prompt("Nouveau blaze :",S.name);if(n&&n.trim().length>=2){S.name=n.trim().replace(/[<>]/g,"").slice(0,18);re("✏️ Blaze changé")}};
}

/* Charts */
function chartsHTML(){const best=S.songs.filter(s=>s.released).sort((a,b)=>b.daily-a.daily)[0];
 const npc=RIVALS.map(r=>({n:r.n,ic:r.ic,t:pick(["Fumée","Nuit noire","Zéro","Plus haut","Givre","Couronne","Sans toi","Billets"]),v:Math.round(r.fans*rnd(.25,.45)),me:false}));
 if(best)npc.push({n:S.name,ic:S.av,t:best.t,v:Math.round(best.daily*(1+S.up.team*.25)*(.6+S.hype/100*.8)),me:true});
 npc.sort((a,b)=>b.v-a.v);const mx=npc[0]?.v||1;
 const artists=[...RIVALS.map(r=>({n:r.n,ic:r.ic,f:r.fans})),{n:S.name,ic:S.av,f:S.fans,me:1}].sort((a,b)=>b.f-a.f);
 return `<div class="card"><h2>📈 Top streams du jour</h2>${npc.slice(0,10).map((c,i)=>`<div class="chart ${c.me?"me":""}"><div class="n">${i+1}</div><div style="font-size:22px">${c.ic}</div><div style="flex:1;min-width:0"><b>${esc(c.t)}</b> <small class="mut">— ${esc(c.n)}</small><div class="bar2"><i style="width:${c.v/mx*100}%"></i></div></div><small>${fmt(c.v)}</small></div>`).join("")}${best?"":`<div class="mut">Sors un son pour apparaître dans le top.</div>`}</div>
 <div class="card"><h2>👑 Classement des rappeurs</h2>${artists.map((a,i)=>`<div class="chart ${a.me?"me":""}"><div class="n">${i+1}</div><div style="font-size:22px">${a.ic}</div><div style="flex:1"><b>${esc(a.n)}</b></div><small>${fmt(a.f)} fans</small></div>`).join("")}</div>`}

/* Business */
function bizHTML(){
 return `<div class="card"><h2>👕 Merch</h2><div class="mut" style="margin-bottom:8px">Revenus chaque nuit selon tes fans.</div>${MERCH.map((m,i)=>{const own=S.merch.includes(i),ok=S.fans>=m.need;return `<div class="song"><div class="cov" style="background:#2a2342">${m.ic}</div><div class="inf"><b>${m.n}${own?'<span class="tag">✔ en vente</span>':""}</b><small class="mut">${ok?"≈ "+eur(S.fans*m.inc*.05)+"/jour":"🔒 "+fmt(m.need)+" fans"}</small></div>${!own&&ok?`<button class="btn g" data-m="${i}" style="padding:8px 10px;font-size:13px">${eur(m.cost)}</button>`:""}</div>`}).join("")}</div>
 <div class="card"><h2>🏷️ Ton label</h2>${S.fans<100000?`<div class="mut">🔒 Débloqué à 100k fans. Tu pourras signer des artistes qui te rapportent de l'argent chaque jour.</div>`:
 `<div class="mut" style="margin-bottom:8px">${S.label.length} artiste(s) signé(s)</div>${ARTISTS.map((a,i)=>{const own=S.label.find(x=>x.n===a.n);return `<div class="song"><div class="cov" style="background:#1d2a3a">${a.ic}</div><div class="inf"><b>${a.n}${own?'<span class="tag">✔ signé</span>':""}</b><small class="mut">Talent ${a.tal}/100${own?` · ${eur(own.inc||0)}/jour`:""}</small></div>${own?"":`<button class="btn g" data-a="${i}" style="padding:8px 10px;font-size:13px">${eur(a.cost)}</button>`}</div>`}).join("")}`}</div>
 <div class="card"><h2>🏆 Stats</h2><div class="mut" style="line-height:1.8">💿 Sons sortis : ${S.songs.filter(s=>s.released).length}<br>🎧 Streams totaux : ${fmt(S.stats.streams)}<br>🎤 Concerts : ${S.stats.concerts}<br>⚔️ Clashs : ${S.stats.clashW}V / ${S.stats.clashL}D<br>⭐ Meilleure note : ${S.stats.best}/100<br>📀 Albums : ${S.albums.length}</div></div>`}
function bindBiz(){
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const i=+b.dataset.m,m=MERCH[i];if(!pay(m.cost))return;S.merch.push(i);log(`${m.ic} Merch ${m.n} en vente`);toast(`${m.ic} ${m.n} en vente !`);render()});
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=ARTISTS[+b.dataset.a];if(!pay(a.cost))return;S.label.push({n:a.n,ic:a.ic,tal:a.tal,inc:Math.round(a.cost*.006)});log(`🏷️ ${a.n} signe sur ton label`);toast(`🏷️ ${a.n} signé !`);render()});
}

render();
window.__RAP=S;
})();
</script>
