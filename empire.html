<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EMPIRE MILLIONNAIRE — jeu de business de llmms ia</title>
<meta name="description" content="EMPIRE MILLIONNAIRE : pars de zéro, ouvre des business, investis en bourse, crypto et immobilier, achète du luxe et deviens le plus riche du monde.">
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#0a0d14;--card:#131824;--card2:#1a2131;--line:#232c3f;--txt:#eef2f8;--dim:#8b96ab;--g:#22c55e;--r:#ef4444;--gold:#fbbf24;--acc:#6366f1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
#app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:rgba(10,13,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
.top{display:flex;align-items:center;gap:8px}
.logo{font-weight:900;letter-spacing:.04em;font-size:15px;background:linear-gradient(90deg,#fbbf24,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.grow{flex:1}
.cash{font-size:26px;font-weight:900;margin-top:2px;font-variant-numeric:tabular-nums}
.sub{color:var(--dim);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:12.5px}
main{flex:1;padding:12px 12px 20px}
nav{position:sticky;bottom:0;display:flex;background:rgba(10,13,20,.96);border-top:1px solid var(--line);padding:6px 4px 10px;z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--dim);padding:6px 0;border-radius:12px}
nav button b{font-size:21px}
nav button.on{color:#fff;background:var(--card2)}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:16px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:8px}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:var(--card2);flex:none}
.item .t{font-weight:800}.item .d{color:var(--dim);font-size:12.5px}
.btn{background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:12px;padding:10px 14px;font-weight:800;white-space:nowrap}
.btn.g{background:linear-gradient(135deg,#22c55e,#15803d)}.btn.r{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn.o{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1100}
.btn.gh{background:var(--card2);border:1px solid var(--line)}
.btn[disabled]{opacity:.38}
.up{color:var(--g)}.dn{color:var(--r)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:10px;overflow-x:auto}
.seg button{flex:1;padding:8px 10px;border-radius:10px;font-weight:800;font-size:13px;color:var(--dim);white-space:nowrap}
.seg button.on{background:var(--card2);color:#fff}
.work{width:100%;aspect-ratio:2.6;border-radius:22px;background:radial-gradient(circle at 50% 30%,#4f46e5,#1e1b4b);font-size:22px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 30px -10px #4f46e5;position:relative;overflow:hidden}
.work:active{transform:scale(.97)}
.work small{font-size:13px;font-weight:700;opacity:.85}
.float{position:fixed;pointer-events:none;font-weight:900;color:#4ade80;font-size:20px;animation:fl .9s ease-out forwards;z-index:50;text-shadow:0 2px 6px #000}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi div{background:var(--card2);border-radius:14px;padding:10px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.kpi span{color:var(--dim);font-size:12px}
.bar{height:7px;background:var(--card2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e)}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:30}
#pop.on{display:flex}
#pop .in{background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px 26px;width:min(760px,100%);max-height:88dvh;overflow-y:auto;animation:su .25s ease-out}
@keyframes su{from{transform:translateY(40px);opacity:0}}
#pop h3{margin:0 0 6px;font-size:20px}
.qty{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.qty button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.qty button.on{background:#4f46e5;border-color:transparent}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#1e293b;border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--dim)}
.tag.b{background:#14532d;color:#86efac}.tag.h{background:#7c2d12;color:#fdba74}
svg.sp{display:block}
.hint{color:var(--dim);font-size:12.5px}
input.in{background:var(--card2);color:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;width:120px}
.lux{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lux .x{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.lux .x .e{font-size:40px}.lux .x.own{border-color:#fbbf24;box-shadow:0 0 0 1px #fbbf24 inset}
.ev{border-left:4px solid var(--gold)}
</style>
</head>
<body>
<div id="app">
<header><div class="top"><span class="logo">EMPIRE MILLIONNAIRE</span><span class="grow"></span><button class="chip" id="spd">▶ x1</button><button class="chip" id="adm">⚙️</button></div>
<div class="cash" id="cash">0 €</div>
<div class="sub"><span id="nw">Fortune : 0 €</span><span id="inc">+0 €/jour</span><span id="dt">Jour 1 · 18 ans</span></div></header>
<main id="main"></main>
<nav><button data-p="home" class="on"><b>🏠</b>Accueil</button><button data-p="biz"><b>🏪</b>Business</button><button data-p="mkt"><b>📈</b>Marchés</button><button data-p="immo"><b>🏢</b>Immo</button><button data-p="lux"><b>💎</b>Luxe</button></nav>
</div>
<div id="pop"><div class="in" id="popIn"></div></div>
<div id="toast"></div>
<script>
(function(){
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const gauss=()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v); };
function fmt(n,dec){ const s=n<0?"-":""; n=Math.abs(n); const u=[[1e12,"Bn"],[1e9,"Md"],[1e6,"M"],[1e3,"k"]]; for(const [v,l] of u) if(n>=v) return s+(n/v).toFixed(n/v>=100?0:n/v>=10?1:2).replace(".",",")+" "+l+" €"; return s+(dec?n.toFixed(2).replace(".",","):Math.floor(n))+" €"; }
const pct=x=>(x>=0?"+":"")+(x*100).toFixed(2).replace(".",",")+" %";

/* ================= CATALOGUES (tout est inventé) ================= */
const JOBS=[["🛵","Livreur",4,0],["🧑‍💼","Vendeur",10,1500],["📋","Chef d'équipe",25,6000],["💼","Manager",60,25000],["🏢","Directeur",150,120000],["👔","PDG",400,600000]];
const CATS={
 com:["🛒","Commerce",.012,.25,[["📰","Kiosque",2000],["🥖","Épicerie de quartier",15000],["🏬","Supérette",80000],["🛍️","Centre commercial",2.5e6],["🏙️","Chaîne de magasins",60e6]]],
 res:["🍔","Restauration",.013,.35,[["🌭","Food truck",8000],["🍕","Pizzeria",45000],["🍽️","Restaurant gastronomique",400000],["🍟","Chaîne de fast-food",6e6]]],
 tec:["💻","Tech",.017,.7,[["🌐","Agence web",30000],["🎮","Studio de jeux vidéo",250000],["🤖","Start-up IA",3e6],["🛰️","Géant de la tech",80e6],["🚀","Entreprise spatiale",1.2e9]]],
 usi:["🏭","Industrie",.011,.2,[["🔧","Atelier",60000],["🪑","Usine de meubles",600000],["🚗","Usine automobile",15e6],["⚡","Centrale électrique",400e6]]],
 ban:["🏦","Finance",.009,.12,[["💱","Bureau de change",120000],["🏦","Banque locale",5e6],["🌍","Banque internationale",150e6],["💹","Fonds d'investissement",3e9]]],
 hot:["🏨","Hôtellerie",.012,.3,[["🛏️","Auberge",40000],["🏨","Hôtel 3 étoiles",900000],["🏰","Palace",25e6],["🌴","Chaîne d'hôtels",300e6]]]
};
const STOCKS=[["NVT","NovaTech","💻",180,.025],["AFY","AeroFly","✈️",64,.02],["GVT","GreenVolt","🔋",42,.03],["MMT","MegaMart","🛒",88,.012],["FDX","FoodiX","🍔",35,.015],["CYB","CyberBank","🏦",120,.014],["ATN","AutoNext","🚗",210,.028],["PHP","PharmaPlus","💊",76,.018],["STZ","StreamZ","📺",23,.03],["BLD","BuildCo","🏗️",51,.013],["OCS","OceanShip","🚢",17,.022],["GVS","GameVerse","🎮",97,.027]];
const CRYPTO=[["BNV","BitNova","🟠",42000,.05],["ETR","Ethera","🔷",2600,.06],["SLC","SolarCoin","☀️",95,.08],["DGM","DogeMoon","🐶",.12,.12],["PXT","Pixel Token","👾",3.2,.1],["LNX","Lunex","🌙",14,.09]];
const CITIES=[["🇫🇷","Paris",1.2],["🇦🇪","Dubaï",1.1],["🇺🇸","New York",1.4],["🇲🇨","Monaco",2],["🇯🇵","Tokyo",1.15],["🇬🇧","Londres",1.3],["🇺🇸","Miami",1]];
const RTYPES=[["🏠","Studio",90000],["🏡","Appartement",320000],["🏘️","Maison",750000],["🏖️","Villa",3e6],["🏢","Immeuble",18e6],["🌆","Gratte-ciel",250e6]];
const LUX=[["Voitures",[["🚙","Citadine",15000,1],["🚘","Berline sport",90000,3],["🏎️","Supercar",350000,8],["🚀","Hypercar",2.5e6,20]]],
 ["Montres & bijoux",[["⌚","Montre de luxe",12000,1],["💍","Bague en diamant",80000,3],["👑","Collier royal",1.5e6,15],["💎","Diamant rose",25e6,40]]],
 ["Bateaux",[["🚤","Hors-bord",120000,3],["🛥️","Yacht",6e6,25],["🛳️","Méga-yacht",300e6,120]]],
 ["Avions",[["🚁","Hélicoptère",2e6,12],["🛩️","Jet privé",30e6,50],["✈️","Jet long-courrier",200e6,110]]],
 ["Résidences",[["🏰","Manoir",8e6,30],["🗼","Penthouse",40e6,60],["🏝️","Île privée",900e6,250]]],
 ["Art",[["🖼️","Tableau de maître",4e6,20],["🗿","Sculpture rare",30e6,45]]]];
const RICH=[["Victor Ardent",420e9],["Amelia Strand",310e9],["Kenzo Hart",240e9],["Sofia Marlowe",180e9],["Liam Okoro",120e9],["Nora Velasquez",75e9],["Hugo Lenoir",40e9],["Maya Chen-Ruiz",18e9],["Oscar Blum",6e9],["Inès Fabre",1.5e9],["Tom Keller",400e6],["Léa Dumont",80e6],["Sam Rivera",12e6],["Jade Moreau",1.5e6]];

/* ================= ÉTAT ================= */
const KEY="empire_mil";
function fresh(){ const st={}, cr={}; STOCKS.forEach(s=>st[s[0]]={p:s[3],h:Array.from({length:40},()=>s[3]),q:0,avg:0,d0:s[3]});
  CRYPTO.forEach(s=>cr[s[0]]={p:s[3],h:Array.from({length:40},()=>s[3]),q:0,avg:0,d0:s[3]});
  for(let i=0;i<40;i++){ step(st,STOCKS,1); step(cr,CRYPTO,1); }
  const re={}; CITIES.forEach((c,ci)=>RTYPES.forEach((t,ti)=>re[ci+"-"+ti]={v:Math.round(t[2]*c[2]*rnd(.92,1.08)),own:0}));
  return {cash:500,day:1,age:18,job:0,taps:0,earned:0,biz:[],hold:{},st,cr,re,lux:{},sav:0,loan:0,hist:[500],spd:1,ts:Date.now(),log:[],best:500}; }
function step(o,list,m){ list.forEach(([k,,,,vol])=>{ const a=o[k]; const r=.0006+vol*gauss()*(m||1)+(E&&E.mkt?E.mkt*vol*2:0); a.p=Math.max(list===CRYPTO?.0001:.5,a.p*(1+r)); a.h.push(a.p); if(a.h.length>60) a.h.shift(); }); }
let E=null; try{ E=JSON.parse(localStorage.getItem(KEY)||"null"); }catch{}
if(!E){ E=fresh(); }
function save(){ E.ts=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(E)); }catch{} }

/* ================= CALCULS ================= */
const bInfo=b=>{ const C=CATS[b.c], it=C[4][b.i]; return {cat:C,ic:it[0],n:it[1],cost:it[2]}; };
function bProfit(b){ const {cat,cost}=bInfo(b); let p=cost*cat[2]*Math.pow(1.28,b.lvl-1)*(1+b.emp*.08); if(E.hold[b.c]) p*=1.25; if(b.boost>0) p*=2; return p; }
const bUpCost=b=>bInfo(b).cost*.45*Math.pow(1.35,b.lvl-1);
const bEmpCost=b=>bInfo(b).cost*.06*(1+b.emp*.25);
const reInfo=id=>{ const [ci,ti]=id.split("-").map(Number); return {city:CITIES[ci],type:RTYPES[ti]}; };
const rent=id=>E.re[id].v*.0011;
function luxVal(){ let v=0; LUX.forEach(([,l],gi)=>l.forEach((x,i)=>{ if(E.lux[gi+"-"+i]) v+=x[2]*.7; })); return v; }
function prestige(){ let p=0; LUX.forEach(([,l],gi)=>l.forEach((x,i)=>{ if(E.lux[gi+"-"+i]) p+=x[3]; })); return p; }
function netWorth(){ let n=E.cash+E.sav-E.loan; E.biz.forEach(b=>n+=bInfo(b).cost*(.6+(b.lvl-1)*.25)); STOCKS.forEach(s=>n+=E.st[s[0]].q*E.st[s[0]].p); CRYPTO.forEach(s=>n+=E.cr[s[0]].q*E.cr[s[0]].p); for(const id in E.re) if(E.re[id].own) n+=E.re[id].v; return n+luxVal(); }
function dailyIncome(){ let n=0; E.biz.forEach(b=>n+=bProfit(b)); for(const id in E.re) if(E.re[id].own) n+=rent(id); n+=E.sav*.0004-E.loan*.0008; return n; }

/* ================= TEMPS QUI PASSE ================= */
function tick(silent){ E.day++; if(E.day%90===0) E.age++;
  E.mkt=E.mktT>0?E.mkt:0; if(E.mktT>0) E.mktT--;
  let biz=0; E.biz.forEach(b=>{ const v=bProfit(b)*(1+gauss()*bInfo(b).cat[3]*.5); b.last=v; biz+=v; if(b.boost>0) b.boost--; });
  let rents=0; for(const id in E.re){ const r=E.re[id]; r.v*=1+.0003+.006*gauss()+(E.mkt||0)*.004; if(r.own) rents+=rent(id); }
  const inter=E.sav*.0004, li=E.loan*.0008; E.sav+=inter; E.cash+=biz+rents-li;
  step(E.st,STOCKS); step(E.cr,CRYPTO);
  if(E.day%30===0){ let dv=0; STOCKS.forEach(s=>dv+=E.st[s[0]].q*E.st[s[0]].p*.004); if(dv>0){ E.cash+=dv; if(!silent) logEv(`💵 Dividendes reçus : +${fmt(dv)}`); } }
  if(!silent&&Math.random()<.035) randomEvent();
  const nw=netWorth(); E.hist.push(nw); if(E.hist.length>120) E.hist.shift(); E.best=Math.max(E.best,nw);
  if(E.cash<0&&E.loan>0&&!silent) toast("⚠️ Ton compte est à découvert !");
}
function logEv(t){ E.log.unshift(`J${E.day} · ${t}`); E.log=E.log.slice(0,25); toast(t); }
function randomEvent(){ const evs=[
  ()=>{ E.mkt=.6; E.mktT=6; logEv("📈 BOOM sur les marchés ! Tout monte."); },
  ()=>{ E.mkt=-.8; E.mktT=5; logEv("📉 KRACH boursier ! Les marchés chutent."); },
  ()=>{ if(!E.biz.length) return; const b=pick(E.biz), l=bProfit(b)*ri(3,8); E.cash-=l; logEv(`🔥 Incendie dans ${bInfo(b).n} : -${fmt(l)}`); },
  ()=>{ if(!E.biz.length) return; const b=pick(E.biz); b.boost=(b.boost||0)+5; logEv(`⭐ ${bInfo(b).n} devient viral : profits x2 pendant 5 jours !`); },
  ()=>{ const t=Math.max(0,E.cash)*.04; if(t<50) return; E.cash-=t; logEv(`🧾 Contrôle fiscal : -${fmt(t)}`); },
  ()=>{ const g=Math.max(200,netWorth()*.005); E.cash+=g; logEv(`🎁 Un oncle t'a laissé un héritage : +${fmt(g)}`); }];
  pick(evs)(); }
let timer=null;
function startClock(){ clearInterval(timer); timer=setInterval(()=>{ for(let i=0;i<E.spd;i++) tick(); save(); head(); if(!$("pop").classList.contains("on")||page==="mkt") draw(true); },4000); }

/* ================= UI ================= */
let page="home", mtab="st";
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),2200); }
function head(){ $("cash").textContent=fmt(E.cash,E.cash<10000); const inc=dailyIncome(); $("nw").textContent="Fortune : "+fmt(netWorth()); $("inc").innerHTML=`<b class="${inc>=0?"up":"dn"}">${inc>=0?"+":""}${fmt(inc)}/jour</b>`; $("dt").textContent=`Jour ${E.day} · ${E.age} ans`; $("spd").textContent=(E.spd>1?"⏩ x":"▶ x")+E.spd; }
function spark(h,w=90,hh=30,col){ const mn=Math.min(...h), mx=Math.max(...h), r=mx-mn||1; const pts=h.map((v,i)=>`${(i/(h.length-1)*w).toFixed(1)},${(hh-2-(v-mn)/r*(hh-4)).toFixed(1)}`).join(" "); const c=col||(h[h.length-1]>=h[0]?"#22c55e":"#ef4444");
  return `<svg class="sp" width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}"><polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" points="${pts}"/></svg>`; }
function bigChart(h){ const w=340,hh=150, mn=Math.min(...h), mx=Math.max(...h), r=mx-mn||1, up=h[h.length-1]>=h[0], c=up?"#22c55e":"#ef4444";
  const pts=h.map((v,i)=>`${(i/(h.length-1)*w).toFixed(1)},${(hh-6-(v-mn)/r*(hh-14)).toFixed(1)}`);
  return `<svg viewBox="0 0 ${w} ${hh}" style="width:100%;height:auto;display:block"><defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#gf)" points="0,${hh} ${pts.join(" ")} ${w},${hh}"/><polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.join(" ")}"/></svg>`; }
function go(p){ page=p; document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p)); draw(); scrollTo(0,0); }
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function draw(soft){ head(); if(soft&&page!=="mkt"&&page!=="biz") return; ({home,biz,mkt,immo,lux})[page](); }
function popup(html,after){ $("popIn").innerHTML=html; $("pop").classList.add("on"); $("popIn").scrollTop=0; after&&after(); }
function closePop(){ $("pop").classList.remove("on"); draw(); }
$("pop").onclick=e=>{ if(e.target.id==="pop") closePop(); };
const pay=(n)=>{ if(E.cash<n){ toast("Pas assez d'argent 💸"); return false; } E.cash-=n; return true; };

/* ---------- ACCUEIL ---------- */
function home(){ const j=JOBS[E.job], nj=JOBS[E.job+1], nw=netWorth(), list=RICH.concat([["⭐ TOI",nw]]).sort((a,b)=>b[1]-a[1]), rank=list.findIndex(r=>r[0]==="⭐ TOI")+1;
  $("main").innerHTML=`<div class="card"><button class="work" id="work">${j[0]} TRAVAILLER<small>${j[1]} · +${fmt(j[2])} par clic</small></button>
  <div class="row" style="margin-top:10px"><div class="grow hint">${nj?`Prochaine promotion : <b style="color:#fff">${nj[0]} ${nj[1]}</b> (+${fmt(nj[2])}/clic)`:"Tu es au top de ta carrière 👔"}</div>${nj?`<button class="btn o" id="promo">Formation ${fmt(nj[3])}</button>`:""}</div></div>
  <div class="card"><div class="row"><b class="grow">📊 Ta fortune</b>${(()=>{ const h=E.hist.slice(-60), v=h[0]>0?h.at(-1)/h[0]-1:0; return `<span class="${v>=0?"up":"dn"}">${pct(v)} <small class="hint">60 j</small></span>`; })()}</div>${bigChart(E.hist.length>1?E.hist.slice(-60):[E.hist[0],E.hist[0]])}
  <div class="kpi" style="margin-top:8px"><div><span>Business</span><b>${E.biz.length}</b></div><div><span>Revenus / jour</span><b class="up">${fmt(dailyIncome())}</b></div><div><span>Prestige ✨</span><b>${prestige()}</b></div><div><span>Classement mondial</span><b>#${rank}</b></div></div></div>
  <h2>🏦 Banque</h2><div class="card"><div class="kpi"><div><span>Épargne (+0,04 %/jour)</span><b>${fmt(E.sav)}</b></div><div><span>Prêt (0,08 %/jour)</span><b class="${E.loan?"dn":""}">${fmt(E.loan)}</b></div></div>
  <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px"><button class="btn gh" id="dep">Déposer</button><button class="btn gh" id="wd">Retirer</button><button class="btn gh" id="ln">Emprunter</button><button class="btn gh" id="rp" ${E.loan?"":"disabled"}>Rembourser</button></div></div>
  <h2>🏆 Classement des plus riches</h2><div class="card">${list.slice(Math.max(0,rank-4),rank+2).map((r,i)=>{ const pos=Math.max(0,rank-4)+i+1; return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);${r[0]==="⭐ TOI"?"color:#fbbf24;font-weight:900":""}"><b style="width:34px">#${pos}</b><span class="grow">${r[0]}</span><b>${fmt(r[1])}</b></div>`; }).join("")}
  <p class="hint">Deviens n°1 en dépassant ${RICH[0][0]} (${fmt(RICH[0][1])}).</p></div>
  <h2>📰 Actualités</h2><div class="card ev">${E.log.slice(0,6).map(l=>`<div class="hint" style="padding:4px 0">${l}</div>`).join("")||'<div class="hint">Rien pour l’instant. Le temps passe : 1 jour = 4 secondes.</div>'}</div>`;
  $("work").onclick=e=>{ const g=JOBS[E.job][2]; E.cash+=g; E.taps++; E.earned+=g; head(); const f=document.createElement("div"); f.className="float"; f.textContent="+"+fmt(g); f.style.left=(e.clientX-20)+"px"; f.style.top=(e.clientY-20)+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),900); if(E.taps%20===0) save(); };
  if(nj) $("promo").onclick=()=>{ if(!pay(nj[3])) return; E.job++; save(); toast(`🎓 Promotion : ${nj[1]} !`); home(); };
  const amt=(title,max,fn)=>popup(`<h3>${title}</h3><p class="hint">Maximum : ${fmt(max)}</p><div class="qty">${[.1,.25,.5,1].map(f=>`<button data-f="${f}">${f===1?"Max":f*100+" %"}</button>`).join("")}</div><button class="btn gh" id="x" style="width:100%">Annuler</button>`,()=>{ document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ const v=Math.floor(max*+b.dataset.f); if(v>0) fn(v); save(); closePop(); }); $("x").onclick=closePop; });
  $("dep").onclick=()=>amt("Déposer sur l'épargne",Math.max(0,E.cash),v=>{ E.cash-=v; E.sav+=v; });
  $("wd").onclick=()=>amt("Retirer de l'épargne",E.sav,v=>{ E.sav-=v; E.cash+=v; });
  $("ln").onclick=()=>amt("Emprunter",Math.max(0,netWorth()*.5-E.loan),v=>{ E.loan+=v; E.cash+=v; toast("Prêt accordé 🏦"); });
  $("rp").onclick=()=>amt("Rembourser le prêt",Math.min(E.loan,Math.max(0,E.cash)),v=>{ E.loan-=v; E.cash-=v; });
}

/* ---------- BUSINESS ---------- */
let bcat="com";
function biz(){ const C=CATS[bcat], own=E.biz.filter(b=>b.c===bcat), canMerge=!E.hold[bcat]&&own.length>=3&&own.every(b=>b.lvl>=5);
  $("main").innerHTML=`<div class="seg">${Object.entries(CATS).map(([k,c])=>`<button data-c="${k}" class="${k===bcat?"on":""}">${c[0]} ${c[1]}</button>`).join("")}</div>
  <div class="card"><div class="row"><div class="grow"><b>${C[0]} ${C[1]}</b> ${E.hold[bcat]?'<span class="tag b">Holding +25 %</span>':""}<div class="hint">Rentabilité ${(C[2]*100).toFixed(1).replace(".",",")} %/jour · Risque ${C[3]>=.5?'<span class="tag h">élevé</span>':C[3]>=.25?"moyen":"faible"}</div></div></div>
  ${canMerge?`<button class="btn o" id="merge" style="width:100%;margin-top:10px">🤝 Fusionner en Holding (+25 % de profits) · ${fmt(own.reduce((a,b)=>a+bInfo(b).cost,0)*.2)}</button>`:!E.hold[bcat]?`<p class="hint">🤝 Fusion : possède 3 business ${C[1]} niveau 5+ pour créer une Holding.</p>`:""}</div>
  ${own.length?`<h2>Tes business</h2>`+own.map(b=>{ const I=bInfo(b), k=E.biz.indexOf(b); return `<div class="item" data-b="${k}"><div class="ic">${I.ic}</div><div class="grow"><div class="t">${I.n} ${b.boost>0?'<span class="tag b">x2 · '+b.boost+'j</span>':""}</div><div class="d">Niv. ${b.lvl}/10 · 👥 ${b.emp} · <span class="up">+${fmt(bProfit(b))}/j</span></div><div class="bar" style="margin-top:5px"><i style="width:${b.lvl*10}%"></i></div></div><b>›</b></div>`; }).join(""):""}
  <h2>Ouvrir un business</h2>${C[4].map((it,i)=>`<div class="item"><div class="ic">${it[0]}</div><div class="grow"><div class="t">${it[1]}</div><div class="d">~ <span class="up">+${fmt(it[2]*C[2])}/jour</span></div></div><button class="btn g" data-buy="${i}" ${E.cash<it[2]?"disabled":""}>${fmt(it[2])}</button></div>`).join("")}`;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ bcat=b.dataset.c; biz(); });
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{ const it=C[4][+b.dataset.buy]; if(!pay(it[2])) return; E.biz.push({c:bcat,i:+b.dataset.buy,lvl:1,emp:0,boost:0}); save(); toast(`🎉 ${it[1]} ouvert !`); biz(); });
  document.querySelectorAll("[data-b]").forEach(e=>e.onclick=()=>bizPop(+e.dataset.b));
  if(canMerge) $("merge").onclick=()=>{ const c=own.reduce((a,b)=>a+bInfo(b).cost,0)*.2; if(!pay(c)) return; E.hold[bcat]=1; save(); toast(`🤝 Holding ${C[1]} créée ! +25 % de profits`); biz(); };
}
function bizPop(k){ const b=E.biz[k], I=bInfo(b), up=bUpCost(b), ec=bEmpCost(b), ad=I.cost*.1, sell=I.cost*(.6+(b.lvl-1)*.25);
  popup(`<div class="row"><div class="ic" style="width:60px;height:60px;font-size:34px">${I.ic}</div><div class="grow"><h3>${I.n}</h3><div class="hint">${I.cat[1]} · Niveau ${b.lvl}/10 · ${b.emp} employé(s)</div></div></div>
  <div class="kpi" style="margin:12px 0"><div><span>Profit moyen / jour</span><b class="up">${fmt(bProfit(b))}</b></div><div><span>Hier</span><b class="${(b.last||0)>=0?"up":"dn"}">${fmt(b.last||0)}</b></div></div>
  <div class="item"><div class="grow"><div class="t">⬆️ Améliorer</div><div class="d">+28 % de profits</div></div><button class="btn" id="bu" ${b.lvl>=10||E.cash<up?"disabled":""}>${b.lvl>=10?"MAX":fmt(up)}</button></div>
  <div class="item"><div class="grow"><div class="t">👥 Embaucher un employé</div><div class="d">+8 % de profits (max 15)</div></div><button class="btn" id="be" ${b.emp>=15||E.cash<ec?"disabled":""}>${b.emp>=15?"MAX":fmt(ec)}</button></div>
  <div class="item"><div class="grow"><div class="t">📣 Campagne de pub</div><div class="d">Profits x2 pendant 7 jours</div></div><button class="btn o" id="bp" ${E.cash<ad?"disabled":""}>${fmt(ad)}</button></div>
  <div class="row" style="margin-top:10px"><button class="btn r" id="bs">Vendre ${fmt(sell)}</button><span class="grow"></span><button class="btn gh" id="x">Fermer</button></div>`,()=>{
    $("bu").onclick=()=>{ if(b.lvl>=10||!pay(up)) return; b.lvl++; save(); toast("⬆️ Niveau "+b.lvl); bizPop(k); };
    $("be").onclick=()=>{ if(b.emp>=15||!pay(ec)) return; b.emp++; save(); toast("👥 Employé embauché"); bizPop(k); };
    $("bp").onclick=()=>{ if(!pay(ad)) return; b.boost=(b.boost||0)+7; save(); toast("📣 Profits x2 pendant 7 jours !"); bizPop(k); };
    $("bs").onclick=()=>{ if($("bs").dataset.k){ E.cash+=sell; E.biz.splice(k,1); save(); toast("Vendu ✔️"); closePop(); } else { $("bs").dataset.k=1; $("bs").textContent="Confirmer la vente ?"; } };
    $("x").onclick=closePop; }); }

/* ---------- MARCHÉS (bourse + crypto) ---------- */
function mkt(){ const isC=mtab==="cr", L=isC?CRYPTO:STOCKS, O=isC?E.cr:E.st; let port=0, cost=0; L.forEach(s=>{ port+=O[s[0]].q*O[s[0]].p; cost+=O[s[0]].q*O[s[0]].avg; });
  $("main").innerHTML=`<div class="seg"><button data-m="st" class="${!isC?"on":""}">📈 Bourse</button><button data-m="cr" class="${isC?"on":""}">🪙 Crypto</button></div>
  <div class="card"><div class="hint">Ton portefeuille ${isC?"crypto":"d'actions"}</div><div style="font-size:24px;font-weight:900">${fmt(port)}</div><div class="${port>=cost?"up":"dn"}">${fmt(port-cost)} (${pct(cost?port/cost-1:0)})</div>${E.mktT>0?`<div class="tag ${E.mkt>0?"b":"h"}" style="display:inline-block;margin-top:6px">${E.mkt>0?"📈 Marché en BOOM":"📉 KRACH en cours"}</div>`:""}</div>
  ${L.map(([k,n,ic])=>{ const a=O[k], ch=a.p/a.h[Math.max(0,a.h.length-2)]-1; return `<div class="item" data-a="${k}"><div class="ic">${ic}</div><div class="grow"><div class="t">${n} <span class="tag">${k}</span></div><div class="d">${a.q?`Tu as ${a.q.toLocaleString("fr-FR",{maximumFractionDigits:4})} · ${fmt(a.q*a.p)}`:"&nbsp;"}</div></div>${spark(a.h.slice(-30),70,28)}<div style="text-align:right;min-width:86px"><b>${fmt(a.p,a.p<1000)}</b><div class="${ch>=0?"up":"dn"}" style="font-size:12.5px">${pct(ch)}</div></div></div>`; }).join("")}
  <p class="hint">Les prix changent chaque jour. Les actions versent des dividendes tous les 30 jours. Les cryptos sont beaucoup plus risquées !</p>`;
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ mtab=b.dataset.m; mkt(); });
  document.querySelectorAll("[data-a]").forEach(e=>e.onclick=()=>assetPop(e.dataset.a,isC));
  if($("pop").classList.contains("on")&&curAsset) assetPop(curAsset[0],curAsset[1],true);
}
let curAsset=null, qmode=1;
function assetPop(k,isC,refresh){ const L=isC?CRYPTO:STOCKS, O=isC?E.cr:E.st, s=L.find(x=>x[0]===k), a=O[k]; curAsset=[k,isC];
  const maxBuy=Math.max(0,E.cash)/a.p, q=qmode==="max"?(isC?maxBuy:Math.floor(maxBuy)):qmode, qs=qmode==="max"?a.q:Math.min(qmode,a.q);
  popup(`<div class="row"><div class="ic">${s[2]}</div><div class="grow"><h3>${s[1]} <span class="tag">${k}</span></h3><b style="font-size:20px">${fmt(a.p,a.p<1000)}</b> <span class="${a.p>=a.h[0]?"up":"dn"}">${pct(a.p/a.h[0]-1)}</span></div></div>
  ${bigChart(a.h)}
  <div class="kpi" style="margin:10px 0"><div><span>Tu possèdes</span><b>${a.q.toLocaleString("fr-FR",{maximumFractionDigits:4})}</b></div><div><span>Gain / perte</span><b class="${a.p>=a.avg?"up":"dn"}">${a.q?fmt(a.q*(a.p-a.avg)):"–"}</b></div></div>
  <div class="qty">${[1,10,100,1000].map(n=>`<button data-q="${n}" class="${qmode===n?"on":""}">${n}</button>`).join("")}<button data-q="max" class="${qmode==="max"?"on":""}">Max</button></div>
  <div class="row"><button class="btn g grow" id="buy" ${q<=0||E.cash<q*a.p?"disabled":""}>Acheter ${isC&&qmode==="max"?"":q.toLocaleString("fr-FR")} · ${fmt(q*a.p)}</button><button class="btn r grow" id="sell" ${qs<=0?"disabled":""}>Vendre · ${fmt(qs*a.p)}</button></div>
  <button class="btn gh" id="x" style="width:100%;margin-top:10px">Fermer</button>`,()=>{
    document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ qmode=b.dataset.q==="max"?"max":+b.dataset.q; assetPop(k,isC); });
    $("buy").onclick=()=>{ if(q<=0||!pay(q*a.p)) return; a.avg=(a.avg*a.q+q*a.p)/(a.q+q); a.q+=q; save(); toast(`✅ Acheté ${s[1]}`); assetPop(k,isC); };
    $("sell").onclick=()=>{ if(qs<=0) return; E.cash+=qs*a.p; const g=qs*(a.p-a.avg); a.q-=qs; if(a.q<1e-9){ a.q=0; a.avg=0; } save(); toast(`💰 Vendu : ${g>=0?"+":""}${fmt(g)}`); assetPop(k,isC); };
    $("x").onclick=()=>{ curAsset=null; closePop(); }; });
  if(refresh) $("popIn").scrollTop=0; }

/* ---------- IMMOBILIER ---------- */
let city=0;
function immo(){ let tot=0, rr=0; for(const id in E.re) if(E.re[id].own){ tot+=E.re[id].v; rr+=rent(id); }
  $("main").innerHTML=`<div class="card"><div class="hint">Ton patrimoine immobilier</div><div style="font-size:24px;font-weight:900">${fmt(tot)}</div><div class="up">Loyers : +${fmt(rr)}/jour</div></div>
  <div class="seg">${CITIES.map((c,i)=>`<button data-ci="${i}" class="${i===city?"on":""}">${c[0]} ${c[1]}</button>`).join("")}</div>
  ${RTYPES.map((t,ti)=>{ const id=city+"-"+ti, r=E.re[id]; return `<div class="item"><div class="ic">${t[0]}</div><div class="grow"><div class="t">${t[1]} · ${CITIES[city][1]} ${r.own?'<span class="tag b">À toi</span>':""}</div><div class="d">Loyer <span class="up">+${fmt(rent(id))}/j</span></div></div>${r.own?`<button class="btn r" data-rs="${id}">Vendre ${fmt(r.v)}</button>`:`<button class="btn g" data-rb="${id}" ${E.cash<r.v?"disabled":""}>${fmt(r.v)}</button>`}</div>`; }).join("")}
  <p class="hint">La valeur des biens monte et descend avec le marché. Monaco est la ville la plus chère.</p>`;
  document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{ city=+b.dataset.ci; immo(); });
  document.querySelectorAll("[data-rb]").forEach(b=>b.onclick=()=>{ const r=E.re[b.dataset.rb]; if(!pay(r.v)) return; r.own=1; save(); toast("🔑 Bien acheté !"); immo(); });
  document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{ const r=E.re[b.dataset.rs]; if(!b.dataset.k){ b.dataset.k=1; b.textContent="Confirmer ?"; return; } E.cash+=r.v; r.own=0; save(); toast("Vendu ✔️"); immo(); });
}

/* ---------- LUXE ---------- */
function lux(){ $("main").innerHTML=`<div class="card"><div class="row"><div class="grow"><div class="hint">Ton prestige</div><div style="font-size:24px;font-weight:900">✨ ${prestige()}</div></div><div style="text-align:right"><div class="hint">Valeur de revente</div><b>${fmt(luxVal())}</b></div></div></div>
  ${LUX.map(([g,l],gi)=>`<h2>${g}</h2><div class="lux">${l.map((x,i)=>{ const id=gi+"-"+i, own=E.lux[id]; return `<div class="x ${own?"own":""}"><div class="e">${x[0]}</div><b>${x[1]}</b><div class="hint">✨ +${x[3]}</div>${own?`<button class="btn gh" data-ls="${id}" style="margin-top:8px;width:100%">Revendre ${fmt(x[2]*.7)}</button>`:`<button class="btn o" data-lb="${id}" style="margin-top:8px;width:100%" ${E.cash<x[2]?"disabled":""}>${fmt(x[2])}</button>`}</div>`; }).join("")}</div>`).join("")}`;
  const get=id=>{ const [g,i]=id.split("-").map(Number); return LUX[g][1][i]; };
  document.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{ const x=get(b.dataset.lb); if(!pay(x[2])) return; E.lux[b.dataset.lb]=1; save(); toast(`${x[0]} ${x[1]} acheté !`); lux(); });
  document.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{ const x=get(b.dataset.ls); E.cash+=x[2]*.7; delete E.lux[b.dataset.ls]; save(); toast("Revendu"); lux(); });
}

/* ---------- VITESSE + ADMIN ---------- */
$("spd").onclick=()=>{ E.spd=E.spd===1?2:E.spd===2?5:1; save(); head(); toast(`Vitesse x${E.spd}`); };
$("adm").onclick=()=>popup(`<h3>⚙️ Panel admin</h3><div class="qty">${[1e4,1e6,1e9,1e12].map(v=>`<button data-am="${v}">+${fmt(v)}</button>`).join("")}</div>
  <div class="row" style="flex-wrap:wrap;gap:6px"><input class="in" id="amv" type="number" placeholder="montant"><button class="btn" id="amg">Donner</button></div>
  <div class="qty"><button id="sk1">⏭ +30 jours</button><button id="sk2">⏭ +365 jours</button><button id="bm">📈 Lancer un BOOM</button><button id="kr">📉 Lancer un KRACH</button><button id="mx">🏪 Tous mes business niveau 10</button><button id="jb">👔 Devenir PDG</button></div>
  <div class="row" style="margin-top:12px"><button class="btn r" id="rs">Tout réinitialiser</button><span class="grow"></span><button class="btn gh" id="x">Fermer</button></div>`,()=>{
  const ok=t=>{ save(); head(); toast(t); };
  document.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{ E.cash+=+b.dataset.am; ok("+"+fmt(+b.dataset.am)); });
  $("amg").onclick=()=>{ const v=+$("amv").value||0; if(v){ E.cash+=v; ok("+"+fmt(v)); } };
  $("sk1").onclick=()=>{ for(let i=0;i<30;i++) tick(1); ok("+30 jours"); };
  $("sk2").onclick=()=>{ for(let i=0;i<365;i++) tick(1); ok("+1 an"); };
  $("bm").onclick=()=>{ E.mkt=.6; E.mktT=8; ok("📈 BOOM lancé"); };
  $("kr").onclick=()=>{ E.mkt=-.8; E.mktT=6; ok("📉 KRACH lancé"); };
  $("mx").onclick=()=>{ E.biz.forEach(b=>b.lvl=10); ok("Business au max"); };
  $("jb").onclick=()=>{ E.job=JOBS.length-1; ok("👔 PDG"); };
  $("rs").onclick=()=>{ if(!$("rs").dataset.k){ $("rs").dataset.k=1; $("rs").textContent="Appuie encore pour confirmer"; return; } try{ localStorage.removeItem(KEY); }catch{} location.reload(); };
  $("x").onclick=closePop; });

/* ---------- DÉMARRAGE (+ gains hors ligne) ---------- */
const away=Math.min(300,Math.floor((Date.now()-(E.ts||Date.now()))/4000));
if(away>=3){ const c0=E.cash; for(let i=0;i<away;i++) tick(1); save(); setTimeout(()=>popup(`<h3>👋 Bon retour !</h3><p>Pendant ton absence, <b>${away} jours</b> sont passés.</p><p style="font-size:22px;font-weight:900" class="${E.cash>=c0?"up":"dn"}">${E.cash>=c0?"+":""}${fmt(E.cash-c0)}</p><button class="btn g" id="x" style="width:100%">Super !</button>`,()=>{ $("x").onclick=closePop; }),300); }
else if(E.day===1&&!E.taps) setTimeout(()=>popup(`<h3>💼 Bienvenue dans EMPIRE MILLIONNAIRE</h3><p>Tu commences avec <b>500 €</b> et un petit job de livreur. Ton but : devenir <b>la personne la plus riche du monde</b>.</p><p class="hint">1️⃣ Clique sur TRAVAILLER pour gagner de l'argent.<br>2️⃣ Ouvre ton premier business (un kiosque à 2 000 €).<br>3️⃣ Investis en bourse, en crypto et dans l'immobilier.<br>4️⃣ Achète voitures, yachts, jets et îles privées.<br>Le temps passe tout seul : 1 jour = 4 secondes, même quand tu fermes le jeu.</p><button class="btn g" id="x" style="width:100%">C'est parti !</button>`,()=>{ $("x").onclick=closePop; }),300);
draw(); startClock();
window.__E=E;
})();
</script>
