<script>
(function(){
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[ri(0,a.length-1)];
const gauss=()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v); };
function fmt(n,dec){ const s=n<0?"-":""; n=Math.abs(n); const u=[[1e15,"Bd"],[1e12,"Bn"],[1e9,"Md"],[1e6,"M"],[1e3,"k"]]; for(const [v,l] of u) if(n>=v) return s+(n/v).toFixed(n/v>=100?0:n/v>=10?1:2).replace(".",",")+" "+l+" €"; return s+(dec?n.toFixed(2).replace(".",","):Math.floor(n))+" €"; }
const pct=x=>(x>=0?"+":"")+(x*100).toFixed(2).replace(".",",")+" %";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= CATALOGUES (tout est inventé) ================= */
const CLICK=[1,2,4,7,12,20,35,60,100,160];            // revenu par clic selon le niveau
const CLICKGOAL=L=>Math.round(150*Math.pow(3.1,L));   // prix pour passer au niveau suivant
const BT={
 shop:{n:"Magasin",ic:"🛒",cost:5000,mode:"out",base:80,oi:60,oc:4000,od:2,max:60,d:"Revenu garanti. Ouvre de nouvelles boutiques (ça prend du temps)."},
 fac:{n:"Usine",ic:"🏭",cost:25000,mode:"out",base:300,oi:240,oc:18000,od:4,max:40,d:"Revenu garanti. Ajoute des lignes de production."},
 taxi:{n:"Compagnie de taxis",ic:"🚕",cost:10000,mode:"fleet",gar:5,veh:[["🚕","Citadine",12000,170,90],["🚘","Berline",30000,400,140],["🚐","Van VTC",55000,690,170]],d:"Achète des véhicules. Ils s'usent et doivent être remplacés."},
 ship:{n:"Transport & logistique",ic:"🚚",cost:150000,mode:"fleet",gar:5,veh:[["🚚","Camion",90000,1150,150],["🛩️","Avion cargo",4e6,46000,260],["🚢","Porte-conteneurs",40e6,420000,400]],d:"Flotte de camions, avions et bateaux. Agrandis ton garage."},
 btp:{n:"BTP / Construction",ic:"🏗️",cost:35400,mode:"btp",d:"Gagne de l'argent en finissant des chantiers : il faut des ouvriers et des matériaux."},
 car:{n:"Concession auto",ic:"🚗",cost:40000,mode:"car",d:"Achète des voitures d'occasion, répare-les et revends-les plus cher."},
 it:{n:"Entreprise IT",ic:"💻",cost:350000,mode:"it",d:"Réalise des projets. Attention : les salaires sont payés même sans projet !"},
 bank:{n:"Banque",ic:"🏦",cost:50e6,mode:"pas",r:.0085,risk:.15,d:"Revenu stable, peu risqué."},
 oil:{n:"Pétrole & gaz",ic:"🛢️",cost:200e6,mode:"pas",r:.012,risk:.55,oil:1,d:"Dépend du prix du baril : très rentable mais risqué."},
 foot:{n:"Club de football",ic:"⚽",cost:500e6,mode:"pas",r:.008,risk:.45,d:"Billetterie, maillots, droits TV… et parfois des trophées."}
};
const MERGE=[["👕","Marque de vêtements",["shop","fac","ship"],3e6,.3,"Magasin + Usine + Transport"],
 ["🚘","Groupe automobile",["fac","car","taxi"],25e6,.3,"Usine + Concession + Taxis"],
 ["🌐","Empire tech & finance",["it","bank"],120e6,.35,"Entreprise IT + Banque"],
 ["⚡","Conglomérat de l'énergie",["oil","ship","btp"],1.5e9,.4,"Pétrole + Transport + BTP"],
 ["🏟️","Groupe sport & médias",["foot","it","shop"],2e9,.4,"Club de foot + IT + Magasin"]];
const CARS=[["Citadine",9000],["Compacte",16000],["Berline",28000],["SUV",42000],["Sportive",85000],["Voiture de luxe",160000],["Hypercar",900000]];
const BTPJ=["Rénovation d'appartement","Maison individuelle","Parking","Immeuble de bureaux","École","Pont","Centre commercial","Stade","Gratte-ciel","Aéroport"];
const ITJ=["Site vitrine","Appli mobile","Boutique en ligne","Logiciel de gestion","Jeu vidéo","Plateforme cloud","IA pour hôpital","Système bancaire","Réseau social","Satellite connecté"];
const STOCKS=[["NVT","NovaTech","💻",180,.025],["AFY","AeroFly","✈️",64,.02],["GVT","GreenVolt","🔋",42,.03],["MMT","MegaMart","🛒",88,.012],["FDX","FoodiX","🍔",35,.015],["CYB","CyberBank","🏦",120,.014],["ATN","AutoNext","🚗",210,.028],["PHP","PharmaPlus","💊",76,.018],["STZ","StreamZ","📺",23,.03],["BLD","BuildCo","🏗️",51,.013],["OCS","OceanShip","🚢",17,.022],["GVS","GameVerse","🎮",97,.027],["PTR","PetroMax","🛢️",64,.024],["LUX","LuxoGroup","👜",310,.016]];
const CRYPTO=[["BNV","BitNova","🟠",42000,.05],["ETR","Ethera","🔷",2600,.06],["SLC","SolarCoin","☀️",95,.08],["DGM","DogeMoon","🐶",.12,.12],["PXT","Pixel Token","👾",3.2,.1],["LNX","Lunex","🌙",14,.09],["RBT","RoboCash","🤖",0.8,.11]];
const CITIES=[["🇫🇷","Paris",1.2],["🇦🇪","Dubaï",1.1],["🇺🇸","New York",1.4],["🇲🇨","Monaco",2],["🇯🇵","Tokyo",1.15],["🇬🇧","Londres",1.3],["🇺🇸","Miami",1]];
const RTYPES=[["🏠","Studio",90000],["🏡","Appartement",320000],["🏘️","Maison",750000],["🏖️","Villa",3e6],["🏬","Local commercial",6e6],["🏢","Immeuble",18e6],["🌆","Gratte-ciel",250e6]];
const RUP=["🎨 Rénovation","🛋️ Meubles neufs","🏊 Piscine / terrasse","🔒 Sécurité & domotique","💎 Finitions de luxe"];
const ITEMS=[["🚗 Voitures",[["🚙","Citadine",15000],["🚘","Berline sport",90000],["🏎️","Supercar",350000],["🚀","Hypercar",2.5e6]]],
 ["✈️ Avions",[["🚁","Hélicoptère",2e6],["🛩️","Jet privé",30e6],["✈️","Jet long-courrier",200e6]]],
 ["🛥️ Yachts",[["🚤","Hors-bord",120000],["🛥️","Yacht",6e6],["🛳️","Méga-yacht",300e6]]],
 ["🖼️ Tableaux",[["🖼️","Tableau moderne",250000],["🎨","Tableau de maître",8e6],["🖌️","Chef-d'œuvre",90e6]]],
 ["🪙 Pièces rares",[["🪙","Pièce antique",15000],["🥇","Pièce d'or rarissime",600000],["🏺","Trésor de pièces",7e6]]],
 ["📮 Timbres",[["📮","Timbre rare",8000],["✉️","Timbre inversé",450000],["📜","Collection royale",5e6]]],
 ["💎 Bijoux",[["⌚","Montre de luxe",12000],["💍","Bague en diamant",80000],["👑","Collier royal",1.5e6],["💎","Diamant rose",25e6]]],
 ["🖼️ NFT",[["👾","NFT pixel",3000],["🐵","NFT singe rare",400000],["🌌","NFT légendaire",12e6]]],
 ["🏝️ Îles",[["🏝️","Petite île",15e6],["🌴","Île tropicale",250e6],["🗺️","Archipel privé",2e9]]]];
const RICH=[["Victor Ardent",420e9],["Amelia Strand",310e9],["Kenzo Hart",240e9],["Sofia Marlowe",180e9],["Liam Okoro",120e9],["Nora Velasquez",75e9],["Hugo Lenoir",40e9],["Maya Chen-Ruiz",18e9],["Oscar Blum",6e9],["Inès Fabre",1.5e9],["Tom Keller",400e6],["Léa Dumont",80e6],["Sam Rivera",12e6],["Jade Moreau",1.5e6],["Paul Girard",200000]];
const TAX=.1; // taxe de vente sur business et immobilier

/* ================= ÉTAT ================= */
const KEY="empire_mil2";
function step(o,list){ list.forEach(([k,,,,vol])=>{ const a=o[k]; const r=.0006+vol*gauss()+(E&&E.mktT>0?E.mkt*vol*2:0); a.p=Math.max(list===CRYPTO?.0001:.5,a.p*(1+r)); a.h.push(a.p); if(a.h.length>60) a.h.shift(); }); }
let E=null;
function fresh(){ const st={}, cr={}; STOCKS.forEach(s=>st[s[0]]={p:s[3],h:[s[3]],q:0,avg:0}); CRYPTO.forEach(s=>cr[s[0]]={p:s[3],h:[s[3]],q:0,avg:0});
  const re={}; CITIES.forEach((c,ci)=>RTYPES.forEach((t,ti)=>re[ci+"-"+ti]={v:Math.round(t[2]*c[2]*rnd(.92,1.08)),own:0,u:0}));
  const e={cash:300,day:1,age:22,cl:0,taps:0,tapE:0,bizE:0,invE:0,biz:[],merged:{},st,cr,re,items:{},sav:0,loan:0,hist:[300],spd:1,ts:Date.now(),log:[],best:300,boost:0,bcd:0,oil:80,mkt:0,mktT:0,inf:0,uid:1,market:[]};
  return e; }
try{ E=JSON.parse(localStorage.getItem(KEY)||"null"); }catch{}
if(!E){ E=fresh(); for(let i=0;i<45;i++){ step(E.st,STOCKS); step(E.cr,CRYPTO); } }
function save(){ E.ts=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(E)); }catch{} }

/* ================= CALCULS ================= */
const T=b=>BT[b.t];
const mergeBonus=t=>{ let m=1; MERGE.forEach((g,i)=>{ if(E.merged[i]&&g[2].includes(t)) m+=g[4]; }); return m; };
function bEst(b){ const t=T(b); let v=0;
  if(t.mode==="out") v=t.base+b.out*t.oi;
  else if(t.mode==="fleet") b.veh.forEach(x=>{ const V=t.veh[x.k]; if(x.w<V[4]) v+=V[3]; });
  else if(t.mode==="btp") v=-b.wk*60+(b.jobs.reduce((a,j)=>a+j.pay/j.d0,0));
  else if(t.mode==="it") v=-b.dev*450+(b.jobs.reduce((a,j)=>a+j.pay/j.d0,0));
  else if(t.mode==="pas") v=t.cost*t.r*Math.pow(1.25,b.lvl-1)*(t.oil?E.oil/80:1);
  return v*mergeBonus(b.t); }
function bValue(b){ const t=T(b); let v=t.cost; if(t.mode==="out") v+=b.out*t.oc*1.3; if(t.mode==="fleet") b.veh.forEach(x=>{ const V=t.veh[x.k]; v+=V[2]*Math.max(.1,1-x.w/V[4]); }); if(t.mode==="pas") v*=1+(b.lvl-1)*.3; if(t.mode==="car") b.stock.forEach(c=>v+=c.paid); return v; }
const rent=id=>{ const r=E.re[id]; return r.v*.0011*(1+r.u*.15); };
function itemsVal(){ let v=0; ITEMS.forEach(([,l],g)=>l.forEach((x,i)=>{ if(E.items[g+"-"+i]) v+=x[2]*.6; })); return v; }
function netWorth(){ let n=E.cash+E.sav-E.loan; E.biz.forEach(b=>n+=bValue(b)*(1-TAX)); STOCKS.forEach(s=>n+=E.st[s[0]].q*E.st[s[0]].p); CRYPTO.forEach(s=>n+=E.cr[s[0]].q*E.cr[s[0]].p); for(const id in E.re) if(E.re[id].own) n+=E.re[id].v*(1-TAX); return n+itemsVal(); }
function dailyIncome(){ let n=0; E.biz.forEach(b=>n+=bEst(b)); for(const id in E.re) if(E.re[id].own) n+=rent(id); return n+E.sav*.0004-E.loan*.0008; }
const clickVal=()=>CLICK[E.cl]*(E.boost>0?6.49:1);

/* ================= TEMPS ================= */
function tick(silent){ E.day++; if(E.day%120===0) E.age++; if(E.mktT>0) E.mktT--;
  E.oil=Math.max(25,Math.min(190,E.oil*(1+.03*gauss())));
  let tot=0;
  E.biz.forEach(b=>{ const t=T(b); let v=0;
    if(t.mode==="out"){ v=(t.base+b.out*t.oi)*(1+.1*gauss()); if(b.bq>0){ b.bl--; if(b.bl<=0){ b.out++; b.bq--; b.bl=b.bq>0?t.od:0; if(!silent) logEv(`🏗️ ${b.name} : nouvelle ${t.mode==="out"&&b.t==="fac"?"ligne de production":"boutique"} ouverte !`); } } }
    else if(t.mode==="fleet"){ b.veh.forEach(x=>{ const V=t.veh[x.k]; if(x.w<V[4]){ v+=V[3]*(1+.15*gauss()); x.w++; if(x.w>=V[4]&&!silent) logEv(`🔧 ${b.name} : un(e) ${V[1]} est usé(e), remplace-le !`); } }); }
    else if(t.mode==="btp"||t.mode==="it"){ v-=t.mode==="btp"?b.wk*60:b.dev*450; b.jobs=b.jobs.filter(j=>{ j.d--; if(j.d<=0){ v+=j.pay; b.done++; if(!silent) logEv(`✅ ${b.name} : « ${j.n} » terminé, +${fmt(j.pay)}`); return false; } return true; }); if(E.day%4===0||!b.offers.length) b.offers=genJobs(b); }
    else if(t.mode==="pas"){ v=t.cost*t.r*Math.pow(1.25,b.lvl-1)*(t.oil?E.oil/80:1)*(1+gauss()*t.risk*.5); if(b.t==="foot"&&Math.random()<.01){ v+=t.cost*.02; if(!silent) logEv(`🏆 ${b.name} remporte un trophée ! Bonus de sponsors`); } }
    v*=mergeBonus(b.t); b.last=v; tot+=v; });
  let rents=0; for(const id in E.re){ const r=E.re[id]; r.v*=1+.0003+.006*gauss()+(E.mktT>0?E.mkt*.004:0); if(r.own) rents+=rent(id); }
  if(E.day%2===0) refreshMarket();
  E.sav*=1.0004; const li=E.loan*.0008; E.cash+=tot+rents-li; E.bizE+=tot; E.invE+=rents;
  step(E.st,STOCKS); step(E.cr,CRYPTO);
  if(E.day%30===0){ let dv=0; STOCKS.forEach(s=>dv+=E.st[s[0]].q*E.st[s[0]].p*.004); if(dv>0){ E.cash+=dv; E.invE+=dv; if(!silent) logEv(`💵 Dividendes : +${fmt(dv)}`); } }
  if(!silent&&Math.random()<.03) randomEvent();
  if(E.inf) E.cash=Math.max(E.cash,1e15);
  const nw=netWorth(); E.hist.push(nw); if(E.hist.length>120) E.hist.shift(); E.best=Math.max(E.best,nw);
}

function bizPop(k,keep){ const b=E.biz[k], t=T(b); curBiz=k; let body="";
  const row=(ti,d,btn)=>`<div class="item"><div class="grow"><div class="t">${ti}</div><div class="d">${d}</div></div>${btn}</div>`;
  if(t.mode==="out"){ const c=Math.round(t.oc*Math.pow(1.22,b.out+b.bq)), nm=b.t==="fac"?"ligne de production":"boutique";
    body=`<div class="kpi"><div><span>${b.t==="fac"?"Lignes":"Boutiques"}</span><b>${b.out+1}</b></div><div><span>Revenu garanti / j</span><b class="up">${fmt(bEst(b))}</b></div></div>
    ${b.bq>0?`<div class="card" style="margin-top:10px">🏗️ ${b.bq} ${nm}(s) en construction · prochaine dans <b>${b.bl} j</b></div>`:""}
    ${row(`➕ Ouvrir une ${nm}`,`+${fmt(t.oi*mergeBonus(b.t))}/jour · ${t.od} jours de travaux`,`<button class="btn" id="ex" ${E.cash<c||b.out+b.bq>=t.max?"disabled":""}>${fmt(c)}</button>`)}`; }
  else if(t.mode==="fleet"){ const used=b.veh.length, gc=n=>Math.round(t.veh[0][2]*n*.6*(1+b.gar/40)*(n===20?1.15:n===10?1.05:1));
    body=`<div class="kpi"><div><span>Garage</span><b>${used}/${b.gar}</b></div><div><span>Revenu / jour</span><b class="up">${fmt(bEst(b))}</b></div></div><h2>Acheter un véhicule</h2>
    ${t.veh.map((V,i)=>row(`${V[0]} ${V[1]}`,`+${fmt(V[3])}/j · dure ${V[4]} jours`,`<button class="btn" data-bv="${i}" ${E.cash<V[2]||used>=b.gar?"disabled":""}>${fmt(V[2])}</button>`)).join("")}
    <h2>Agrandir le garage</h2><div class="qty">${[5,10,20].map(n=>`<button data-gr="${n}">+${n} places · ${fmt(gc(n))}</button>`).join("")}</div>
    ${b.veh.length?`<h2>Ta flotte</h2>`+b.veh.map((x,i)=>{ const V=t.veh[x.k], w=x.w/V[4]; return row(`${V[0]} ${V[1]} ${w>=1?'<span class="tag h">Usé</span>':""}`,`<div class="bar" style="margin-top:4px;width:140px"><i style="width:${(1-Math.min(1,w))*100}%;background:${w>.8?"#ef4444":"#22c55e"}"></i></div>`,`<button class="btn ${w>=1?"o":"gh"}" data-rv="${i}">${w>=1?"Remplacer "+fmt(V[2]*.9):"Vendre "+fmt(V[2]*(1-w)*.7)}</button>`); }).join(""):""}`; }
  else if(t.mode==="btp"||t.mode==="it"){ const it=t.mode==="it", staff=it?b.dev:b.wk, busy=b.jobs.reduce((a,j)=>a+j.w,0), hire=it?8000:1200;
    body=`<div class="kpi"><div><span>${it?"👨‍💻 Développeurs":"👷 Ouvriers"}</span><b>${staff} (${staff-busy} libres)</b></div><div><span>Salaires / jour</span><b class="dn">-${fmt(staff*(it?450:60))}</b></div>${it?"":`<div><span>🧱 Matériaux</span><b>${b.mat}</b></div>`}<div><span>Projets finis</span><b>${b.done}</b></div></div>
    <div class="qty">${[1,5,20].map(n=>`<button data-hi="${n}">+${n} ${it?"dev":"ouvrier"}${n>1?"s":""} · ${fmt(hire*n)}</button>`).join("")}${staff-busy>0?`<button data-fi="1">Licencier 1</button>`:""}</div>
    ${it?"":`<div class="qty">${[10,50,200].map(n=>`<button data-mt="${n}">+${n} matériaux · ${fmt(500*n)}</button>`).join("")}</div>`}
    ${b.jobs.length?`<h2>En cours</h2>`+b.jobs.map(j=>row(`🔨 ${j.n}`,`<div class="bar" style="margin-top:4px;width:150px"><i style="width:${(1-j.d/j.d0)*100}%"></i></div>${j.d} j restants`,`<b class="up">${fmt(j.pay)}</b>`)).join(""):""}
    <h2>Projets disponibles</h2>${b.offers.map((j,i)=>row(j.n,`👥 ${j.w} ${it?"devs":"ouvriers"}${it?"":` · 🧱 ${j.m}`} · ⏱ ${j.d} j`,`<button class="btn g" data-jb="${i}" ${staff-busy<j.w||(!it&&b.mat<j.m)?"disabled":""}>${fmt(j.pay)}</button>`)).join("")}
    <p class="hint">De nouveaux projets arrivent tous les 4 jours. ${it?"Sans projet, tu paies quand même les salaires !":""}</p>`; }
  else if(t.mode==="car"){ const err=Math.max(4,32-b.skill*3);
    body=`<div class="kpi"><div><span>🔧 Niveau de réparation</span><b>${b.skill}/10</b></div><div><span>Showroom</span><b>${b.stock.length}/${b.slots}</b></div></div>
    <div class="qty"><button id="sl">+1 place showroom · ${fmt(15000*b.slots)}</button></div>
    ${b.stock.length?`<h2>Ton showroom</h2>`+b.stock.map((c,i)=>{ const sp=Math.round(c.base*(.3+.75*c.cond/100)), rc=Math.round((100-c.cond)*c.base*.009*(1-b.skill*.05)); return row(`🚗 ${c.n}`,`État ${c.cond} % · payé ${fmt(c.paid)}`,`<div style="display:flex;flex-direction:column;gap:4px">${c.cond<100?`<button class="btn" data-rp="${i}" ${E.cash<rc?"disabled":""}>Réparer ${fmt(rc)}</button>`:""}<button class="btn g" data-sc="${i}">Vendre ${fmt(sp)}</button></div>`); }).join(""):""}
    <h2>Marché de l'occasion</h2>${E.market.map((c,i)=>{ const lo=Math.max(0,c.cond-err), hi=Math.min(100,c.cond+err); return row(`🚙 ${c.n}`,`État ${c.insp?`<b>${c.cond} %</b>`:`estimé ${lo}–${hi} %`}`,`<div style="display:flex;flex-direction:column;gap:4px"><button class="btn g" data-bc="${i}" ${E.cash<c.price||b.stock.length>=b.slots?"disabled":""}>${fmt(c.price)}</button>${c.insp?"":`<button class="btn gh" data-in="${i}">🔍 Inspecter ${fmt(c.base*.01)}</button>`}</div>`); }).join("")}
    <p class="hint">Les voitures en mauvais état coûtent cher à réparer : inspecte-les avant d'acheter ! Plus tu répares, plus ton niveau monte (réparations moins chères, meilleures estimations).</p>`; }
  else { const uc=t.cost*.35*Math.pow(1.4,b.lvl-1);
    body=`<div class="kpi"><div><span>Niveau</span><b>${b.lvl}/10</b></div><div><span>Revenu moyen / j</span><b class="up">${fmt(bEst(b))}</b></div>${t.oil?`<div><span>🛢️ Prix du baril</span><b>${E.oil.toFixed(1).replace(".",",")} $</b></div>`:""}</div>
    ${row("⬆️ Agrandir","+25 % de revenus",`<button class="btn" id="up" ${b.lvl>=10||E.cash<uc?"disabled":""}>${b.lvl>=10?"MAX":fmt(uc)}</button>`)}`; }
  popup(`<div class="row"><div class="ic" style="width:60px;height:60px;font-size:34px">${t.ic}</div><div class="grow"><h3>${esc(b.name)}</h3><div class="hint">${t.n} · hier <span class="${b.last>=0?"up":"dn"}">${b.last>=0?"+":""}${fmt(b.last)}</span>${mergeBonus(b.t)>1?` · <span class="tag b">Fusion +${Math.round((mergeBonus(b.t)-1)*100)} %</span>`:""}</div></div></div><div style="margin-top:12px">${body}</div>
  <div class="row" style="margin-top:14px;gap:6px;flex-wrap:wrap"><button class="btn gh" id="rn">✏️ Renommer (${fmt(Math.max(1000,t.cost*.02))})</button><button class="btn r" id="sb">Vendre ${fmt(bValue(b)*(1-TAX))}</button><span class="grow"></span><button class="btn gh" id="x">Fermer</button></div>`,()=>{
    const re=()=>{ save(); head(); bizPop(k,true); }, on=(sel,fn)=>document.querySelectorAll(sel).forEach(e=>e.onclick=()=>fn(e.dataset));
    if($("ex")) $("ex").onclick=()=>{ const c=Math.round(t.oc*Math.pow(1.22,b.out+b.bq)); if(!pay(c)) return; if(b.bq===0) b.bl=t.od; b.bq++; toast("🏗️ Travaux lancés"); re(); };
    on("[data-bv]",d=>{ const V=t.veh[+d.bv]; if(b.veh.length>=b.gar||!pay(V[2])) return; b.veh.push({k:+d.bv,w:0}); toast(`${V[0]} ${V[1]} acheté`); re(); });
    on("[data-gr]",d=>{ const n=+d.gr, c=Math.round(t.veh[0][2]*n*.6*(1+b.gar/40)*(n===20?1.15:n===10?1.05:1)); if(!pay(c)) return; b.gar+=n; toast(`Garage +${n}`); re(); });
    on("[data-rv]",d=>{ const x=b.veh[+d.rv], V=t.veh[x.k]; if(x.w>=V[4]){ if(!pay(V[2]*.9)) return; x.w=0; toast("Véhicule remplacé 🔧"); } else { E.cash+=V[2]*(1-x.w/V[4])*.7; b.veh.splice(+d.rv,1); toast("Véhicule vendu"); } re(); });
    on("[data-hi]",d=>{ const n=+d.hi, c=(t.mode==="it"?8000:1200)*n; if(!pay(c)) return; if(t.mode==="it") b.dev+=n; else b.wk+=n; re(); });
    on("[data-fi]",()=>{ if(t.mode==="it") b.dev--; else b.wk--; re(); });
    on("[data-mt]",d=>{ const n=+d.mt; if(!pay(500*n)) return; b.mat+=n; re(); });
    on("[data-jb]",d=>{ const j=b.offers[+d.jb], staff=t.mode==="it"?b.dev:b.wk, busy=b.jobs.reduce((a,x)=>a+x.w,0); if(staff-busy<j.w||(t.mode==="btp"&&b.mat<j.m)) return; if(t.mode==="btp") b.mat-=j.m; b.jobs.push({...j}); b.offers.splice(+d.jb,1); toast(`🔨 Projet lancé : ${j.n}`); re(); });
    if($("sl")) $("sl").onclick=()=>{ if(!pay(15000*b.slots)) return; b.slots++; re(); };
    on("[data-in]",d=>{ const c=E.market[+d.in]; if(!pay(c.base*.01)) return; c.insp=1; re(); });
    on("[data-bc]",d=>{ const c=E.market[+d.bc]; if(b.stock.length>=b.slots||!pay(c.price)) return; b.stock.push({n:c.n,base:c.base,cond:c.cond,paid:c.price}); E.market.splice(+d.bc,1); toast(`🚗 ${c.n} acheté (état réel ${c.cond} %)`); re(); });
    on("[data-rp]",d=>{ const c=b.stock[+d.rp], rc=Math.round((100-c.cond)*c.base*.009*(1-b.skill*.05)); if(!pay(rc)) return; c.paid+=rc; c.cond=100; b.xp++; if(b.xp>=3&&b.skill<10){ b.skill++; b.xp=0; toast(`🔧 Niveau de réparation ${b.skill} !`); } re(); });
    on("[data-sc]",d=>{ const c=b.stock[+d.sc], sp=Math.round(c.base*(.3+.75*c.cond/100)); E.cash+=sp; b.last=sp-c.paid; E.bizE+=sp-c.paid; b.stock.splice(+d.sc,1); toast(`${sp>=c.paid?"💰 Bénéfice":"📉 Perte"} : ${fmt(sp-c.paid)}`); re(); });
    if($("up")) $("up").onclick=()=>{ const uc=t.cost*.35*Math.pow(1.4,b.lvl-1); if(b.lvl>=10||!pay(uc)) return; b.lvl++; toast("⬆️ Niveau "+b.lvl); re(); };
    $("rn").onclick=()=>{ const n=prompt("Nouveau nom :",b.name); if(!n||!n.trim()) return; if(!pay(Math.max(1000,t.cost*.02))) return; b.name=n.trim().slice(0,24); re(); };
    $("sb").onclick=()=>{ if(!$("sb").dataset.k){ $("sb").dataset.k=1; $("sb").textContent="Confirmer la vente ?"; return; } E.cash+=bValue(b)*(1-TAX); E.biz.splice(k,1); save(); toast("Business vendu"); closePop(); };
    $("x").onclick=closePop; },keep); }

/* ---------- OBJETS ---------- */
function items(){ let n=0; ITEMS.forEach(([,l],g)=>l.forEach((x,i)=>{ if(E.items[g+"-"+i]) n++; }));
  $("main").innerHTML=`<div class="card"><div class="row"><div class="grow"><div class="hint">Ta collection</div><div style="font-size:24px;font-weight:900">${n} objet(s)</div></div><div style="text-align:right"><div class="hint">Valeur de revente (60 %)</div><b>${fmt(itemsVal())}</b></div></div><p class="hint" style="margin:6px 0 0">Les objets de luxe ne rapportent rien : ils montrent juste que tu es riche 😎</p></div>
  ${ITEMS.map(([g,l],gi)=>`<h2>${g}</h2><div class="lux">${l.map((x,i)=>{ const id=gi+"-"+i, own=E.items[id]; return `<div class="x ${own?"own":""}"><div class="e">${x[0]}</div><b>${x[1]}</b>${own?`<button class="btn gh" data-ls="${id}" style="margin-top:8px;width:100%">Revendre ${fmt(x[2]*.6)}</button>`:`<button class="btn o" data-lb="${id}" style="margin-top:8px;width:100%" ${E.cash<x[2]?"disabled":""}>${fmt(x[2])}</button>`}</div>`; }).join("")}</div>`).join("")}`;
  const get=id=>{ const [g,i]=id.split("-").map(Number); return ITEMS[g][1][i]; };
  document.querySelectorAll("[data-lb]").forEach(b=>b.onclick=()=>{ const x=get(b.dataset.lb); if(!pay(x[2])) return; E.items[b.dataset.lb]=1; save(); toast(`${x[0]} ${x[1]} acheté !`); items(); });
  document.querySelectorAll("[data-ls]").forEach(b=>b.onclick=()=>{ const x=get(b.dataset.ls); E.cash+=x[2]*.6; delete E.items[b.dataset.ls]; save(); toast("Revendu"); items(); });
}

/* ---------- PROFIL ---------- */
function prof(){ const nw=netWorth(); let st=0,cr=0,re=0,nre=0; STOCKS.forEach(s=>st+=E.st[s[0]].q*E.st[s[0]].p); CRYPTO.forEach(s=>cr+=E.cr[s[0]].q*E.cr[s[0]].p); for(const id in E.re) if(E.re[id].own){ re+=E.re[id].v; nre++; }
  const bz=E.biz.reduce((a,b)=>a+bValue(b),0), parts=[["💵 Liquide",Math.max(0,E.cash)+E.sav,"#22c55e"],["🏪 Business",bz,"#6366f1"],["📈 Actions",st,"#38bdf8"],["🪙 Crypto",cr,"#f59e0b"],["🏢 Immobilier",re,"#ec4899"],["💎 Objets",itemsVal(),"#a78bfa"]], tot=parts.reduce((a,p)=>a+p[1],0)||1;
  const list=RICH.concat([["⭐ TOI",nw]]).sort((a,b)=>b[1]-a[1]), rank=list.findIndex(r=>r[0]==="⭐ TOI")+1;
  $("main").innerHTML=`<div class="card" style="text-align:center"><div style="font-size:48px">🧑‍💼</div><b style="font-size:20px">Entrepreneur · ${E.age} ans</b><div class="hint">Jour ${E.day} · record de fortune ${fmt(E.best)}</div></div>
  <h2>Répartition de ta fortune</h2><div class="card"><div style="display:flex;height:16px;border-radius:9px;overflow:hidden;margin-bottom:10px">${parts.map(p=>`<i style="width:${p[1]/tot*100}%;background:${p[2]}"></i>`).join("")}</div>${parts.map(p=>`<div class="row" style="padding:4px 0"><span class="grow">${p[0]}</span><b>${fmt(p[1])}</b><span class="hint" style="width:52px;text-align:right">${Math.round(p[1]/tot*100)} %</span></div>`).join("")}</div>
  <h2>Statistiques</h2><div class="card kpi"><div><span>Gagné en cliquant</span><b>${fmt(E.tapE)}</b></div><div><span>Clics</span><b>${E.taps.toLocaleString("fr-FR")}</b></div><div><span>Gagné par les business</span><b>${fmt(E.bizE)}</b></div><div><span>Gagné en investissant</span><b>${fmt(E.invE)}</b></div><div><span>Business</span><b>${E.biz.length}</b></div><div><span>Biens immobiliers</span><b>${nre}</b></div></div>
  <h2>🏆 Classement des plus riches</h2><div class="card">${list.map((r,i)=>`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line);${r[0]==="⭐ TOI"?"color:#fbbf24;font-weight:900":""}"><b style="width:34px">#${i+1}</b><span class="grow">${r[0]}</span><b>${fmt(r[1])}</b></div>`).join("")}</div>
  <h2>📰 Historique</h2><div class="card ev">${E.log.map(l=>`<div class="hint" style="padding:3px 0">${l}</div>`).join("")||'<div class="hint">Rien pour l’instant.</div>'}</div>`; }

/* ---------- VITESSE + PANEL ADMIN ---------- */
$("spd").onclick=()=>{ E.spd=E.spd===1?2:E.spd===2?5:E.spd===5?20:1; save(); head(); toast(`Vitesse x${E.spd}`); };
function admin(){ const S=(t,h)=>`<h2 style="margin-top:18px">${t}</h2><div class="qty">${h}</div>`;
  popup(`<h3>🛠️ Panel admin</h3><p class="hint">Fais défiler vers le bas pour tout voir ↓</p>
  ${S("💶 Argent",[1e3,1e5,1e6,1e9,1e12].map(v=>`<button data-am="${v}">+${fmt(v)}</button>`).join("")+`<button id="inf">${E.inf?"✅":"⬜"} Argent infini</button>`)}
  <div class="row" style="gap:6px;flex-wrap:wrap"><input class="in" id="amv" type="number" placeholder="Montant"><button class="btn" id="amg">Donner</button><button class="btn gh" id="ams">Mettre exactement</button></div>
  ${S("🏪 Business",`<button id="gb">🎁 Me donner TOUS les business</button><button id="mb">⬆️ Tout au maximum</button><button id="fb">⏩ Finir travaux & projets</button><button id="mg">🤝 Débloquer toutes les fusions</button>`)}
  ${S("📈 Investissements",`<button id="gs">+1 000 de chaque action</button><button id="gc">+10 de chaque crypto</button><button id="bm">📈 BOOM</button><button id="kr">📉 KRACH</button><button id="ol">🛢️ Pétrole x2</button>`)}
  ${S("🏢 Immobilier & objets",`<button id="gr">🔑 Tous les biens immobiliers</button><button id="ur">⭐ Améliorer tous mes biens</button><button id="gi">💎 Tous les objets de luxe</button>`)}
  ${S("💰 Clic",`<button id="cm">Clic niveau max</button><button id="cb">⚡ Boost x6,49 (5 min)</button>`)}
  ${S("⏱ Temps",`<button data-sk="1">+1 jour</button><button data-sk="30">+30 jours</button><button data-sk="365">+1 an</button><button id="ag">🎂 -5 ans (plus jeune)</button>`)}
  <div class="row" style="margin-top:16px"><button class="btn r" id="rs">Tout réinitialiser</button><span class="grow"></span><button class="btn gh" id="x">Fermer</button></div>`,()=>{
  const ok=t=>{ save(); head(); toast(t); };
  document.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{ E.cash+=+b.dataset.am; ok("+"+fmt(+b.dataset.am)); });
  $("inf").onclick=()=>{ E.inf=!E.inf; if(E.inf) E.cash=Math.max(E.cash,1e15); ok(E.inf?"♾️ Argent infini activé":"Argent infini désactivé"); admin(); };
  $("amg").onclick=()=>{ const v=+$("amv").value||0; if(v){ E.cash+=v; ok("+"+fmt(v)); } };
  $("ams").onclick=()=>{ const v=+$("amv").value; if(!isNaN(v)&&$("amv").value!==""){ E.cash=v; ok("Argent = "+fmt(v)); } };
  $("gb").onclick=()=>{ Object.keys(BT).forEach(k=>{ if(!E.biz.some(b=>b.t===k)){ const b=newBiz(k); b.name=BT[k].n+" Admin"; if(b.offers) b.offers=genJobs(b); E.biz.push(b); } }); if(!E.market.length) refreshMarket(); ok("🎁 Tous les business ajoutés"); };
  $("mb").onclick=()=>{ E.biz.forEach(b=>{ const t=T(b); if(t.mode==="out"){ b.out=t.max; b.bq=0; } if(t.mode==="fleet"){ b.gar=Math.max(b.gar,30); while(b.veh.length<b.gar) b.veh.push({k:t.veh.length-1,w:0}); b.veh.forEach(x=>{ x.k=t.veh.length-1; x.w=0; }); } if(t.mode==="btp"){ b.wk+=500; b.mat+=5000; } if(t.mode==="it") b.dev+=300; if(t.mode==="car"){ b.skill=10; b.slots=Math.max(b.slots,15); } if(t.mode==="pas") b.lvl=10; }); ok("⬆️ Tout au maximum"); };
  $("fb").onclick=()=>{ E.biz.forEach(b=>{ if(b.bq>0){ b.out+=b.bq; b.bq=0; } if(b.jobs){ b.jobs.forEach(j=>{ E.cash+=j.pay; }); b.jobs=[]; } }); ok("⏩ Tout est terminé"); };
  $("mg").onclick=()=>{ MERGE.forEach((g,i)=>E.merged[i]=1); ok("🤝 Toutes les fusions"); };
  $("gs").onclick=()=>{ STOCKS.forEach(s=>{ const a=E.st[s[0]]; a.avg=(a.avg*a.q+1000*a.p)/(a.q+1000); a.q+=1000; }); ok("+1 000 de chaque action"); };
  $("gc").onclick=()=>{ CRYPTO.forEach(s=>{ const a=E.cr[s[0]]; a.avg=(a.avg*a.q+10*a.p)/(a.q+10); a.q+=10; }); ok("+10 de chaque crypto"); };
  $("bm").onclick=()=>{ E.mkt=.6; E.mktT=8; ok("📈 BOOM lancé"); };
  $("kr").onclick=()=>{ E.mkt=-.8; E.mktT=6; ok("📉 KRACH lancé"); };
  $("ol").onclick=()=>{ E.oil=Math.min(190,E.oil*2); ok("🛢️ Pétrole x2"); };
  $("gr").onclick=()=>{ for(const id in E.re) E.re[id].own=1; ok("🔑 Tout l'immobilier est à toi"); };
  $("ur").onclick=()=>{ for(const id in E.re) if(E.re[id].own) E.re[id].u=5; ok("⭐ Biens améliorés au max"); };
  $("gi").onclick=()=>{ ITEMS.forEach(([,l],g)=>l.forEach((x,i)=>E.items[g+"-"+i]=1)); ok("💎 Tous les objets"); };
  $("cm").onclick=()=>{ E.cl=CLICK.length-1; ok("💰 Clic au max"); };
  $("cb").onclick=()=>{ E.boost=300; ok("⚡ Boost 5 min"); };
  document.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.sk; for(let i=0;i<n;i++) tick(n>1); ok(`+${n} jour(s)`); });
  $("ag").onclick=()=>{ E.age=Math.max(18,E.age-5); ok("🎂 Plus jeune de 5 ans"); };
  $("rs").onclick=()=>{ if(!$("rs").dataset.k){ $("rs").dataset.k=1; $("rs").textContent="Appuie encore pour confirmer"; return; } try{ localStorage.removeItem(KEY); }catch{} location.reload(); };
  $("x").onclick=closePop; }); }
$("adm").onclick=admin;

/* ---------- DÉMARRAGE ---------- */
if(!E.market.length) refreshMarket();
const away=Math.min(400,Math.floor((Date.now()-(E.ts||Date.now()))/4000));
if(away>=3){ const c0=E.cash; for(let i=0;i<away;i++) tick(1); save(); setTimeout(()=>popup(`<h3>👋 Bon retour !</h3><p>Pendant ton absence, <b>${away} jours</b> sont passés.</p><p style="font-size:22px;font-weight:900" class="${E.cash>=c0?"up":"dn"}">${E.cash>=c0?"+":""}${fmt(E.cash-c0)}</p><button class="btn g" id="x" style="width:100%">Super !</button>`,()=>{ $("x").onclick=closePop; }),300); }
else if(E.day===1&&!E.taps) setTimeout(()=>popup(`<h3>💼 Bienvenue dans EMPIRE MILLIONNAIRE</h3><p>Tu commences avec <b>300 €</b>. Ton but : devenir <b>la personne la plus riche du monde</b>.</p><p class="hint">1️⃣ Touche l'écran pour gagner de l'argent et monte le niveau de ton clic.<br>2️⃣ Crée ton premier business : un magasin à 5 000 €.<br>3️⃣ Investis dans les actions, l'immobilier et la crypto.<br>4️⃣ Fusionne tes entreprises pour créer des empires.<br>5️⃣ Achète voitures, jets, yachts, tableaux et îles.<br><br>1 jour = 4 secondes, même jeu fermé. Le panel 🛠️ est en haut à droite.</p><button class="btn g" id="x" style="width:100%">C'est parti !</button>`,()=>{ $("x").onclick=closePop; }),300);
draw(); startClock();
window.__E=E;
})();
