  else if(t.mode==="pas") v=t.cost*t.r*Math.pow(1.25,b.lvl-1)*(t.oil?E.oil/80:1);
  if(b.t==="foot"){ v*=1+(clubRating(b)-68)/22; v-=(b.squad||[]).reduce((x,i)=>x+fSal(FOOTP[i][2]),0); }
  return v*mergeBonus(b.t); }
function bValue(b){ const t=T(b); let v=t.cost; if(t.mode==="out") v+=b.out*t.oc*1.3; if(t.mode==="fleet") b.veh.forEach(x=>{ const V=t.veh[x.k]; v+=V[2]*Math.max(.1,1-x.w/V[4]); }); if(t.mode==="pas") v*=1+(b.lvl-1)*.3; if(t.mode==="car") b.stock.forEach(c=>v+=c.paid); return v; }
const rent=id=>{ const r=E.re[id]; return r.v*.0011*(1+r.u*.15); };
function itemsVal(){ let v=0; ITEMS.forEach(([,l],g)=>l.forEach((x,i)=>{ if(E.items[g+"-"+i]) v+=x[2]*.6; })); return v; }
function netWorth(){ let n=E.cash+E.sav-E.loan; E.biz.forEach(b=>n+=bValue(b)*(1-TAX)); STOCKS.forEach(s=>n+=E.st[s[0]].q*E.st[s[0]].p); CRYPTO.forEach(s=>n+=E.cr[s[0]].q*E.cr[s[0]].p); for(const id in E.re) if(E.re[id].own) n+=E.re[id].v*(1-TAX); if(E.ph){ if(E.ph.shop) n+=E.ph.shop.bal||0; COMP.forEach((c,i)=>{ if(E.ph.acq[i]) n+=c[2]*.85; }); PCS.forEach((p,i)=>n+=(E.ph.pcs[i]||0)*p[2]*.5); } return n+itemsVal(); }
function dailyIncome(){ let n=0; E.biz.forEach(b=>n+=bEst(b)); for(const id in E.re) if(E.re[id].own) n+=rent(id); return n+E.sav*.0004-E.loan*.0008+(E.ph?appsDaily():0); }
const ECO=()=>(E&&E.eco!=null?E.eco:.4); // difficulté : part des gains que tu touches vraiment (1 = facile, .4 = normal, .2 = difficile)
const clickVal=()=>CLICK[Math.min(E.cl,CLICK.length-1)]*(E.boost>0?6.49:1)*ECO();
const acCost=()=>Math.round(400*Math.pow(2.1,E.ac||0)), critCost=()=>Math.round(3000*Math.pow(3.2,E.crit||0));

/* ================= TEMPS ================= */
function tick(silent){ E.day++; if(E.day%120===0) E.age++; if(E.mktT>0) E.mktT--;
  E.oil=Math.max(25,Math.min(190,E.oil*(1+.03*gauss())));
  let tot=0;
  E.biz.forEach(b=>{ const t=T(b); let v=0;
    if(t.mode==="out"){ v=(t.base+b.out*t.oi)*(1+.1*gauss()); if(b.bq>0){ b.bl--; if(b.bl<=0){ b.out++; b.bq--; b.bl=b.bq>0?t.od:0; if(!silent) logEv(`🏗️ ${b.name} : nouvelle ${t.mode==="out"&&b.t==="fac"?"ligne de production":"boutique"} ouverte !`); } } }
    else if(t.mode==="fleet"){ b.veh.forEach(x=>{ const V=t.veh[x.k]; if(x.w<V[4]){ v+=V[3]*(1+.15*gauss()); x.w++; if(x.w>=V[4]&&!silent) logEv(`🔧 ${b.name} : un(e) ${V[1]} est usé(e), remplace-le !`); } }); }
    else if(t.mode==="btp"||t.mode==="it"){ v-=t.mode==="btp"?b.wk*60:b.dev*450; b.jobs=b.jobs.filter(j=>{ j.d--; if(j.d<=0){ v+=j.pay; b.done++; if(!silent) logEv(`✅ ${b.name} : « ${j.n} » terminé, +${fmt(j.pay)}`); return false; } return true; }); if(E.day%4===0||!b.offers.length) b.offers=genJobs(b); }
    else if(t.mode==="pas"){ v=t.cost*t.r*Math.pow(1.25,b.lvl-1)*(t.oil?E.oil/80:1)*(1+gauss()*t.risk*.5);
      if(b.t==="foot"){ b.squad=b.squad||[]; const cr=clubRating(b); v*=1+(cr-68)/22; v-=b.squad.reduce((a,i)=>a+fSal(FOOTP[i][2]),0);
        if(E.day%3===0){ const win=Math.random()<Math.max(.1,Math.min(.92,(cr-58)/42)); b.w=(b.w||0)+(win?1:0); b.mj=(b.mj||0)+1; if(win) v+=t.cost*.002; }
        if(E.day%30===0&&b.mj){ if(b.w/b.mj>=.7){ b.tro=(b.tro||0)+1; v+=t.cost*.04; if(!silent) logEv(`🏆 ${b.name} est CHAMPION ! (${b.w} victoires sur ${b.mj})`); } b.w=0; b.mj=0; } } if(b.t==="foot"&&Math.random()<.01){ v+=t.cost*.02; if(!silent) logEv(`🏆 ${b.name} remporte un trophée ! Bonus de sponsors`); } }
    v*=mergeBonus(b.t); b.last=v; tot+=v; });
  let rents=0; for(const id in E.re){ const r=E.re[id]; r.v*=1+.0003+.006*gauss()+(E.mktT>0?E.mkt*.004:0); if(r.own) rents+=rent(id); }
  if(E.day%2===0) refreshMarket();
  E.sav*=1.0004; const li=E.loan*.0008; const apn=appsTick(silent); E.cash+=tot+rents-li+apn; E.bizE+=tot; E.invE+=rents;
  step(E.st,STOCKS); step(E.cr,CRYPTO);
  if(E.day%30===0){ let dv=0; STOCKS.forEach(s=>dv+=E.st[s[0]].q*E.st[s[0]].p*.004); if(dv>0){ E.cash+=dv; E.invE+=dv; if(!silent) logEv(`💵 Dividendes : +${fmt(dv)}`); } }
  if(!silent&&Math.random()<.03) randomEvent();
  if(E.inf) E.cash=Math.max(E.cash,1e15);
  const nw=netWorth(); E.hist.push(nw); if(E.hist.length>120) E.hist.shift(); E.best=Math.max(E.best,nw);
}
function genJobs(b){ const it=T(b).mode==="it", L=it?ITJ:BTPJ, lvl=Math.min(L.length-1,Math.floor(Math.log10(Math.max(10,(it?b.dev:b.wk)*10+b.done*5)))*2+ri(0,2));
  return [0,1,2].map(()=>{ const k=Math.max(0,Math.min(L.length-1,lvl+ri(-2,1))), w=Math.round((it?2:3)*Math.pow(1.7,k)*rnd(.8,1.2)), m=it?0:Math.round(10*Math.pow(1.8,k)*rnd(.8,1.2)), d=ri(3,6)+k*2; const cost=it?w*450*d:w*60*d+m*500; return {n:L[k],w,m,d,d0:d,pay:Math.round(cost*rnd(1.6,2.3)+(it?5000:2000)*Math.pow(1.6,k))}; }); }
function refreshMarket(){ E.market=Array.from({length:6},()=>{ const [n,base]=CARS[Math.min(CARS.length-1,Math.floor(Math.pow(Math.random(),1.6)*CARS.length))], cond=ri(15,95); return {id:E.uid++,n,base,cond,price:Math.round(base*(.35+.5*cond/100)*rnd(.9,1.15)),insp:0}; }); }
function logEv(t){ E.log.unshift(`J${E.day} · ${t}`); E.log=E.log.slice(0,30); toast(t); }
function randomEvent(){ pick([
  ()=>{ E.mkt=.6; E.mktT=6; logEv("📈 BOOM sur les marchés ! Tout monte."); },
  ()=>{ E.mkt=-.8; E.mktT=5; logEv("📉 KRACH boursier ! Les marchés chutent."); },
  ()=>{ E.oil*=1.4; logEv("🛢️ Le prix du pétrole s'envole !"); },
  ()=>{ if(!E.biz.length) return; const b=pick(E.biz), l=Math.max(500,Math.abs(bEst(b))*ri(2,5)); E.cash-=l; logEv(`🔥 Incident chez ${b.name} : -${fmt(l)}`); },
  ()=>{ const t=Math.max(0,E.cash)*.03; if(t<50) return; E.cash-=t; logEv(`🧾 Contrôle fiscal : -${fmt(t)}`); },
  ()=>{ const g=Math.max(300,netWorth()*.004); E.cash+=g; logEv(`🎁 Héritage d'un oncle éloigné : +${fmt(g)}`); }])(); }

    <div class="qty">${[1,5,20].map(n=>`<button data-hi="${n}">+${n} ${it?"dev":"ouvrier"}${n>1?"s":""} · ${fmt(hire*n)}</button>`).join("")}${staff-busy>0?`<button data-fi="1">Licencier 1</button>`:""}</div>
    ${it?"":`<div class="qty">${[10,50,200].map(n=>`<button data-mt="${n}">+${n} matériaux · ${fmt(500*n)}</button>`).join("")}</div>`}
    ${b.jobs.length?`<h2>En cours</h2>`+b.jobs.map(j=>row(`🔨 ${j.n}`,`<div class="bar" style="margin-top:4px;width:150px"><i style="width:${(1-j.d/j.d0)*100}%"></i></div>${j.d} j restants`,`<b class="up">${fmt(j.pay)}</b>`)).join(""):""}
    <h2>Projets disponibles</h2>${b.offers.map((j,i)=>row(j.n,`👥 ${j.w} ${it?"devs":"ouvriers"}${it?"":` · 🧱 ${j.m}`} · ⏱ ${j.d} j`,`<button class="btn g" data-jb="${i}" ${staff-busy<j.w||(!it&&b.mat<j.m)?"disabled":""}>${fmt(j.pay)}</button>`)).join("")}

  else if(t.mode==="car"){ const err=Math.max(4,32-b.skill*3);
    body=`<div class="kpi"><div><span>🔧 Niveau de réparation</span><b>${b.skill}/10</b></div><div><span>Showroom</span><b>${b.stock.length}/${b.slots}</b></div></div>
    <div class="qty"><button id="sl">+1 place showroom · ${fmt(15000*b.slots)}</button></div>
    ${b.stock.length?`<h2>Ton showroom</h2>`+b.stock.map((c,i)=>{ const sp=Math.round(c.base*(.3+.75*c.cond/100)), rc=Math.round((100-c.cond)*c.base*.009*(1-b.skill*.05)); return row(`🚗 ${c.n}`,`État ${c.cond} % · payé ${fmt(c.paid)}`,`<div style="display:flex;flex-direction:column;gap:4px">${c.cond<100?`<button class="btn" data-rp="${i}" ${E.cash<rc?"disabled":""}>Réparer ${fmt(rc)}</button>`:""}<button class="btn g" data-sc="${i}">Vendre ${fmt(sp)}</button></div>`); }).join(""):""}
    <h2>Marché de l'occasion</h2>${E.market.map((c,i)=>{ const lo=Math.max(0,c.cond-err), hi=Math.min(100,c.cond+err); return row(`🚙 ${c.n}`,`État ${c.insp?`<b>${c.cond} %</b>`:`estimé ${lo}–${hi} %`}`,`<div style="display:flex;flex-direction:column;gap:4px"><button class="btn g" data-bc="${i}" ${E.cash<c.price||b.stock.length>=b.slots?"disabled":""}>${fmt(c.price)}</button>${c.insp?"":`<button class="btn gh" data-in="${i}">🔍 Inspecter ${fmt(c.base*.01)}</button>`}</div>`); }).join("")}

    <p class="hint">Les joueurs sont inventés (pas de vraies stars, c'est interdit d'utiliser leurs noms dans un jeu).</p>`; }

    ${row("⬆️ Agrandir","+25 % de revenus",`<button class="btn" id="up" ${b.lvl>=10||E.cash<uc?"disabled":""}>${b.lvl>=10?"MAX":fmt(uc)}</button>`)}`; }
  popup(`<div class="row"><div class="ic" style="width:60px;height:60px;font-size:34px">${t.ic}</div><div class="grow"><h3>${esc(b.name)}</h3><div class="hint">${t.n} · hier <span class="${b.last>=0?"up":"dn"}">${b.last>=0?"+":""}${fmt(b.last)}</span>${mergeBonus(b.t)>1?` · <span class="tag b">Fusion +${Math.round((mergeBonus(b.t)-1)*100)} %</span>`:""}</div></div></div><div style="margin-top:12px">${body}</div>

    const re=()=>{ save(); head(); bizPop(k,true); }, on=(sel,fn)=>document.querySelectorAll(sel).forEach(e=>e.onclick=()=>fn(e.dataset));

}

function shopDay(){ const s=E.ph.shop; if(!s) return 0; let adc=0; s.bal=s.bal||0; s.pend=s.pend||[];
  s.p.forEach(x=>{ const pr=PRODS[x.k], tr=s.tr[x.k]; const price=pr[3]*x.m*(s.brand?1.25:1), cost=pr[2]; const cpa=11*Math.pow(price/30,.7)/(tr*(s.rate/4)); let o=Math.floor(x.ads/cpa*rnd(.7,1.3)); o+=Math.floor((E.ph.vid.subs/4000)*tr*rnd(0,1)); if(Math.random()<.01*tr){ o*=8; logEv(`🔥 ${pr[1]} devient viral sur ta boutique !`); }
    adc+=x.ads; x.o=o; x.last=o*(price-cost-1.5)-x.ads; if(o>0) addOrders(x.k,o,price); });
  // commandes non expédiées depuis 3 jours : annulées
  const old=s.pend.filter(p=>E.day-p.d>3); if(old.length){ const n=old.reduce((a,p)=>a+p.n,0); s.pend=s.pend.filter(p=>E.day-p.d<=3); s.rate=Math.max(1.5,s.rate-.15); s.lost=(s.lost||0)+n; logEv(`😡 ${n} commandes annulées : pas expédiées à temps (note en baisse)`); }
  if(s.auto) shipAll(true);
  s.rate=Math.max(1.5,Math.min(5,s.rate+(s.p.some(x=>x.m<1.1)?-.02:.01)*rnd(0,1.5))); s.last=s.p.reduce((a,x)=>a+x.last,0); return -adc; }
function addOrders(k,n,price){ const s=E.ph.shop; s.pend.push({id:E.uid++,k,n,price,who:pick(SNAMES||["client"]),d:E.day}); s.orders+=n; if(s.pend.length>200){ const a=s.pend.shift(); s.pend[0].n+=a.n; } }
function shipAll(silent){ const s=E.ph.shop; if(!s||!s.pend.length) return 0; let g=0, n=0; s.pend.forEach(p=>{ const c=PRODS[p.k][2]; g+=p.n*(p.price-c-1.5)*ECO(); n+=p.n; }); s.pend=[]; s.bal+=g; s.shipped=(s.shipped||0)+n; s.rate=Math.min(5,s.rate+.03); if(!silent) toast(`📦 ${n.toLocaleString("fr-FR")} commandes expédiées : +${fmt(g)} sur ton solde boutique`); return g; }

function teamPower(){ const T=P().team||{}; let tiles=0, q=0, cost=0, n=0; TEAM.forEach((m,i)=>{ const k=T[i]||0; tiles+=k*m[4]; q+=k*m[5]; cost+=k*m[3]; n+=k; }); return {tiles,q,cost,n}; }
function teamWork(m,tiles){ const t=m.t.split(",").map(Number); let done=0;
  const miss=SPECIAL.filter(k=>!t.includes(k));
  const free=[]; t.forEach((v,i)=>{ if(v===0) free.push(i); });
  // pas assez de routes → les builders tracent d'abord un quadrillage de rues
  const grid=i=>{ const x=i%MW, y=i/MW|0; return x%5===2||y%5===2; };
  const wantRoads=t.filter(v=>v===1).length<MW*MH*.1||m.roads; if(wantRoads){ m.roads=1; free.sort((a,b)=>grid(b)-grid(a)); }
  for(let k=0;k<tiles;k++){
    if(wantRoads&&free.length&&grid(free[0])){ const j=free.shift(); t[j]=1; done++; continue; }
    if(free.length){ const j=free.splice(ri(0,free.length-1),1)[0]; t[j]=miss.length&&Math.random()<.4?miss.shift():pick([4,4,5,10,14,20,7,18]); done++; }
    else { const cand=t.map((v,i)=>UPG[v]!=null&&v!==0?i:-1).filter(i=>i>=0); if(!cand.length) break; const j=pick(cand); t[j]=UPG[t[j]]; done++; } }
  m.t=t.join(","); return done; }

  if(!silent&&built&&Math.random()<.25) logEv(`👷 Ton équipe a construit ${built} éléments sur tes maps aujourd'hui`);
  return -pw.cost; }

function rivalDay(){ const r=X().rv; r.w*=1+rnd(.001,.009); const me=netWorth(); if(r.w<me*.3&&Math.random()<.03){ r.w=me*rnd(.9,1.2); msg("rival","Je suis de retour. Et plus riche que toi 😏"); } if(!X().beat&&me>r.w){ X().beat=1; msg("rival","Quoi ?! Tu m'as dépassé ?! Ça va pas se passer comme ça… 😤"); return true; } if(me<r.w) X().beat=0; return false; }
function appQuest(){ const x=X(), r=x.rv, me=netWorth(), pct=Math.min(100,me/(me+r.w)*100), need=1e9*Math.pow(10,x.pres);
  $("main").innerHTML=back("Défis","🏆")+`<div class="card" style="background:linear-gradient(135deg,#3b0a0a,var(--card))"><b>😈 Ton rival : ${esc(r.n)}</b><div class="row" style="margin-top:8px"><span class="grow">⭐ Toi <b class="up">${fmt(me)}</b></span><span>${fmt(r.w)} <b>😈</b></span></div><div style="height:12px;background:#ef444455;border-radius:9px;overflow:hidden;margin-top:6px"><div style="height:100%;width:${pct}%;background:#22c55e"></div></div><p class="hint" style="margin:6px 0 0">${me>r.w?"🏆 Tu es devant lui ! Il va tout faire pour te repasser…":"Dépasse sa fortune pour gagner un gros bonus."}</p></div>
   <h2>🎯 Quêtes</h2>${QS.map(q=>{ const l=x.ql[q[0]]||0; if(l>=q[4].length) return `<div class="item"><div class="ic">${q[1]}</div><div class="grow"><div class="t">${q[2].replace("{v}",fmt(q[4][q[4].length-1])).replace("{n}",q[4][q[4].length-1].toLocaleString("fr-FR"))} ✅</div><div class="d">Toutes les étapes finies !</div></div></div>`; const t=q[4][l], v=q[3](), ok=v>=t; return `<div class="item"><div class="ic">${q[1]}</div><div class="grow"><div class="t">${q[2].replace("{v}",fmt(t)).replace("{n}",t.toLocaleString("fr-FR"))}</div><div class="d">${q[5]?fmt(Math.min(v,t)):Math.min(v,t).toLocaleString("fr-FR")} / ${q[5]?fmt(t):t.toLocaleString("fr-FR")} · étape ${l+1}/${q[4].length}</div><div style="height:6px;background:var(--line);border-radius:9px;margin-top:5px"><div style="height:100%;width:${Math.min(100,v/t*100)}%;background:var(--gold);border-radius:9px"></div></div></div><button class="btn ${ok?"g":"gh"}" data-qc="${q[0]}" ${ok?"":"disabled"}>🎁 ${fmt(qReward(q,l))}</button></div>`; }).join("")}
   <h2>🌟 Prestige ${x.pres?`(niveau ${x.pres} · tous tes revenus x${PMULT()})`:""}</h2><div class="card"><p style="margin-top:0">Recommence à zéro avec un <b>bonus permanent</b> : tous tes revenus <b>x${PMULT()*2}</b> pour toujours.</p><p class="hint">Il faut ${fmt(need)} de fortune. Tu perds ton argent et tes business, mais tu gardes le prestige.</p><button class="btn ${me>=need?"o":"gh"}" id="prs" style="width:100%" ${me>=need?"":"disabled"}>🌟 Passer prestige ${x.pres+1}</button></div>`;
  bindBack();
  document.querySelectorAll("[data-qc]").forEach(b=>b.onclick=()=>{ const q=QS.find(z=>z[0]===b.dataset.qc), l=x.ql[q[0]]||0, rw=qReward(q,l); x.ql[q[0]]=l+1; E.cash+=rw; save(); head(); cine({ic:"🏆",t:"QUÊTE RÉUSSIE",s:`Récompense : ${fmt(rw)}`,col:"or",ms:2600}); appQuest(); });
  $("prs").onclick=()=>{ if(!$("prs").dataset.k){ $("prs").dataset.k=1; $("prs").textContent="⚠️ Appuie encore : tout repart à zéro"; return; } doPrestige(); }; }
async function doPrestige(){ const k={pres:X().pres+1,ql:{},evOn:X().evOn,evF:X().evF}, keep={dly:E.dly,dlyS:E.dlyS,ach:E.ach}; await cine({ic:"🌟",t:"PRESTIGE "+k.pres,s:`Tout recommence… mais tes revenus sont maintenant x${Math.pow(2,k.pres)} pour toujours !`,col:"violet",ms:5000});
  const n=fresh(); Object.assign(n,keep); n.x={gog:null,coin:null,mus:null,cw:0,cl:0,luck:0,rv:null,beat:0,...k}; n.cash=300*Math.pow(10,k.pres); for(let i=0;i<45;i++){ step(n.st,STOCKS); step(n.cr,CRYPTO); } try{ localStorage.setItem(KEY,JSON.stringify(n)); }catch{} E=n; save(); location.reload(); }

/* ---------- ⏱ Chaque jour ---------- */
const _tick=tick;
tick=function(silent){ const c0=E.cash; _tick(silent); const g=E.cash-c0; if(g>0) E.cash+=g*(PMULT()*ECO()-1);
  const x=X(); let v=gogDay()+musDay(); if(x.coin) coinMove(x.coin,1); E.cash+=v>0?v*PMULT()*ECO():v;
  const g2=x.gog; if(g2&&g2.top){ const s=(P().sites||[]).find(z=>z.id==g2.top); if(s) s.users=(s.users||0)+Math.round(g2.s*.003); }
  if(x.coin&&x.coin.q<1) x.coin.q=0;
  if(rivalDay()&&!silent){ const rw=Math.round(netWorth()*.01); E.cash+=rw; logEv(`🏆 Tu as dépassé ${x.rv.n} ! Bonus ${fmt(rw)}`); cine({ic:"🏆",t:"TU AS BATTU TON RIVAL",s:`${x.rv.n} est derrière toi. Bonus : ${fmt(rw)} !`,col:"or"}); }
  else if(!silent&&x.evOn&&!$("cine")&&Math.random()<1/(x.evF||45)) runEv(pick(XEV)[0]); };
const _di=dailyIncome; dailyIncome=function(){ const x=E.x, d=_di()+(x?((x.gog&&x.gog.last)||0)+((x.mus&&x.mus.last)||0):0); return d>0?d*PMULT()*ECO():d; };

/* ---------- 🛠️ Panel : événements, cinématiques et nouveautés ---------- */
function xAdminHTML(){ const x=X(); return `<h2 style="margin-top:18px">🎬 Événements & cinématiques</h2>
  <div class="row" style="gap:6px;flex-wrap:wrap"><select class="in" id="xev" style="width:auto">${XEV.map(e=>`<option value="${e[0]}">${e[1]} ${e[2]}</option>`).join("")}</select><button class="btn" id="xevb">▶️ Lancer l'événement</button></div>
  <div class="qty" style="margin-top:6px"><button id="xevr">🎲 Événement au hasard</button><button id="xevo">${x.evOn?"✅":"⬜"} Événements automatiques</button><select class="in" id="xevf" style="width:auto"><option value="120" ${x.evF==120?"selected":""}>Rares</option><option value="45" ${x.evF==45?"selected":""}>Normaux</option><option value="12" ${x.evF==12?"selected":""}>Souvent</option><option value="3" ${x.evF==3?"selected":""}>Tout le temps</option></select></div>
  <p class="hint" style="margin:10px 0 4px">🎬 Crée ta propre cinématique :</p><div class="row" style="gap:6px;flex-wrap:wrap"><input class="in" id="xci" placeholder="Emoji" value="👑" style="max-width:70px"><input class="in" id="xct" placeholder="Titre" value="LLMMS EST LE PLUS RICHE"></div>
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><input class="in" id="xcs" placeholder="Texte en dessous" value="Personne ne peut l'arrêter."><select class="in" id="xcc" style="width:auto">${Object.keys(CSTY).map(k=>`<option>${k}</option>`).join("")}</select><input class="in" id="xcg" type="number" placeholder="€ à gagner (option)" style="max-width:150px"><button class="btn o" id="xcb">🎬 Jouer</button></div>
  <h2 style="margin-top:18px">✨ Nouveautés</h2>
  <div class="row" style="gap:6px;flex-wrap:wrap"><input class="in" id="xrv" type="number" placeholder="Fortune du rival €" style="max-width:190px"><button class="btn" id="xrvb">😈 Mettre</button><button class="btn gh" id="xrvd">😈 Rival ruiné</button></div>
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><input class="in" id="xgs" type="number" placeholder="Recherches Gogole/jour" style="max-width:190px"><button class="btn" id="xgsb">🔎 Mettre</button></div>
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><input class="in" id="xcp" type="number" step="any" placeholder="Prix de ta crypto €" style="max-width:190px"><button class="btn" id="xcpb">🪙 Mettre</button></div>
  <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:6px"><input class="in" id="xps" type="number" min="0" max="30" placeholder="Niveau prestige" value="${x.pres}" style="max-width:150px"><button class="btn" id="xpsb">🌟 Mettre</button></div>
  <div class="qty" style="margin-top:6px"><button id="xlk">${x.luck?"✅":"⬜"} 🎰 Toujours gagner au casino</button><button id="xtb">💿 Tube pour tous mes artistes</button><button id="xql">🏆 Finir toutes les quêtes</button><button id="xall">🎁 Débloquer Gogole, crypto et label</button></div>`; }
function xAdminBind(ok){ const x=X();
  $("xevb").onclick=()=>{ closePop(); runEv($("xev").value); }; $("xevr").onclick=()=>{ closePop(); runEv(pick(XEV)[0]); };
  $("xevo").onclick=()=>{ x.evOn=!x.evOn; ok(x.evOn?"✅ Événements automatiques":"⬜ Événements coupés"); admin(); }; $("xevf").onchange=()=>{ x.evF=+$("xevf").value; ok("⏱ Fréquence changée"); };
  $("xcb").onclick=()=>{ const gain=+$("xcg").value||0, o={ic:$("xci").value||"🎬",t:$("xct").value,s:$("xcs").value,col:$("xcc").value}; closePop(); cine(o).then(()=>{ if(gain){ E.cash+=gain; save(); head(); toast("+"+fmt(gain)); } }); };
  $("xrvb").onclick=()=>{ const v=+$("xrv").value; if(!$("xrv").value) return toast("Écris un montant"); x.rv.w=Math.max(0,v); x.beat=0; ok("😈 Fortune du rival : "+fmt(x.rv.w)); };
  $("xrvd").onclick=()=>{ x.rv.w=1000; ok("😈 Le rival est ruiné !"); };
  $("xgsb").onclick=()=>{ if(!x.gog) x.gog={s:0,q:1,ads:0,mk:0,last:0,top:null,tot:0}; x.gog.s=Math.max(0,Math.floor(+$("xgs").value||0)); x.gog.q=Math.max(x.gog.q,Math.ceil(Math.pow(x.gog.s/20000,1/2.3))); ok("🔎 Gogole : "+x.gog.s.toLocaleString("fr-FR")+" recherches/jour"); };
  $("xcpb").onclick=()=>{ if(!x.coin) x.coin={n:"LLMMS Coin",p:.001,q:4e8,hype:1,hold:50,h:[.001],sold:0}; const v=+$("xcp").value; if(!(v>0)) return toast("Écris un prix"); x.coin.p=v; x.coin.h.push(v); ok("🪙 Prix : "+fmt(v,1)); };
  $("xpsb").onclick=()=>{ x.pres=Math.max(0,Math.min(30,Math.floor(+$("xps").value||0))); ok(`🌟 Prestige ${x.pres} : revenus x${PMULT()}`); };
  $("xlk").onclick=()=>{ x.luck=!x.luck; ok(x.luck?"🎰 Tu gagnes à chaque fois":"🎰 Casino normal"); admin(); };
  $("xtb").onclick=()=>{ if(!x.mus||!x.mus.a.length) return toast("Crée ton label et signe un artiste"); x.mus.a.forEach(a=>a.str=(a.str||0)+5e6); ok("💿 +5 M écoutes/jour pour chaque artiste"); };
  $("xql").onclick=()=>{ QS.forEach(q=>x.ql[q[0]]=q[4].length); ok("🏆 Toutes les quêtes finies"); };
  $("xall").onclick=()=>{ if(!x.gog) x.gog={s:5000,q:1,ads:0,mk:0,last:0,top:null,tot:0}; if(!x.coin) x.coin={n:"LLMMS Coin",p:.001,q:4e8,hype:1,hold:50,h:[.001],sold:0}; if(!x.mus) x.mus={n:"LLMMS Records",a:[],pool:[],last:0}; ok("🎁 Gogole, crypto et label débloqués"); }; }


/* ---------- DÉMARRAGE ---------- */
if(!E.market.length) refreshMarket();
const away=Math.min(400,Math.floor((Date.now()-(E.ts||Date.now()))/4000));
if(away>=3){ const c0=E.cash; for(let i=0;i<away;i++) tick(1); if(E.cash<c0) E.cash=c0; save(); setTimeout(()=>popup(`<h3>👋 Bon retour !</h3><p>Pendant ton absence, <b>${away} jours</b> sont passés.</p><p style="font-size:22px;font-weight:900" class="${E.cash>=c0?"up":"dn"}">${E.cash>=c0?"+":""}${fmt(E.cash-c0)}</p><button class="btn g" id="x" style="width:100%">Super !</button>`,()=>{ $("x").onclick=closePop; }),300); }
else if(E.day===1&&!E.taps) setTimeout(()=>popup(`<h3>💼 Bienvenue dans EMPIRE MILLIONNAIRE</h3><p>Tu commences avec <b>300 €</b>. Ton but : devenir <b>la personne la plus riche du monde</b>.</p><p class="hint">1️⃣ Touche l'écran pour gagner de l'argent et monte le niveau de ton clic.<br>2️⃣ Crée ton premier business : un magasin à 5 000 €.<br>3️⃣ Investis dans les actions, l'immobilier et la crypto.<br>4️⃣ Fusionne tes entreprises pour créer des empires.<br>5️⃣ Achète voitures, jets, yachts, tableaux et îles.<br><br>1 jour = 4 secondes, même jeu fermé. Le panel 🛠️ est en haut à droite.</p><button class="btn g" id="x" style="width:100%">C'est parti !</button>`,()=>{ $("x").onclick=closePop; }),300);
/* ---------- 🗑️ Réinitialiser la partie ---------- */
function askReset(){ popup(`<h3>🗑️ Réinitialiser ta partie ?</h3><p>Tout sera effacé : <b>argent, business, investissements, applis, abonnés, jeux Bloxy, prestige…</b> sur cet appareil et dans la sauvegarde en ligne.</p><p class="dn"><b>⚠️ Impossible de revenir en arrière.</b></p><p class="hint">Pour confirmer, écris <b>RESET</b> :</p><input class="in" id="rsv" placeholder="RESET" autocapitalize="characters"><div class="row" style="margin-top:12px;gap:8px"><button class="btn gh" id="rsn" style="flex:1">Annuler</button><button class="btn r" id="rsy" style="flex:1" disabled>🗑️ Tout effacer</button></div>`,()=>{
  $("rsv").oninput=()=>{ $("rsy").disabled=$("rsv").value.trim().toUpperCase()!=="RESET"; };
  $("rsn").onclick=closePop;
  $("rsy").onclick=async()=>{ $("rsy").disabled=true; $("rsy").textContent="Effacement…"; const n=fresh(); for(let i=0;i<45;i++){ step(n.st,STOCKS); step(n.cr,CRYPTO); } n.ts=Date.now(); E=n;
    try{ localStorage.setItem(KEY,JSON.stringify(n)); localStorage.removeItem(KEY+"_bak"); }catch{}
    try{ await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:CID,data:n})}); }catch{}
    location.reload(); }; }); }
draw(); startClock();
// partie plus récente en ligne (autre appareil / navigateur) → on la reprend
(async()=>{ try{ const d=await cloudLoad(CID); if(d&&d.ts&&d.ts>LOCAL_TS+10000&&typeof d.cash==="number"){ localStorage.setItem(KEY,JSON.stringify(d)); location.reload(); } else { cloudDirty=true; cloudSave(); } }catch{} })();
window.__E=E;
})();
</script>
